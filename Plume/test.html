<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plume — mechanics tests</title>
<style>
  body{margin:0;background:#12141a;color:#e8eaf0;
    font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;}
  /* The app must run at a DESKTOP-sized viewport, because that is the layout
     the geometry assertions measure — at 520px it would be in compact mode and
     every panel-overlap check would be testing the wrong thing.

     So the iframe keeps a real 1024x768 internal viewport and is only SCALED
     visually to fit the window. A CSS transform on the parent does not change
     the iframe's own clientWidth/clientHeight, so the app still lays itself
     out as a desktop, while the page itself fits any screen. */
  html,body{height:100%;overflow:hidden;}
  #wrap{display:flex;flex-direction:column;height:100vh;}
  #out{flex:1 1 auto;overflow:auto;padding:14px 18px;white-space:pre-wrap;min-height:0;}
  #stageWrap{flex:0 0 auto;position:relative;overflow:hidden;
    border-top:1px solid #333846;background:#0b0d12;}
  #stageLabel{position:absolute;right:8px;top:6px;z-index:2;font-size:10px;
    color:#666e82;letter-spacing:.05em;pointer-events:none;}
  iframe{width:1024px;height:768px;border:0;display:block;transform-origin:top left;}
  .ok{color:#6bdc9b;} .fail{color:#ff5d7e;font-weight:700;}
  .grp{color:#ff8a3d;margin-top:14px;display:block;font-weight:700;}
  .sum{margin-top:18px;font-size:15px;font-weight:700;}
  .note{color:#8b91a3;}
</style>
</head>
<body>
<div id="wrap">
  <div id="out">loading plume.html…</div>
  <div id="stageWrap">
    <span id="stageLabel">app under test — 1024×768 viewport, scaled to fit</span>
    <iframe id="app" src="plume.html"></iframe>
  </div>
</div>
<script>
/* ==========================================================================
   Plume mechanics tests.
   Drives the real app inside an iframe through real PointerEvents, so the
   input routing, projection and history paths are all exercised, not stubbed.
   Node is not required — open this file over http:// and read the left pane.
   ========================================================================== */
var out = document.getElementById('out');
var frame = document.getElementById('app');
var pass = 0, fail = 0, lines = [];

/* Scale the fixture to fit, without changing the viewport the app sees.
   Capped so the results pane always keeps most of the window. */
var APP_W = 1024, APP_H = 768;
function fitFrame(){
  var wrap = document.getElementById('stageWrap');
  var avail = wrap.clientWidth || document.documentElement.clientWidth;
  var maxH = document.documentElement.clientHeight * 0.45;
  var k = Math.min(1, avail/APP_W, maxH/APP_H);
  /* transforms apply right to left, so this scales first and then centres the
     already-scaled box — otherwise the fixture hugs the left edge and leaves a
     wide empty gutter */
  var offset = Math.max(0, (avail - APP_W*k) / 2);
  frame.style.transform = 'translateX(' + offset.toFixed(1) + 'px) scale(' + k + ')';
  wrap.style.height = Math.round(APP_H * k) + 'px';
}
window.addEventListener('resize', fitFrame);
fitFrame();

function group(name){ lines.push('<span class="grp">' + name + '</span>'); }
function ck(name, cond, extra){
  if(cond){ pass++; lines.push('<span class="ok">ok  </span> ' + name +
    (extra !== undefined ? ' <span class="note">[' + extra + ']</span>' : '')); }
  else { fail++; lines.push('<span class="fail">FAIL</span> ' + name +
    (extra !== undefined ? ' <span class="note">[' + extra + ']</span>' : '')); }
}
function flush(){
  out.innerHTML = lines.join('\n') + '\n\n<div class="sum ' + (fail ? 'fail' : 'ok') + '">' +
    (fail ? fail + ' FAILURE(S) of ' + (pass+fail) : 'ALL PASS (' + pass + ' checks)') + '</div>';
}

/* Opening this file directly (file://…/test.html) cannot work: Chrome gives
   every file:// document its own opaque origin, so reading into the iframe to
   drive the app throws a SecurityError. plume.html itself opens fine that way
   — only this harness needs an http origin. Say so plainly rather than sitting
   on "loading…" forever. */
function explainFileOrigin(err){
  out.innerHTML =
    '<div class="sum fail">This harness needs an http:// origin</div>\n\n' +
    'You opened it over <b>' + location.protocol + '</b>, and Chrome gives every\n' +
    'file:// page its own origin — so this page is not permitted to reach\n' +
    'into the iframe and drive the app.\n\n' +
    '<span class="grp">Serve it instead</span>\n' +
    '  <b>powershell -ExecutionPolicy Bypass -File .claude/serve.ps1</b>\n' +
    '  then open <b>http://localhost:8123/test.html</b>\n\n' +
    '<span class="note">plume.html on its own is perfectly happy as a file://\n' +
    'page — this restriction only affects the test harness.</span>' +
    (err ? '\n\n<span class="note">(' + err + ')</span>' : '');
}

var harnessStarted = false;

frame.onload = function(){
  harnessStarted = true;
  var W = frame.contentWindow, P0;
  try {
    void W.document.title;            // trips the SecurityError before anything else
    P0 = W.P;
  } catch(err){
    explainFileOrigin(err && (err.name || err.message));
    return;
  }
  if(!P0){ out.textContent = 'plume.html did not initialise (P is undefined)'; return; }
  /* Never write over the real autosave slot, and never let a restore land in
     the middle of a test run — P.ready settles once boot's restore attempt
     has finished either way. */
  P0.Doc.autosave = false;
  out.textContent = 'waiting for boot…';
  (P0.ready || Promise.resolve()).then(function(){ run(W); });
};

/* The iframe can finish before this script runs, in which case onload never
   fires for us. Poking readyState also trips the file:// SecurityError, which
   gets the explanation on screen immediately rather than after a timeout. */
try {
  if(!harnessStarted && frame.contentWindow &&
     frame.contentWindow.document.readyState === 'complete'){
    frame.onload();
  }
} catch(err){
  explainFileOrigin(err && (err.name || err.message));
}

/* and a backstop, so the pane never just sits on "loading…" */
setTimeout(function(){
  if(!harnessStarted) explainFileOrigin('the iframe never signalled load');
}, 8000);

function run(W){
  var P = W.P, THREE = W.THREE;
  P.Doc.autosave = false;
  P.Doc.clear();

  var vp = P.viewport(), CX = vp.left + vp.w/2, CY = vp.top + vp.h/2;
  function vpo(){ return P.viewport(); }        // live, for zoom-dependent checks

  function pen(pts){
    var el = P.elStage;
    function ev(t,x,y,b){
      el.dispatchEvent(new W.PointerEvent(t,{pointerId:99, pointerType:'pen',
        clientX:x, clientY:y, buttons:b, pressure:b?0.6:0, tiltX:0, tiltY:0,
        bubbles:true, cancelable:true}));
    }
    ev('pointerdown', pts[0].x, pts[0].y, 1);
    for(var i=1;i<pts.length;i++) ev('pointermove', pts[i].x, pts[i].y, 1);
    ev('pointerup', pts[pts.length-1].x, pts[pts.length-1].y, 0);
  }
  /* granular versions, for inspecting a stroke mid-drag */
  function penEvent(type, x, y, buttons){
    P.elStage.dispatchEvent(new W.PointerEvent(type, {pointerId:99, pointerType:'pen',
      clientX:x, clientY:y, buttons:buttons, pressure:buttons?0.6:0,
      tiltX:0, tiltY:0, bubbles:true, cancelable:true}));
  }
  function penDown(x,y){ penEvent('pointerdown', x, y, 1); }
  function penMoveTo(x,y){ penEvent('pointermove', x, y, 1); }
  function penUpAt(x,y){ penEvent('pointerup', x, y, 0); }
  function circle(cx,cy,r,n){
    var o=[]; n=n||48;
    for(var i=0;i<=n;i++){ var a=i/n*Math.PI*2; o.push({x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r}); }
    return o;
  }
  function penTilt(pts, tiltX, tiltY){
    var el = P.elStage;
    function ev(t,x,y,b){
      el.dispatchEvent(new W.PointerEvent(t,{pointerId:98, pointerType:'pen',
        clientX:x, clientY:y, buttons:b, pressure:b?0.6:0,
        tiltX:tiltX||0, tiltY:tiltY||0, bubbles:true, cancelable:true}));
    }
    ev('pointerdown', pts[0].x, pts[0].y, 1);
    for(var i=1;i<pts.length;i++) ev('pointermove', pts[i].x, pts[i].y, 1);
    ev('pointerup', pts[pts.length-1].x, pts[pts.length-1].y, 0);
  }
  var ts = function(p){ return P.worldToScreen(p, {}); };
  function plen(st){
    var L=0; for(var i=1;i<st.pts.length;i++) L += st.pts[i].p.distanceTo(st.pts[i-1].p);
    return L;
  }
  function reset(){
    P.Strokes.clear(); P.Guides.setActive(null); P.Guides.resources.length = 0;
    P.Strokes.groups.length = 0; P.Strokes.activeGroup = 0; P.Strokes.ensureGroup();
    P.History.clear(); P.TOOL.mirror = null; P.Guides.isolate = true;
    P.TOOL.sizeMM = 14; P.TOOL.eraserMM = 20;
    P.TOOL.autoGuide = false; P.TOOL.brush = 'pen';
    /* back to the defaults, so one group cannot quietly change the ground
       every group after it stands on. The background is the one that bit:
       a document round-trip set it to a dark navy and left it there, which
       made every later pixel reading in the suite darker than the app it was
       supposed to be measuring. */
    P.TOOL.shapeHold = true; P.TOOL.opacity = 1;
    P.ENV.bg.set('#eceaf3'); P.ENV.render = false; P.ENV.groundShadow = true;
    P.ENV.grid = true; P.ENV.axis = false; P.ENV.fog = false; P.ENV.shaded = true;
    P.applyEnv(); P.Strokes.setShaded(true);
    /* the light and the post effects belong here for the same reason the
       background does: they are global, every pixel reading depends on them,
       and a group that leaves the sun somewhere else silently darkens every
       group that follows it */
    P.LIGHT.az = 0.4185; P.LIGHT.alt = 0.6664; P.LIGHT.color.set('#ffffff');
    P.LIGHT.intensity = 1; P.LIGHT.ambient = 0.66;
    P.LIGHT.toon = false; P.LIGHT.toonSteps = 4; P.applyLight();
    P.FX.dofOn = false; P.FX.fstop = 5.6;
    P.FX.grainOn = false; P.FX.grain = 35;
    P.FX.pixelOn = false; P.FX.pixel = 4;
    P.VIEW.theta = 0.6; P.VIEW.phi = 1.1; P.VIEW.radius = 4; P.VIEW.roll = 0;
    P.VIEW.ortho = false; P.VIEW.focal = 50;
    P.VIEW.pivot.set(0,0,0); P.VIEW.pinned = true; P.applyCamera();
    P.setTool('draw');
  }
  var walk = W.document.getElementById('walk');
  if(walk) walk.classList.add('hidden');

  /* ================= A.1 guide creation ================= */
  group('A.1  Guide creation from the first stroke');
  reset(); P.TOOL.autoGuide = true;
  pen(circle(CX, CY, 70));
  var g = P.Guides.active;
  ck('the first stroke makes a guide, not a curve', !!g && P.Strokes.list.length === 0);
  ck('guide is a swept surface', !!(g && g.sweep));
  ck('extrusion runs along the view direction', !!g &&
     Math.abs(g.sweep.basisT.dot(P.cam().getWorldDirection(new THREE.Vector3())) - 1) < 1e-6);
  ck('orange starting edge exists at the anchor row', !!(g && g.orange));
  ck('anchor row sits near one side, not the middle', !!g &&
     g.sweep.anchorIndex < g.sweep.path.length * 0.25,
     'row ' + g.sweep.anchorIndex + ' of ' + g.sweep.path.length);

  /* ================= A.4 projection ================= */
  group('A.4  Projection of subsequent strokes');
  P.VIEW.theta += 0.95; P.applyCamera();
  pen([{x:CX-90,y:CY-60},{x:CX-40,y:CY-20},{x:CX,y:CY},{x:CX+40,y:CY+20},{x:CX+80,y:CY+50}]);
  var st = P.Strokes.list[P.Strokes.list.length-1];
  ck('a stroke from a new viewpoint becomes a curve', P.Strokes.list.length === 1 && st.pts.length >= 2);
  ck('projected points carry a surface normal', !!(st && st.pts[0].nrm));
  ck('cross-section frames are frozen on commit', !!(st && st.pts[0].tan && st.pts[0].ref));

  /* the guide is a straight extrusion of the profile, so every surface point's
     (x,y) in the anchor frame must lie ON the profile polyline */
  var sw = g.sweep, t0 = sw.basisT, r0 = sw.basisR;
  var s0 = new THREE.Vector3().crossVectors(t0, r0), prof = sw.local;
  function distToProfile2D(px, py){
    var best = Infinity;
    for(var i=0;i<prof.length-1;i++){
      var ax=prof[i].x, ay=prof[i].y, bx=prof[i+1].x, by=prof[i+1].y;
      var vx=bx-ax, vy=by-ay, L=vx*vx+vy*vy;
      var t = L<1e-12 ? 0 : Math.max(0, Math.min(1, ((px-ax)*vx+(py-ay)*vy)/L));
      best = Math.min(best, Math.hypot(px-(ax+vx*t), py-(ay+vy*t)));
    }
    return best;
  }
  var maxOff = 0, d = new THREE.Vector3(), ext = 0;
  for(var i=0;i<st.pts.length;i++){
    d.subVectors(st.pts[i].p, sw.anchor);
    maxOff = Math.max(maxOff, distToProfile2D(d.dot(r0), d.dot(s0)));
  }
  for(i=0;i<prof.length;i++) ext = Math.max(ext, Math.hypot(prof[i].x, prof[i].y));
  ck('every projected point lies exactly on the guide surface',
     maxOff < ext*1e-6, 'max offset ' + maxOff.toExponential(1));

  /* ================= A.6 bend ================= */
  group('A.6  Bend — the documented cylinder to doughnut');
  reset(); P.TOOL.autoGuide = true;
  var fv = P.ORTHO_VIEWS[0];
  P.VIEW.theta = fv.theta; P.VIEW.phi = fv.phi; P.applyCamera();
  pen(circle(CX, CY, 70));
  var gg = P.Guides.active;
  var localBefore = JSON.stringify(gg.sweep.local);
  var boxBefore = new THREE.Box3().setFromObject(gg.mesh).getSize(new THREE.Vector3());
  var profR = Math.max.apply(null, gg.sweep.local.map(function(l){ return Math.hypot(l.x,l.y); }));

  var tv = P.ORTHO_VIEWS[4];
  P.VIEW.theta = tv.theta; P.VIEW.phi = tv.phi; P.applyCamera();
  P.setTool('bend');
  pen(circle(CX, CY, 180, 64));
  var boxAfter = new THREE.Box3().setFromObject(gg.mesh).getSize(new THREE.Vector3());

  ck('the first stroke profile is preserved exactly',
     JSON.stringify(gg.sweep.local) === localBefore);
  ck('bending starts from the orange line',
     gg.sweep.anchorIndex === 0 && gg.sweep.path[0].distanceTo(gg.sweep.anchor) < 1e-9);
  /* This used to assert that the sweep left the anchor along the guide's
     ORIGINAL extrusion axis. That was the bug, not the contract: forcing the
     alignment rotated the drawn stroke, and reversed it outright when the two
     directions opposed. The real invariant is that the path is the stroke as
     drawn, translated to the anchor — checked by the "Bend follows the
     direction drawn" group below. */
  ck('the sweep path is the drawn stroke, not a rotated copy of it',
     gg.sweep.path.length === P.TUNE.guidePathSeg + 1);

  var pos = gg.mesh.geometry.attributes.position, path = gg.sweep.path;
  var p = new THREE.Vector3(), lo = Infinity, hi = -Infinity;
  for(i=0;i<pos.count;i+=7){
    p.set(pos.getX(i), pos.getY(i), pos.getZ(i));
    var best = Infinity;
    for(var j=0;j<path.length;j++) best = Math.min(best, p.distanceTo(path[j]));
    lo = Math.min(lo,best); hi = Math.max(hi,best);
  }
  ck('result is a true swept tube, not a shear',
     Math.abs(hi - profR) < profR*0.15 && (hi-lo) < profR*0.25,
     'tube radius ' + lo.toFixed(3) + '–' + hi.toFixed(3) + ' vs profile ' + profR.toFixed(3));
  ck('cylinder became a doughnut', boxAfter.x > boxBefore.x*2 && boxAfter.y < boxAfter.x*0.6,
     '[' + boxBefore.toArray().map(function(v){return v.toFixed(2);}) + '] -> [' +
           boxAfter.toArray().map(function(v){return v.toFixed(2);}) + ']');

  P.History.undo();
  ck('bend is undoable', gg.sweep.anchorIndex !== 0);
  P.History.redo();

  /* ================= A.9 mask ================= */
  group('A.9  Guide as an isolation mask');
  reset();
  pen([{x:CX-40,y:CY},{x:CX-20,y:CY},{x:CX,y:CY},{x:CX+20,y:CY},{x:CX+40,y:CY}]);
  var target = P.Strokes.list[0].pts[2].p.clone();
  P.Guides.setActive(P.Guides.primitive('sphere', 24, 1));
  ck('a point behind the guide reports as masked', P.Guides.isMasked(target) === true);
  var sc = ts(target);
  ck('select is blocked by the mask', P.Strokes.hitTest(sc.x, sc.y) === null);
  P.setTool('erase'); P.TOOL.sizeMM = 60;
  pen([{x:sc.x,y:sc.y},{x:sc.x+2,y:sc.y}]);
  ck('erase is blocked by the mask', P.Strokes.list.length === 1, 'n=' + P.Strokes.list.length);
  P.Guides.isolate = false;
  ck('select works with isolation off', P.Strokes.hitTest(sc.x, sc.y) !== null);
  pen([{x:sc.x,y:sc.y},{x:sc.x+2,y:sc.y}]);
  ck('erase works with isolation off', P.Strokes.list.length !== 1, 'n=' + P.Strokes.list.length);

  /* ================= C.6 erase / vacuum ================= */
  group('C.6  Eraser and Vacuum');
  reset();
  /* A curve is stored with two samples only if it is BUILT that way — a
     two-point drag is densified on commit now — and the point of this case is
     that the eraser cuts between samples, not only at them. */
  P.TOOL.eraserMM = 60;
  pen([{x:CX-200,y:CY},{x:CX+200,y:CY}]);
  var drawn2 = P.Strokes.list[0];
  var sparse = P.Strokes.cloneWithPoints(drawn2,
                 [drawn2.pts[0], drawn2.pts[drawn2.pts.length-1]]);
  P.Strokes.clear(); P.Strokes.add(sparse);
  var s2 = P.Strokes.list[0], full = plen(s2);
  ck('sparse two-point curve', s2.pts.length === 2);
  var a2 = ts(s2.pts[0].p), b2 = ts(s2.pts[1].p);
  var erasePx = Math.max(4, P.worldToPx(P.Tools.eraserRadius()));
  P.setTool('erase');
  pen([{x:(a2.x+b2.x)/2,y:(a2.y+b2.y)/2},{x:(a2.x+b2.x)/2+1,y:(a2.y+b2.y)/2}]);
  ck('a thin eraser splits even a two-point curve', P.Strokes.list.length === 2,
     'n=' + P.Strokes.list.length);
  var kept = P.Strokes.list.reduce(function(s,x){ return s + plen(x); }, 0);
  ck('the cut width matches the eraser diameter',
     Math.abs(P.worldToPx(full-kept) - 2*erasePx) < erasePx*0.5,
     'gap ' + P.worldToPx(full-kept).toFixed(1) + 'px vs ' + (2*erasePx).toFixed(1) + 'px');
  ck('new endpoints carry interpolated data',
     P.Strokes.list[0].pts[1].pressure > 0 && !!P.Strokes.list[0].pts[1].tan);
  P.History.undo();
  ck('the split is undoable', P.Strokes.list.length === 1 &&
     Math.abs(plen(P.Strokes.list[0]) - full) < 1e-9);

  reset();
  var tiny = Math.max(2, erasePx*0.25);
  pen([{x:CX-tiny,y:CY},{x:CX,y:CY},{x:CX+tiny,y:CY}]);
  var c3 = ts(P.Strokes.list[0].pts[1].p);
  P.setTool('erase'); P.TOOL.eraserMM = 60;
  pen([{x:c3.x,y:c3.y},{x:c3.x+1,y:c3.y}]);
  ck('a fully covered curve is removed outright', P.Strokes.list.length === 0);

  reset();
  pen([{x:CX-150,y:CY},{x:CX-75,y:CY},{x:CX,y:CY},{x:CX+75,y:CY},{x:CX+150,y:CY}]);
  var v1 = ts(P.Strokes.list[0].pts[1].p);
  P.setTool('vacuum');
  pen([{x:v1.x,y:v1.y},{x:v1.x+1,y:v1.y}]);
  ck('vacuum deletes the whole curve', P.Strokes.list.length === 0);
  P.History.undo();
  ck('vacuum is undoable', P.Strokes.list.length === 1);

  /* ================= C.9 draw shape ================= */
  group('C.9  Draw Shape');
  reset(); P.setTool('shape');
  var wob = [];
  for(i=0;i<=20;i++) wob.push({x:CX-150+i*15, y:CY+Math.sin(i*1.7)*3});
  pen(wob);
  var sh = P.Strokes.list[0];
  var A = sh.pts[0].p, B = sh.pts[sh.pts.length-1].p, ab = B.clone().sub(A), L = ab.length(), dev = 0;
  for(i=0;i<sh.pts.length;i++) dev = Math.max(dev, sh.pts[i].p.clone().sub(A).cross(ab).length()/L);
  ck('a nearly straight stroke snaps to a line', dev < L*0.005, 'dev/len ' + (dev/L).toExponential(1));

  reset(); P.setTool('shape');
  pen(circle(CX, CY, 90, 40));
  var ci = P.Strokes.list[0];
  /* a closed circle repeats its first point to shut the loop; counting it
     twice would drag the centroid off centre and fake an ellipse */
  var uniq = ci.pts.slice();
  if(uniq.length > 1 && uniq[0].p.distanceTo(uniq[uniq.length-1].p) < 1e-9) uniq.pop();
  var ctr = new THREE.Vector3();
  for(i=0;i<uniq.length;i++) ctr.add(uniq[i].p);
  ctr.multiplyScalar(1/uniq.length);
  var rlo = Infinity, rhi = -Infinity;
  for(i=0;i<uniq.length;i++){
    var rr = uniq[i].p.distanceTo(ctr); rlo = Math.min(rlo,rr); rhi = Math.max(rhi,rr);
  }
  ck('a rough loop snaps to a perfect circle', (rhi-rlo) < rhi*0.01,
     'radius ' + rlo.toFixed(4) + '–' + rhi.toFixed(4) + ', ' + uniq.length + ' pts');
  ck('the fitted circle is closed', ci.pts.length === uniq.length + 1);

  /* ---- and closed means WELDED, not two ends parked on the same spot ----
     A ring built as a tube gets one cap disc at each end, stacked on the one
     point and tilted apart by a whole angular step, because the endpoint
     tangents are one-sided chords. That wedge is the slit that shows at the
     top of every snapped circle: 360/64 = 5.625 degrees of it, gaping at the
     outer edge and pinched shut on the inside. */
  ck('the ring is recognised as a closed loop', P.Strokes.loopsClosed(ci.pts));
  var t0 = ci.pts[0].tan, tN = ci.pts[ci.pts.length-1].tan;
  var r0 = ci.pts[0].ref, rN = ci.pts[ci.pts.length-1].ref;
  /* Measured as the CHORD between the two unit vectors, not acos of their dot.
     Near zero angle acos amplifies float error — identical vectors come back as
     1e-6 degrees apart — and a threshold under that noise floor fails on
     nothing. The chord is 2*sin(a/2), so it degrades gracefully instead. */
  var chordDeg = function(a,b){
    return 2 * Math.asin(Math.min(1, a.distanceTo(b)/2)) * 180/Math.PI;
  };
  ck('its two ends share one tangent', chordDeg(t0,tN) < 1e-4,
     chordDeg(t0,tN).toExponential(1) + ' deg, was 5.625 when it slit');
  ck('and one cross-section, so the tube cannot step at the joint',
     chordDeg(r0,rN) < 1e-4, chordDeg(r0,rN).toExponential(1) + ' deg');

  /* the real proof: every edge shared by exactly two triangles */
  function shellOf(stroke){

    P.FX.dofOn = false; P.FX.fstop = 11; P.FX.grainOn = false; P.FX.grain = 5;
    P.FX.pixelOn = false; P.FX.pixel = 2;
    P.ENV.render = false; P.ENV.groundShadow = true; P.applyEnv();
    P.Doc.restore(JSON.parse(doc2));

    ck('the light survives a round trip',
       Math.abs(P.LIGHT.az - 1.23) < 1e-5 && Math.abs(P.LIGHT.alt - 0.77) < 1e-5 &&
       Math.abs(P.LIGHT.intensity - 0.62) < 1e-5 &&
       Math.abs(P.LIGHT.ambient - 0.41) < 1e-5 &&
       P.LIGHT.color.getHexString() === 'ffd0a0' && P.LIGHT.toon === true,
       P.LIGHT.color.getHexString() + ' toon=' + P.LIGHT.toon);
    ck('render mode and ground shadow survive',
       P.ENV.render === true && P.ENV.groundShadow === false);
    ck('depth of field survives, on and at its f-stop',
       P.FX.dofOn === true && Math.abs(P.FX.fstop - 2.8) < 1e-5,
       'dof=' + P.FX.dofOn + ' f/' + P.FX.fstop);
    ck('grain survives, on and at its level',
       P.FX.grainOn === true && Math.abs(P.FX.grain - 51) < 1e-5,
       'grain=' + P.FX.grainOn + ' ' + P.FX.grain + '%');
    ck('pixelation survives, on and at its block size',
       P.FX.pixelOn === true && Math.abs(P.FX.pixel - 7) < 1e-5,
       'pixel=' + P.FX.pixelOn + ' ' + P.FX.pixel + 'px');

    /* and a document saved before any of this existed must still open */
    var older = JSON.parse(doc2);
    delete older.env.fx; delete older.env.light;
    var okOld = false;
    try { okOld = P.Doc.restore(older); } catch(e){ okOld = 'threw: ' + e.message; }
    ck('a document with no fx or light block still opens', okOld === true, String(okOld));
  })();
  ck('history is cleared by a restore, not left dangling', !P.History.canUndo());

  var tv2 = P.ORTHO_VIEWS[4];
  P.VIEW.theta = tv2.theta; P.VIEW.phi = tv2.phi; P.applyCamera();
  P.setTool('bend');
  pen(circle(CX, CY, 150, 48));
  ck('and bending it actually works after a reload',
     P.Guides.active.sweep.anchorIndex === 0);
  ck('that bend is itself undoable', P.History.canUndo());

  var badDoc = P.Doc.restore({format:'notplume', version:1});
  ck('a foreign file is rejected', badDoc === false);
  var future = P.Doc.restore({format:'plume', version:999});
  ck('a newer file version is rejected', future === false);

  /* ================= nib orientation ================= */
  group('C.3  The nib follows the surface, not the camera');
  /* A blade brush has a direction, and it used to come from the view basis —
     so the same line drawn on the same guide from two viewpoints came out as
     two different strokes. It comes from the surface now: the wide axis of the
     cross-section is perpendicular to the stroke and lies IN the guide, with
     the thin axis along the normal. */
  function wideAxisAt(st, i){
    var pt = st.pts[i], t = pt.tan, r = pt.ref;
    var sv = new THREE.Vector3().crossVectors(t, r);
    return r.clone().multiplyScalar(Math.cos(pt.roll || 0))
            .addScaledVector(sv, Math.sin(pt.roll || 0)).normalize();
  }
  function drawOnTube(theta, phi){
    reset();
    P.TOOL.stableOn = false;
    P.Guides.setActive(P.Guides.primitive('tube', 32, 1));
    P.VIEW.theta = theta; P.VIEW.phi = phi; P.applyCamera();
    P.TOOL.brush = 'wide'; P.TOOL.sizeMM = 30;
    pen([{x:CX-120,y:CY-30},{x:CX-40,y:CY},{x:CX+40,y:CY+10},{x:CX+120,y:CY-20}]);
    return P.Strokes.list[0];
  }
  var offWorst = 0, offView = '';
  [[0.2,1.2,'front'], [1.6,0.7,'side'], [0.9,0.25,'above'], [-1.1,1.4,'behind']]
    .forEach(function(v){
      var st6 = drawOnTube(v[0], v[1]);
      if(!st6) { offWorst = 9; offView = v[2] + ' drew nothing'; return; }
      for(var i=0;i<st6.pts.length;i++){
        if(!st6.pts[i].nrm) continue;
        var d = Math.abs(wideAxisAt(st6, i).dot(st6.pts[i].nrm));
        if(d > offWorst){ offWorst = d; offView = v[2]; }
      }
    });
  ck('the nib lies flat in the guide from every viewpoint', offWorst < 0.02,
     'worst ' + offWorst.toFixed(4) + ' out of the surface, ' + offView + ' view');

  /* and the thin axis is the one along the normal, i.e. the blade is a blade */
  var stFlat = drawOnTube(0.2, 1.2);
  var thinWorst = 1;
  for(var fi=0; fi<stFlat.pts.length; fi++){
    var pt6 = stFlat.pts[fi];
    if(!pt6.nrm) continue;
    var u6 = wideAxisAt(stFlat, fi);
    var v6 = new THREE.Vector3().crossVectors(pt6.tan, u6).normalize();
    thinWorst = Math.min(thinWorst, Math.abs(v6.dot(pt6.nrm)));
  }
  ck('...with its thin axis along the surface normal', thinWorst > 0.98,
     'worst alignment ' + thinWorst.toFixed(4));

  /* the same stroke drawn from two viewpoints must come out the same shape */
  function sectionProfile(st){
    var i = Math.floor(st.pts.length/2), pt = st.pts[i];
    var u = wideAxisAt(st, i);
    return { alongSurface: +Math.abs(u.dot(pt.nrm)).toFixed(3) };
  }
  var pA = sectionProfile(drawOnTube(0.2, 1.2)),
      pB = sectionProfile(drawOnTube(1.6, 0.7));
  ck('so the same line on the same guide is the same stroke from anywhere',
     Math.abs(pA.alongSurface - pB.alongSurface) < 0.02,
     pA.alongSurface + ' vs ' + pB.alongSurface);
  P.TOOL.brush = 'pen'; P.TOOL.sizeMM = 14;
  reset();

  /* ================= bend frame continuity ================= */
  group('A.6  A bent guide keeps the profile facing the way it was drawn');
  /* The frames transported along a new path need a seed. Seeding with the
     profile's own right axis fails when the path sets off ALONG that axis —
     the ordinary case of orbiting 90 degrees and dragging sideways — and the
     fallback perpendicular flips as the tangent crosses it. A symmetric
     profile hides that; a curved one turns inside out. */
  function hookGuide(){
    reset();
    P.VIEW.theta = 0; P.VIEW.phi = Math.PI/2; P.applyCamera();
    P.TOOL.autoGuide = true; P.TOOL.stableOn = false;
    var prof = [];
    for(var q=0;q<=24;q++){
      var t7 = q/24;
      prof.push({ x: CX-150+300*t7,
                  y: CY-40-90*Math.sin(t7*Math.PI)*(t7 < 0.5 ? 1 : 0.25) });
    }
    pen(prof);
    return P.Guides.active;
  }
  function bendAlongR(g, tilt){
    var sw = g.sweep;
    var dir = sw.basisR.clone().addScaledVector(sw.basisT, tilt).normalize();
    /* move the camera FIRST — the screen points have to be projected through
       the same view the bend stroke will be read back in */
    P.VIEW.theta = 0; P.VIEW.phi = 0.05; P.applyCamera();     // look from above
    var pts7 = [];
    for(var q=0;q<=8;q++){
      var w = sw.anchor.clone().addScaledVector(dir, (q/8)*1.6);
      var sc = P.worldToScreen(w, {});
      pts7.push({x:sc.x, y:sc.y});
    }
    P.setTool('bend'); pen(pts7); P.setTool('draw');
    return g;
  }
  function meshPoints(g){
    var a = g.mesh.geometry.attributes.position, out = [];
    for(var q=0;q<a.count;q++) out.push(a.getX(q), a.getY(q), a.getZ(q));
    return out;
  }
  var gPlus  = bendAlongR(hookGuide(), +0.02);
  var vPlus  = meshPoints(gPlus),  rPlus  = gPlus.sweep.frames.R[0].clone();
  var gMinus = bendAlongR(hookGuide(), -0.02);
  var vMinus = meshPoints(gMinus), rMinus = gMinus.sweep.frames.R[0].clone();

  var frameSwing = Math.acos(P.clamp(rPlus.dot(rMinus), -1, 1)) * 57.3;
  ck('two almost identical bends give two almost identical frames',
     frameSwing < 15, frameSwing.toFixed(0) + ' deg apart for a 2.3 deg change of path');

  var vWorst = 0;
  for(var q7=0; q7<Math.min(vPlus.length, vMinus.length); q7+=3){
    vWorst = Math.max(vWorst, Math.hypot(vPlus[q7]-vMinus[q7],
                                         vPlus[q7+1]-vMinus[q7+1],
                                         vPlus[q7+2]-vMinus[q7+2]));
  }
  ck('...and two almost identical surfaces, rather than a flipped one',
     vWorst < 0.2, 'worst vertex moved ' + (vWorst*1000).toFixed(0) + 'mm');

  /* bending along the original extrusion axis must not move the profile at all */
  var gSame = hookGuide();
  var beforeR = gSame.sweep.basisR.clone();
  bendAlongR(gSame, 40);                       // tilt so far it IS basisT
  ck('a bend that keeps the original direction keeps the original frame',
     gSame.sweep.frames.R[0].dot(beforeR) > 0.99,
     'dot ' + gSame.sweep.frames.R[0].dot(beforeR).toFixed(3));
  P.TOOL.autoGuide = false;
  reset();

  /* ================= sampling density and nib tessellation ================= */
  group('Curves are not polygons — sampling and cross-section');

  /* A browser delivers one pointermove per frame, so a fast stroke arrives in
     30-50px jumps and used to be stored exactly that way: a polyline with
     visible corners. On commit the screen path is now resampled through a
     centripetal Catmull-Rom, which passes through the samples the pen gave
     and only fills in between them. */
  reset(); P.TOOL.stableOn = false; P.TOOL.pressureOn = false;
  var flick = [];
  for(var fq=0; fq<=8; fq++) flick.push({x:CX-200+fq*50, y:CY+Math.sin(fq/8*Math.PI)*90});
  pen(flick);
  var fst = P.Strokes.list[0];
  ck('a fast, sparsely-sampled stroke is filled in', fst.pts.length > flick.length*2,
     flick.length + ' samples in, ' + fst.pts.length + ' points out');

  var stepMax = 0, sPrev = ts(fst.pts[0].p);
  for(var fi=1; fi<fst.pts.length; fi++){
    var sNow = ts(fst.pts[fi].p);
    stepMax = Math.max(stepMax, Math.hypot(sNow.x-sPrev.x, sNow.y-sPrev.y));
    sPrev = sNow;
  }
  ck('...with no gap left longer than a few pixels', stepMax < 12,
     'largest step ' + stepMax.toFixed(1) + 'px');

  /* fidelity: the fill-in interpolates, it does not smooth. Every point the
     pen actually reported must still lie on the stored curve. */
  var offWorst = 0;
  for(fq=0; fq<flick.length; fq++){
    var want = flick[fq], bestD = Infinity;
    for(fi=0; fi<fst.pts.length; fi++){
      var got = ts(fst.pts[fi].p);
      bestD = Math.min(bestD, Math.hypot(got.x-want.x, got.y-want.y));
    }
    offWorst = Math.max(offWorst, bestD);
  }
  ck('...and every sample the pen gave is still on the curve', offWorst < 1.5,
     'worst ' + offWorst.toFixed(2) + 'px off');

  /* Cross-section resolution follows the nib. A fixed 12 segments is smooth on
     a 14mm pen and visibly faceted on a 200mm one, so the count is solved from
     a fixed facet error instead. */
  function ringSeg(mm){
    P.Strokes.clear(); P.TOOL.sizeMM = mm; P.TOOL.brush = 'pen';
    pen([{x:CX-60,y:CY},{x:CX,y:CY},{x:CX+60,y:CY}]);
    return P.Strokes.segOf(P.Strokes.list[0]);
  }
  var segSmall = ringSeg(4), segMid = ringSeg(40), segBig = ringSeg(200);
  ck('a bigger nib is tessellated more finely',
     segBig > segMid && segMid > segSmall,
     segSmall + ' -> ' + segMid + ' -> ' + segBig + ' segments');
  var errWorst = 0, errAt = 0;
  [1, 4, 14, 40, 90, 200].forEach(function(mm){
    var n = ringSeg(mm);
    var rmm = P.Strokes.list[0].baseRadius * P.BRUSH.pen.wide / P.MM;
    var e = (1 - Math.cos(Math.PI/n)) * rmm;      // facet depth, in mm
    if(e > errWorst){ errWorst = e; errAt = mm; }
  });
  ck('so the facet error stays under a third of a millimetre up to a 200mm nib',
     errWorst < 0.36, 'worst ' + errWorst.toFixed(3) + 'mm at ' + errAt + 'mm');

  /* Above that the segment ceiling takes over and the guarantee becomes a
     relative one — including the wide brush, whose nib is 3.4x the slider.

     Measured against the OUTLINE THE BRUSH ACTUALLY HAS, not against a circle.
     1-cos(pi/n) is the sagitta of a circular arc and describes a round section
     only; a squared-off one is traced by the Chebyshev map, whose samples land
     on the four corners and the four edge midpoints, so its sides are exact
     line segments at any size and its error is zero rather than the 7.6% the
     circle formula claims for it. This walks each span between two consecutive
     section samples and takes the furthest the true outline strays from the
     chord across it. */
  function outlineError(brush, mm){
    P.Strokes.clear(); P.TOOL.brush = brush; P.TOOL.sizeMM = mm;
    pen([{x:CX-60,y:CY},{x:CX,y:CY},{x:CX+60,y:CY}]);
    var n = P.Strokes.segOf(P.Strokes.list[0]);
    var sq = P.BRUSH[P.brushName(brush)].square || 0;
    var a = {x:0,y:0}, b = {x:0,y:0}, m = {x:0,y:0}, worst = 0;
    for(var k=0;k<n;k++){
      P.Strokes.sectionPoint(k/n*Math.PI*2, sq, a);
      P.Strokes.sectionPoint((k+1)/n*Math.PI*2, sq, b);
      var ex = b.x-a.x, ey = b.y-a.y, e2 = ex*ex+ey*ey;
      for(var q=1;q<40;q++){
        P.Strokes.sectionPoint((k + q/40)/n*Math.PI*2, sq, m);
        var t2 = e2 > 1e-12 ? ((m.x-a.x)*ex + (m.y-a.y)*ey)/e2 : 0;
        var ox = m.x - (a.x + ex*t2), oy = m.y - (a.y + ey*t2);
        worst = Math.max(worst, Math.hypot(ox, oy));
      }
    }
    return worst;                       // as a fraction of the nib radius
  }
  var relWorst = 0, relAt = '';
  ['pen','wide'].forEach(function(bn2){
    [200, 300].forEach(function(mm){
      var rel = outlineError(bn2, mm);
      if(rel > relWorst){ relWorst = rel; relAt = bn2 + ' at ' + mm + 'mm'; }
    });
  });
  ck('...and never worse than a third of a percent of the nib radius',
     relWorst < 0.003, (relWorst*100).toFixed(3) + '%, worst on ' + relAt);
  P.TOOL.sizeMM = 14; P.TOOL.brush = 'pen';

  /* ================= the eraser is its own tool ================= */
  group('C.6  The eraser has its own size');
  function eraseBite(brushMM, eraserMM){
    reset();
    P.TOOL.stableOn = false; P.TOOL.pressureOn = false;
    P.TOOL.sizeMM = brushMM; P.TOOL.eraserMM = eraserMM;
    pen([{x:CX-220,y:CY},{x:CX,y:CY},{x:CX+220,y:CY}]);
    var before4 = plen(P.Strokes.list[0]);
    P.setTool('erase');
    pen([{x:CX,y:CY},{x:CX+1,y:CY}]);
    var after4 = P.Strokes.list.reduce(function(a,b){ return a + plen(b); }, 0);
    P.setTool('draw');
    return P.worldToPx(before4 - after4);
  }
  var biteThin = eraseBite(6, 20), biteFat = eraseBite(200, 20);
  ck('the brush size no longer decides how much the eraser takes',
     Math.abs(biteThin - biteFat) < 2,
     biteThin.toFixed(1) + 'px with a 6mm nib vs ' + biteFat.toFixed(1) + 'px with a 200mm one');
  var biteBig = eraseBite(20, 120);
  ck('...the eraser size does', biteBig > biteThin * 2,
     '20mm eraser takes ' + biteThin.toFixed(1) + 'px, 120mm takes ' + biteBig.toFixed(1) + 'px');
  reset();

  /* ================= painting an area ================= */
  group('Painting — overlaps and the guide’s edge');
  /* Build a wall and paint it with overlapping strokes of the wide brush, the
     way you would block one in. */
  function paintWall(strokeCount, brush, mm){
    reset();
    P.TOOL.stableOn = false; P.TOOL.pressureOn = false;
    P.VIEW.ortho = false; P.VIEW.focal = 50; P.VIEW.radius = 3.2;
    P.VIEW.theta = 0; P.VIEW.phi = 0.02; P.applyCamera();
    P.TOOL.autoGuide = true;
    var prof12 = [];
    for(var q=0;q<=16;q++) prof12.push({x:CX-240+480*(q/16), y:CY});
    pen(prof12);
    var wall = P.Guides.active;
    P.VIEW.theta = 0; P.VIEW.phi = Math.PI/2; P.applyCamera();
    P.TOOL.autoGuide = false;
    P.TOOL.brush = brush; P.TOOL.sizeMM = mm; P.TOOL.opacity = 1;
    P.TOOL.color.set('#2fbf55');
    for(var k=0;k<strokeCount;k++){
      var x12 = CX - 210 + k*24, col12 = [];
      for(q=0;q<=10;q++) col12.push({x:x12, y:CY-120+q*24});
      pen(col12);
    }
    return wall;
  }

  /* THE SEAMS. Fourteen overlapping ribbons of one colour on one flat wall
     should read as one flat wall. What gave the overlaps away was that each
     sheet's SIDES were lit differently from its top — a dark line at every
     seam, which no amount of thinning removes. Sampled across the painted
     area, every pixel should now be the same value. */
  var wallGuide = paintWall(18, 'wide', 70);
  P.Guides.setActive(null);
  P.VIEW.theta = 0.25; P.VIEW.phi = 1.25; P.applyCamera();
  P.renderer.render(P.scene, P.cam());
  var pxSeam = (function(){
    var gl = P.renderer.getContext(), dpr = P.renderer.getPixelRatio();
    var vpS = P.viewport();
    var buf = new W.Uint8Array(4*600);
    gl.readPixels(Math.round(200*dpr), Math.round((vpS.h - CY)*dpr), 600, 1,
                  gl.RGBA, gl.UNSIGNED_BYTE, buf);
    /* Runs of painted pixels, judged in their INTERIORS. The two pixels at
       each end of a run straddle the silhouette and are part background, which
       is antialiasing rather than a seam. */
    var runs = [], cur = [];
    for(var q=0;q<600;q++){
      var r12 = buf[q*4], g12 = buf[q*4+1], b12 = buf[q*4+2];
      if(g12 > r12+20 && g12 > b12+20) cur.push(g12);
      else { if(cur.length) runs.push(cur); cur = []; }
    }
    if(cur.length) runs.push(cur);
    var worst = 0, steps = 0, seen = 0;
    for(var rq=0; rq<runs.length; rq++){
      var run = runs[rq];
      for(var sq=3; sq<run.length-2; sq++){
        seen++;
        var d12 = Math.abs(run[sq] - run[sq-1]);
        worst = Math.max(worst, d12);
        if(d12 > 4) steps++;
      }
    }
    return { seen:seen, worst:worst, steps:steps };
  })();
  ck('a wall painted with overlapping strokes has no seams in it',
     pxSeam.seen > 200 && pxSeam.steps === 0,
     pxSeam.seen + ' painted pixels sampled, ' + pxSeam.steps +
     ' visible steps, worst neighbour difference ' + pxSeam.worst);

  /* THE EDGE. A brush is wider than the line it follows, so paint used to run
     off the side of the guide by up to half a nib. */
  function paintColumn(dx, mm){
    P.Strokes.clear(); P.History.clear();
    P.TOOL.brush = 'wide'; P.TOOL.sizeMM = mm;
    var col13 = [];
    for(var q=0;q<=8;q++) col13.push({x:CX+dx, y:CY-100+q*25});
    pen(col13);
    return P.Strokes.list[0];
  }
  var wall2 = paintWall(0, 'wide', 100);
  var guideBox = new THREE.Box3().setFromObject(wall2.mesh);
  var overflowWorst = -1e9, overflowAt = 0;
  [0, 140, 190, 215, 232].forEach(function(dx){
    var st13 = paintColumn(dx, 100);
    if(!st13) return;
    var box13 = new THREE.Box3().setFromObject(st13.mesh);
    var over = Math.max(box13.max.x - guideBox.max.x, guideBox.min.x - box13.min.x);
    if(over > overflowWorst){ overflowWorst = over; overflowAt = dx; }
  });
  ck('paint stays inside the guide, however close to the edge you work',
     overflowWorst < 1e-6,
     'worst overflow ' + (overflowWorst/P.MM).toFixed(0) + 'mm, painting ' +
     overflowAt + 'px from centre on a 960mm wall');

  /* ...and it narrows only on the side that would have hung over */
  var edgeSt = paintColumn(215, 100);
  var midEdge = Math.floor(edgeSt.pts.length/2);
  ck('...by narrowing the nib on that side alone',
     Math.min(edgeSt.pts[midEdge].fitL, edgeSt.pts[midEdge].fitR) < 0.6 &&
     Math.max(edgeSt.pts[midEdge].fitL, edgeSt.pts[midEdge].fitR) > 0.99,
     'nib fits ' + edgeSt.pts[midEdge].fitL.toFixed(2) + ' one side, ' +
     edgeSt.pts[midEdge].fitR.toFixed(2) + ' the other');

  /* a trimmed nib has to survive a save, since nothing recomputes it on load */
  var fitJson = JSON.stringify(P.Doc.serialize());
  P.Doc.clear();
  P.Doc.restore(JSON.parse(fitJson));
  var backSt = P.Strokes.list[0];
  ck('...and the trim survives a save and reload', !!backSt &&
     Math.abs(backSt.pts[midEdge].fitL - edgeSt.pts[midEdge].fitL) < 1e-5,
     backSt ? backSt.pts[midEdge].fitL.toFixed(3) : 'no stroke');

  /* out in open ground nothing is trimmed at all */
  var openSt = paintColumn(0, 100);
  var trimmed = 0;
  for(var oq=0; oq<openSt.pts.length; oq++){
    if(openSt.pts[oq].fitL < 0.999 || openSt.pts[oq].fitR < 0.999) trimmed++;
  }
  ck('a stroke in the middle of a guide keeps its whole nib', trimmed === 0,
     trimmed + ' of ' + openSt.pts.length + ' points trimmed');

  /* THE TRIMMED BAND, SHADED. Trimming a section moves its corner vertices but
     the corner NORMALS have to keep facing out of the guide, or the strip of
     paint beside a boundary is lit as though it were angled away and reads as
     a dirty smear against the rest of the wall. Painted straight on, every
     pixel of the wall — trimmed band included — is one value. */
  reset();
  P.TOOL.stableOn = false; P.TOOL.pressureOn = false;
  P.VIEW.ortho = false; P.VIEW.focal = 50; P.VIEW.radius = 3.2;
  P.VIEW.theta = 0; P.VIEW.phi = 0.02; P.applyCamera();
  P.TOOL.autoGuide = true;
  var prof14 = [];
  for(var q14=0;q14<=16;q14++) prof14.push({x:CX-240+480*(q14/16), y:CY});
  pen(prof14);
  P.VIEW.theta = 0; P.VIEW.phi = Math.PI/2; P.applyCamera();
  P.TOOL.autoGuide = false;
  P.TOOL.brush = 'wide'; P.TOOL.sizeMM = 70; P.TOOL.opacity = 1;
  P.TOOL.color.set('#2fbf55');
  for(var k14=0;k14<20;k14++){
    var col14 = [];
    for(q14=0;q14<=10;q14++){
      col14.push({x:CX-230+k14*26+Math.sin(q14*0.7+k14)*4, y:CY-120+q14*24});
    }
    pen(col14);
  }
  var trimmedStrokes = 0;
  for(var s14=0; s14<P.Strokes.list.length; s14++){
    var least = 1, ps14 = P.Strokes.list[s14].pts;
    for(var t14=0; t14<ps14.length; t14++){
      least = Math.min(least, ps14[t14].fitL, ps14[t14].fitR);
    }
    if(least < 0.999) trimmedStrokes++;
  }
  P.Guides.setActive(null);
  P.renderer.render(P.scene, P.cam());
  var bandShades = (function(){
    var gl = P.renderer.getContext(), dpr = P.renderer.getPixelRatio();
    var vp14 = P.viewport(), buf14 = new W.Uint8Array(4*900), seen14 = {};
    gl.readPixels(0, Math.round((vp14.h - CY)*dpr), 900, 1,
                  gl.RGBA, gl.UNSIGNED_BYTE, buf14);
    var painted = 0;
    for(var q=0;q<900;q++){
      var r14 = buf14[q*4], g14 = buf14[q*4+1], b14 = buf14[q*4+2];
      if(g14 > r14+20 && g14 > b14+20){ seen14[g14] = (seen14[g14]||0)+1; painted++; }
    }
    return { shades: Object.keys(seen14), painted: painted };
  })();
  ck('paint trimmed at a boundary is shaded like the rest of the wall',
     trimmedStrokes > 0 && bandShades.painted > 300 &&
     bandShades.shades.length === 1,
     trimmedStrokes + ' strokes trimmed, ' + bandShades.painted +
     ' pixels sampled in ' + bandShades.shades.length + ' shade(s): ' +
     bandShades.shades.join(', '));
  P.TOOL.brush = 'pen'; P.TOOL.sizeMM = 14; P.TOOL.pressureOn = true;
  reset();

  /* ================= Smooth over painted work ================= */
  group('Smooth — cost and what it must not undo');
  /* Smoothing a wall painted with the wide brush was the slowest thing in
     the app, and it also quietly threw away the boundary trim. Both are
     measured here on the same drag. */
  function paintedWall(){
    reset();
    P.setTool('draw');
    P.TOOL.stableOn = false; P.TOOL.pressureOn = false;
    P.VIEW.ortho = false; P.VIEW.focal = 50; P.VIEW.radius = 3.2;
    P.VIEW.theta = 0; P.VIEW.phi = 0.02; P.applyCamera();
    P.TOOL.autoGuide = true;
    var pr15 = [], q15;
    for(q15=0;q15<=16;q15++) pr15.push({x:CX-240+480*(q15/16), y:CY});
    pen(pr15);
    var g15 = P.Guides.active;
    P.VIEW.theta = 0; P.VIEW.phi = Math.PI/2; P.applyCamera();
    P.TOOL.autoGuide = false;
    P.TOOL.brush = 'wide'; P.TOOL.sizeMM = 70; P.TOOL.opacity = 1;
    P.TOOL.color.set('#2fbf55');
    for(var k15=0;k15<20;k15++){
      var col15 = [];
      for(q15=0;q15<=10;q15++){

      }
      pen(col15);
    }
    return g15;
  }
  function trimCount(){
    var t = 0;
    for(var a=0;a<P.Strokes.list.length;a++){
      var ps = P.Strokes.list[a].pts;
      for(var b=0;b<ps.length;b++){ if(ps[b].fitL < 0.999 || ps[b].fitR < 0.999) t++; }
    }
    return t;
  }
  var wallG = paintedWall();
  var trimBefore = trimCount();
  var wallBox = new THREE.Box3().setFromObject(wallG.mesh);
  P.setTool('smooth');
  /* One drag to warm up before timing anything. This check runs several
     hundred assertions into the page, and the first pass through the smooth
     path pays for its own JIT: measured cold it reads 17.9ms worst where every
     later drag on the same scene is 2.4-4.4ms. Timing the warm-up would make
     this a test of the compiler. */
  function smoothDrag(record){
    penDown(CX-200, CY);
    for(var q15=0;q15<40;q15++){
      var t15 = (W.performance || Date).now();
      penMoveTo(CX-200+q15*10, CY+Math.sin(q15*0.4)*30);
      if(record) record.push((W.performance || Date).now() - t15);
    }
    penUpAt(CX+200, CY);
  }
  smoothDrag(null);
  var moveTimes = [];
  smoothDrag(moveTimes);
  moveTimes.sort(function(a,b){ return a-b; });
  /* the 90th percentile, not the outright maximum. A single garbage collection
     anywhere in the drag put one move at 22.9ms against a 1.6ms median, and a
     check that fails once in a while stops being read. The bug this guards was
     16.6ms MEDIAN and 36.5ms worst, which blows both bounds below however the
     collector behaves. */
  var moveMax = moveTimes[Math.floor(moveTimes.length*0.9)];

  /* A pointer event must fit inside a frame with room for the render. The
     drag measured 16.6ms median and 36.5ms worst before this was fixed. */
  ck('a smooth drag over a painted wall keeps inside a frame',
     moveTimes[20] < 8 && moveMax < 16,
     '40 moves over 20 wide strokes: median ' + moveTimes[20].toFixed(1) +
     'ms, 90th percentile ' + moveMax.toFixed(1) + 'ms, worst ' +
     moveTimes[moveTimes.length-1].toFixed(1) + 'ms');

  var trimAfter = trimCount();
  ck('...and does not throw away the boundary trim',
     trimBefore > 100 && trimAfter > trimBefore * 0.9,
     trimBefore + ' points trimmed before, ' + trimAfter + ' after');

  var smOver = -1e9;
  for(var o15=0;o15<P.Strokes.list.length;o15++){
    var ob = new THREE.Box3().setFromObject(P.Strokes.list[o15].mesh);
    smOver = Math.max(smOver, ob.max.x - wallBox.max.x, wallBox.min.x - ob.min.x);
  }
  ck('...so the paint stays on the guide after smoothing',
     smOver < 5 * P.MM,
     'worst overflow ' + (smOver/P.MM).toFixed(0) + 'mm');

  /* The occlusion mask is cached against a viewpoint. Moving the camera has
     to drop it, or a curve that just came out from behind a guide would
     still be treated as hidden. */
  reset();
  P.Guides.isolate = true;
  var maskCalls = 0;
  ck('the occlusion mask answers without a ray once it has been asked',
     (function(){
       var wall16 = paintedWall();
       if(!wall16) return false;
       var probe = P.Strokes.list[0].pts[2].p.clone();
       /* count real raycasts by watching the guide mesh */
       var rays = 0, geo = wall16.mesh;
       var oRay = geo.raycast;
       geo.raycast = function(){ rays++; return oRay.apply(this, arguments); };
       P.Guides.isMasked(probe);
       var first = rays;
       for(var r16=0;r16<50;r16++) P.Guides.isMasked(probe);
       var after = rays;
       geo.raycast = oRay;
       maskCalls = first + '/' + (after - first);
       return first === 1 && after === first;
     })(),
     'first ask cast ' + maskCalls + ' rays, fifty repeats cast the rest');

  ck('...and forgets it when the camera moves', (function(){
    var wall17 = paintedWall();
    if(!wall17) return false;
    var probe = P.Strokes.list[0].pts[2].p.clone();
    var rays = 0, geo = wall17.mesh, oRay = geo.raycast;
    geo.raycast = function(){ rays++; return oRay.apply(this, arguments); };
    P.Guides.isMasked(probe);
    var before = rays;
    P.VIEW.theta += 0.4; P.applyCamera();
    P.Guides.isMasked(probe);
    var after = rays;
    geo.raycast = oRay;
    return before === 1 && after === 2;
  })(), 'a moved camera re-casts rather than reusing the old answer');

  P.setTool('draw');
  P.TOOL.brush = 'pen'; P.TOOL.sizeMM = 14; P.TOOL.pressureOn = true;
  reset();

  /* ================= Fill ================= */
  group('Fill — coat a whole guide in one go');

  /* A bucket fill that lays down ORDINARY STROKES, so everything downstream
     still works on it. It takes the current brush and colour because it is
     the current brush. */
  function fillWall(brush, mm){
    reset();
    P.TOOL.stableOn = false; P.TOOL.pressureOn = false;
    P.VIEW.ortho = false; P.VIEW.focal = 50; P.VIEW.radius = 3.2;
    P.VIEW.theta = 0; P.VIEW.phi = 0.02; P.applyCamera();
    P.TOOL.autoGuide = true;
    var prof17 = [];
    for(var q17=0;q17<=16;q17++) prof17.push({x:CX-240+480*(q17/16), y:CY});
    pen(prof17);
    var wall17 = P.Guides.active;
    P.VIEW.theta = 0; P.VIEW.phi = Math.PI/2; P.applyCamera();
    P.TOOL.autoGuide = false;
    P.TOOL.brush = brush; P.TOOL.sizeMM = mm; P.TOOL.opacity = 1;
    P.TOOL.color.set('#2fbf55');
    return { guide: wall17, made: P.Tools.fillGuide() };
  }

  var fill17 = fillWall('wide', 70);
  ck('filling a guide makes ordinary strokes', !!fill17.made &&
     fill17.made.length > 0 && fill17.made.length === P.Strokes.list.length &&
     fill17.made.every(function(x){ return x.pts.length > 1 && !!x.mesh; }),
     (fill17.made ? fill17.made.length : 0) + ' strokes');

  ck('...in the brush and colour you have chosen',
     fill17.made.every(function(x){
       return x.brush === 'wide' &&
              Math.abs(x.color.getHex() - 0x2fbf55) === 0; }),
     'brush ' + fill17.made[0].brush + ', #' + fill17.made[0].color.getHexString());

  /* EDGE TO EDGE. The rows sit half a pitch in from each side so the outermost
     nib hangs over and gets trimmed back, exactly like a hand-painted edge. */
  var gBox17 = new THREE.Box3().setFromObject(fill17.guide.mesh);
  var pBox17 = new THREE.Box3();
  for(var f17=0; f17<P.Strokes.list.length; f17++){
    pBox17.union(new THREE.Box3().setFromObject(P.Strokes.list[f17].mesh));
  }
  var over17  = Math.max(pBox17.max.x - gBox17.max.x, gBox17.min.x - pBox17.min.x);
  var short17 = Math.max(gBox17.max.x - pBox17.max.x, pBox17.min.x - gBox17.min.x);
  ck('...reaching the edges without running past them',
     over17 < 2*P.MM && short17 < 5*P.MM,
     'overflow ' + (over17/P.MM).toFixed(1) + 'mm, shortfall ' +
     (short17/P.MM).toFixed(1) + 'mm on a 960mm guide');

  /* NO GROOVES BETWEEN THE ROWS. Spacing rounds the row count UP: rounding it
     down left a step wider than the nib and a 2mm gap down every seam. */
  P.Guides.setActive(null);
  P.renderer.render(P.scene, P.cam());
  var solid17 = (function(){
    var gl = P.renderer.getContext(), dpr = P.renderer.getPixelRatio();
    var vpF = P.viewport(), buf17 = new W.Uint8Array(4*900);
    gl.readPixels(0, Math.round((vpF.h - CY)*dpr), 900, 1,
                  gl.RGBA, gl.UNSIGNED_BYTE, buf17);
    var runs17 = [], cur17 = 0, painted17 = 0;
    for(var q=0;q<900;q++){
      var r17 = buf17[q*4], g17 = buf17[q*4+1], b17 = buf17[q*4+2];
      if(g17 > r17+20 && g17 > b17+20){ cur17++; painted17++; }
      else if(cur17){ runs17.push(cur17); cur17 = 0; }
    }
    if(cur17) runs17.push(cur17);
    return { runs: runs17.length, painted: painted17 };
  })();
  ck('...as one unbroken sheet, with no grooves between the rows',
     solid17.painted > 300 && solid17.runs === 1,
     solid17.painted + ' pixels across ' + solid17.runs + ' run(s)');

  /* one history step for the whole coat */
  var count17 = P.Strokes.list.length;
  P.History.undo();
  var undone17 = P.Strokes.list.length;
  P.History.redo();
  ck('a fill undoes in one step, not one per row',
     undone17 === 0 && P.Strokes.list.length === count17,
     count17 + ' strokes -> ' + undone17 + ' -> ' + P.Strokes.list.length);

  var fine17 = fillWall('wide', 40).made.length;

     broad17 < fine17 && broad17 >= 1,
     fine17 + ' strokes at 40mm, ' + broad17 + ' at 160mm');

  reset();
  P.Guides.setActive(null);
  var none17 = P.Tools.fillGuide();
  ck('filling with no guide does nothing rather than throwing',
     none17 === null && P.Strokes.list.length === 0,
     'returned ' + none17 + ', ' + P.Strokes.list.length + ' strokes');
  reset();

  /* ================= flat shape guide ================= */
  group('Flat shape guide — the outline you drew, facing you');

  function flatGuide(pts20){
    reset();
    P.TOOL.stableOn = false; P.TOOL.pressureOn = false; P.TOOL.shapeHold = false;
    P.VIEW.ortho = true; P.VIEW.radius = 3.2; P.VIEW.pivot.set(0,0,0);
    P.VIEW.pinned = true; P.VIEW.theta = 0; P.VIEW.phi = 0.9; P.applyCamera();
    P.setTool('flatguide');
    pen(pts20);
    P.setTool('draw');
    return P.Guides.active;
  }
  function ellipse20(rx, ry, n){
    var o = [];
    for(var a20=0; a20<=(n||32); a20++){
      var t20 = a20/(n||32)*Math.PI*2;
      o.push({x:CX+Math.cos(t20)*rx, y:CY+Math.sin(t20)*ry});
    }
    return o;
  }

  var flat = flatGuide(ellipse20(180, 120));
  ck('a closed outline becomes a flat guide',
     !!flat && flat.kind === 'flat' && !!flat.plane &&
     flat.mesh.geometry.attributes.position.count > 3,
     flat ? flat.kind + ', ' +
       (flat.mesh.geometry.index ? flat.mesh.geometry.index.count/3 : 0) + ' triangles'
          : 'none made');

  /* IT FACES YOU. That is the whole difference from the swept guide, which
     takes the stroke as a profile and extrudes it away along the view. */
  var camDir20 = P.cam().getWorldDirection(new THREE.Vector3());
  ck('...lying in the plane you drew it on, not extruded away from it',
     Math.abs(flat.plane.normal.dot(camDir20)) > 0.999,
     'normal against view ' + Math.abs(flat.plane.normal.dot(camDir20)).toFixed(4));
  ck('...and it spans the shape that was drawn',
     Math.abs(flat.plane.Lu / flat.plane.Lv - 1.5) < 0.05,
     (flat.plane.Lu/P.MM).toFixed(0) + ' x ' + (flat.plane.Lv/P.MM).toFixed(0) +
     'mm for a 3:2 ellipse');

  /* the swept guide, drawn identically, does NOT lie in the screen plane */
  reset();
  P.VIEW.ortho = true; P.VIEW.radius = 3.2; P.VIEW.pivot.set(0,0,0);
  P.VIEW.pinned = true; P.VIEW.theta = 0; P.VIEW.phi = 0.9; P.applyCamera();
  P.setTool('guide');
  pen(ellipse20(180, 120));
  P.setTool('draw');
  var swept20 = P.Guides.active;
  ck('...where the ordinary guide extrudes along the view instead',
     !!swept20 && !!swept20.sweep && !swept20.plane,
