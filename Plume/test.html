     samey.join(', ') || 'all distinct');

  /* ---- each brush does the job it is described as doing ----
     Measured off the ring at the middle of a straight stroke: the extent along
     the nib's wide axis, the extent across it, how far the corners stand out
     from the flats, and the radius at the very end against the middle. */
  function nibSection(brushName, mm){
    P.Strokes.clear(); P.History.clear();
    P.TOOL.brush = brushName; P.TOOL.sizeMM = mm || 40;
    P.TOOL.pressureOn = false; P.TOOL.stableOn = false;
    pen([{x:CX-200,y:CY},{x:CX-100,y:CY},{x:CX,y:CY},{x:CX+100,y:CY},{x:CX+200,y:CY}]);
    var st8 = P.Strokes.list[0];
    var seg8 = P.Strokes.segOf(st8), pos8 = st8.mesh.geometry.attributes.position;
    var mid8 = Math.floor(st8.pts.length/2);
    var u8 = wideAxisAt(st8, mid8);
    var v8 = new THREE.Vector3().crossVectors(st8.pts[mid8].tan, u8).normalize();
    /* measured about the SECTION's own centre, not the point — a brush that
       rises off the surface puts the two in different places on purpose */
    var c8 = new THREE.Vector3(), k8, o8;
    for(k8=0;k8<seg8;k8++){
      o8 = 2 + mid8*seg8 + k8;
      c8.add(new THREE.Vector3(pos8.getX(o8), pos8.getY(o8), pos8.getZ(o8)));
    }
    c8.multiplyScalar(1/seg8);
    var eu = 0, ev = 0, maxR = 0, minR = 1e9, d8 = new THREE.Vector3();
    for(k8=0;k8<seg8;k8++){
      o8 = 2 + mid8*seg8 + k8;
      d8.set(pos8.getX(o8), pos8.getY(o8), pos8.getZ(o8)).sub(c8);
      eu = Math.max(eu, Math.abs(d8.dot(u8)));
      ev = Math.max(ev, Math.abs(d8.dot(v8)));
      var r8 = d8.length();
      maxR = Math.max(maxR, r8); minR = Math.min(minR, r8);
    }
    var endR = 0;
    for(k8=0;k8<seg8;k8++){
      o8 = 2 + k8;
      d8.set(pos8.getX(o8), pos8.getY(o8), pos8.getZ(o8)).sub(st8.pts[0].p);
      endR = Math.max(endR, d8.length());
    }
    return { wideMM: eu/P.MM, thinMM: ev/P.MM, corner: maxR/(minR || 1e-9),
             endOverMid: endR/(maxR || 1e-9) };
  }

  var secPen    = nibSection('pen'),    secTaper = nibSection('taper');
  var secSquare = nibSection('rectangle', 14), secCube  = nibSection('cube');
  var secWide   = nibSection('wide');

  ck('the pen is still a plain round nib, end to end',
     secPen.corner < 1.02 && Math.abs(secPen.wideMM - secPen.thinMM) < 0.2 &&
     secPen.endOverMid > 0.9,
     'corner ' + secPen.corner.toFixed(3) + ', ends ' +
     (secPen.endOverMid*100).toFixed(0) + '% of mid');

  ck('the tapered brush keeps a round section but comes to a point',
     secTaper.corner < 1.02 && secTaper.endOverMid < 0.12,
     'ends ' + (secTaper.endOverMid*100).toFixed(1) + '% of the nib');

  ck('the rectangle has hard corners, and square sides at the default size',
     Math.abs(secSquare.wideMM - secSquare.thinMM) / secSquare.wideMM < 0.05 &&
     secSquare.corner > 1.35,
     'sides ' + secSquare.wideMM.toFixed(1) + ' x ' + secSquare.thinMM.toFixed(1) +
     'mm, corners ' + secSquare.corner.toFixed(2) + 'x the flats');

  /* THE SIZE SLIDER RAISES IT RATHER THAN INFLATING IT. Every other brush
     scales in every direction at once; this one holds its width across the
     surface and grows only the height standing off it, which is the whole
     reason it is a rectangle and not a square. */
  var rectSizes = [14, 40, 100, 200].map(function(mm){ return nibSection('rectangle', mm); });
  var widthSpread = 0, tallest = rectSizes[0].thinMM / rectSizes[0].wideMM;
  for(var r16=0; r16<rectSizes.length; r16++){
    widthSpread = Math.max(widthSpread,
      Math.abs(rectSizes[r16].wideMM - rectSizes[0].wideMM) / rectSizes[0].wideMM);
    tallest = Math.max(tallest, rectSizes[r16].thinMM / rectSizes[r16].wideMM);
  }
  ck('the rectangle keeps its width and the size sets its height off the surface',
     widthSpread < 0.02 && rectSizes[3].thinMM > rectSizes[0].thinMM * 10 &&
     tallest > 10,
     rectSizes.map(function(x, q16){
       return [14,40,100,200][q16] + 'mm: ' + x.wideMM.toFixed(1) + ' x ' +
              x.thinMM.toFixed(1);
     }).join(', '));

  /* A SKETCH SAVED BEFORE THE RENAME STILL OPENS. The brush key changed from
     square to rectangle, so the old name has to resolve like every other
     retired one rather than silently falling back to the round pen. */
  ck('the old "square" name still resolves to the rectangle',
     P.brushName('square') === 'rectangle' &&
     P.brushName('marker') === 'rectangle' &&
     P.brushName('chisel') === 'rectangle',
     'square -> ' + P.brushName('square'));
  /* `flat` used to alias the rectangle and is a brush of its own now, so a
     sketch saved with the retired name opens as the ribbon. Nothing in a
     document tells the two apart; this records the choice rather than
     pretending it did not happen. */
  ck('...but "flat" is a brush in its own right, no longer an alias',
     P.brushName('flat') === 'flat' && !P.BRUSH_ALIAS.flat,
     'flat -> ' + P.brushName('flat'));
  (function(){
    P.Strokes.clear(); P.History.clear();
    P.TOOL.brush = 'rectangle'; P.TOOL.sizeMM = 40;
    pen([{x:CX-100,y:CY},{x:CX,y:CY},{x:CX+100,y:CY}]);
    var saved = JSON.stringify(P.Doc.serialize());
    var aged  = JSON.parse(saved.split('"rectangle"').join('"square"'));
    P.Doc.clear();
    P.Doc.restore(aged);
    var back16 = P.Strokes.list[0];
    ck('...and a document written with it reloads as a rectangle',
       !!back16 && back16.brush === 'rectangle' && !!back16.mesh &&
       back16.mesh.geometry.index.count > 0,
       back16 ? 'brush ' + back16.brush + ', ' +
                (back16.mesh ? back16.mesh.geometry.index.count/3 : 0) + ' triangles'
              : 'no stroke came back');
  })();

  /* and a brush that is NOT the rectangle still scales both ways together */
  var penSmall = nibSection('pen', 20), penBig = nibSection('pen', 100);
  ck('...while every other brush still grows in both directions',
     penBig.wideMM > penSmall.wideMM * 4 && penBig.thinMM > penSmall.thinMM * 4,
     'pen 20mm ' + penSmall.wideMM.toFixed(0) + ' x ' + penSmall.thinMM.toFixed(0) +
     ', 100mm ' + penBig.wideMM.toFixed(0) + ' x ' + penBig.thinMM.toFixed(0));
  ck('...and uniform along its length, with no taper',
     secSquare.endOverMid > 0.9, (secSquare.endOverMid*100).toFixed(0) + '% at the end');

  ck('the cube keeps the square section',
     secCube.corner > 1.35 &&
     Math.abs(secCube.wideMM - secCube.thinMM) / secCube.wideMM < 0.05,
     secCube.wideMM.toFixed(1) + ' x ' + secCube.thinMM.toFixed(1) + 'mm, corners ' +
     secCube.corner.toFixed(2) + 'x');

  ck('the wide brush is a broad flat ribbon, not a rod',
     secWide.wideMM / secWide.thinMM > 8,
     secWide.wideMM.toFixed(1) + ' x ' + secWide.thinMM.toFixed(1) + 'mm, ratio ' +
     (secWide.wideMM/secWide.thinMM).toFixed(1) + ':1');
  ck('...and the broadest of them at the same nib size',
     secWide.wideMM > secSquare.wideMM && secWide.wideMM > secPen.wideMM,
     [secPen.wideMM, secTaper.wideMM, secSquare.wideMM, secCube.wideMM, secWide.wideMM]
       .map(function(x){ return x.toFixed(0); }).join(' / ') + 'mm across');
  /* ---- flat and wide: the same ribbon, thickness apart ----
     `flat` keeps the thinness scaling with the width, so it is a sheet at
     every size. `wide` pins it at 2mm, so it stays a skin over the guide
     however far the slider is pushed instead of fattening into a slab. */
  /* nibSection reports HALF-extents about the section's centre, so doubling
     them gives the width and thickness the brush actually lays down */
  function ribbon23(brush23, mm23){
    var sec23 = nibSection(brush23, mm23);
    return { w:+(sec23.wideMM*2).toFixed(1), t:+(sec23.thinMM*2).toFixed(2) };
  }
  var w20 = ribbon23('wide', 20), w60 = ribbon23('wide', 60), w150 = ribbon23('wide', 150);
  var f20 = ribbon23('flat', 20), f60 = ribbon23('flat', 60), f150 = ribbon23('flat', 150);

  ck('flat and wide are the same ribbon across the surface',
     Math.abs(w60.w - f60.w) < 0.2 && Math.abs(w150.w - f150.w) < 0.2,
     'wide ' + w60.w + 'mm and flat ' + f60.w + 'mm at a 60mm slider');
  ck('the wide brush holds 2mm of thickness at any size',
     Math.abs(w20.t - 2) < 0.05 && Math.abs(w60.t - 2) < 0.05 &&
     Math.abs(w150.t - 2) < 0.05,
     [w20.t, w60.t, w150.t].join(' / ') + 'mm at 20 / 60 / 150mm');
  ck('...where flat still thickens with its width',
     f150.t > f20.t * 5 && f60.t > f20.t * 2,
     [f20.t, f60.t, f150.t].join(' / ') + 'mm at 20 / 60 / 150mm');

  /* ---- the sketch pencil ----
     A chisel edge lying along the surface, laid down at part strength through
     a paper tooth, so going over the same ground darkens it. */
  var secSketch = nibSection('sketch');
  /* `corner` is the furthest point of the outline over the nearest, so for a
     FLATTENED section it already equals the aspect ratio however round the
     section is - a squared-off one pushes its corners out by a further root
     two on top of that. Comparing the two is what separates a soft chisel
     from a hard one; comparing corner against 1 would only ever have been
     true for a circle. */
  var sketchRatio = secSketch.wideMM / secSketch.thinMM;
  ck('the sketch pencil is a flattened chisel, not a rod',
     sketchRatio > 2.2 && sketchRatio < 4,
     'ratio ' + sketchRatio.toFixed(1) + ':1');
  ck('...with a rounded edge rather than a squared-off one',
     secSketch.corner < sketchRatio * 1.15 &&
     secSquare.corner > (secSquare.wideMM/secSquare.thinMM) * 1.2,
     'pencil corners ' + secSketch.corner.toFixed(2) + 'x vs its ' +
     sketchRatio.toFixed(2) + ':1 section; rectangle ' +
     secSquare.corner.toFixed(2) + 'x vs ' +
     (secSquare.wideMM/secSquare.thinMM).toFixed(2) + ':1');
  ck('...and it does not taper to a point like the tapered brush',
     secSketch.endOverMid > 0.9,
     (secSketch.endOverMid*100).toFixed(0) + '% at the end');

  /* GRIT AND BUILD-UP, measured off the framebuffer. A wall painted straight
     on, scanned across the mark: the pencil should show many tone levels where
     a pen shows one flat value, and should DARKEN as passes accumulate while
     the pen cannot get darker than opaque. */
  function pencilBand(brush18, passes18){
    reset();
    P.TOOL.stableOn = false; P.TOOL.pressureOn = false;
    P.VIEW.ortho = false; P.VIEW.focal = 50; P.VIEW.radius = 3.2;
    P.VIEW.pivot.set(0,0,0); P.VIEW.pinned = true;
    P.VIEW.theta = 0; P.VIEW.phi = 0.02; P.applyCamera();
    P.TOOL.autoGuide = true;
    var prof18 = [];
    for(var q18=0;q18<=16;q18++) prof18.push({x:CX-240+480*(q18/16), y:CY});
    pen(prof18);
    P.VIEW.theta = 0; P.VIEW.phi = Math.PI/2; P.applyCamera();
    P.TOOL.autoGuide = false;
    P.TOOL.brush = brush18; P.TOOL.sizeMM = 60; P.TOOL.opacity = 1;
    P.TOOL.color.set('#2fbf55');
    for(var k18=0;k18<passes18;k18++){
      var col18 = [];
      for(q18=0;q18<=10;q18++) col18.push({x:CX-160+q18*32, y:CY});
      pen(col18);
    }
    P.Guides.setActive(null);
    P.renderer.render(P.scene, P.cam());
    var gl = P.renderer.getContext(), dpr = P.renderer.getPixelRatio();
    var vpP = P.viewport(), buf18 = new W.Uint8Array(4*700);
    gl.readPixels(120, Math.round((vpP.h - CY)*dpr), 700, 1,
                  gl.RGBA, gl.UNSIGNED_BYTE, buf18);
    /* the unpainted ground, read from the edge of the same scanline */
    var bg18 = buf18[1];
    var seen18 = {}, n18 = 0, sum18 = 0;
    for(var t18=0;t18<700;t18++){
      var r18 = buf18[t18*4], g18 = buf18[t18*4+1], b18 = buf18[t18*4+2];
      if(g18 > r18+12 && b18 < 200){
        seen18[g18] = 1; n18++; sum18 += Math.abs(g18 - bg18);
      }
    }
    /* HOW FAR THE MARK HAS MOVED FROM THE GROUND, not the raw channel. Paint
       laid on a dark ground raises the green channel and on a light one lowers
       it, so a test that assumed a direction passed or failed on the theme
       rather than on the brush. */
    return { painted:n18, tones:Object.keys(seen18).length,
             strength: sum18/(n18 || 1) };
  }
  var gritty18 = pencilBand('sketch', 1), plain18 = pencilBand('pen', 1);
  ck('the pencil lays down a gritty tone, where the pen lays a flat one',
     gritty18.painted > 200 && plain18.painted > 200 &&
     gritty18.tones >= 4 && gritty18.tones > plain18.tones,
     gritty18.tones + ' tone levels against the pen\'s ' + plain18.tones);

  var p1 = pencilBand('sketch', 1).strength,
      p2 = pencilBand('sketch', 2).strength,
      p4 = pencilBand('sketch', 4).strength;
  var q1 = pencilBand('pen', 1).strength, q4 = pencilBand('pen', 4).strength;
  ck('going over the pencil again darkens it',
     p2 > p1 + 2 && p4 > p2 + 2,
     'strength ' + p1.toFixed(1) + ' -> ' + p2.toFixed(1) + ' -> ' + p4.toFixed(1) +
     ' over 1, 2 and 4 passes');
  ck('...while an opaque brush cannot get darker than it already is',
     Math.abs(q4 - q1) < 1.5,
     'pen ' + q1.toFixed(1) + ' -> ' + q4.toFixed(1));

  /* PRESSURE drives tone for this brush and nothing else - but only when the
     pressure toggle is on, exactly like every other brush. */
  function targetFor(on18, chosen18){
    reset();
    P.TOOL.brush = 'sketch'; P.TOOL.pressureOn = on18;
    P.TOOL.pressureTarget = chosen18;
    pen([{x:CX-100,y:CY},{x:CX,y:CY},{x:CX+100,y:CY}]);
    return P.Strokes.list[0] && P.Strokes.list[0].pressureTarget;
  }
  ck('the pencil takes pressure as tone, whatever else is selected',
     targetFor(true, 'size') === 'opacity' && targetFor(true, 'both') === 'opacity',
     'with size chosen -> ' + targetFor(true, 'size'));
  ck('...and ignores pressure entirely when the toggle is off',
     targetFor(false, 'size') === 'none',
     'toggle off -> ' + targetFor(false, 'size'));
  /* a brush WITHOUT an opinion still follows the global choice */
  (function(){
    reset();
    P.TOOL.brush = 'pen'; P.TOOL.pressureOn = true; P.TOOL.pressureTarget = 'size';
    pen([{x:CX-100,y:CY},{x:CX,y:CY},{x:CX+100,y:CY}]);
    ck('...and other brushes still follow whatever you picked',
       P.Strokes.list[0].pressureTarget === 'size',
       'pen -> ' + P.Strokes.list[0].pressureTarget);
  })();

  /* the retired `pencil` name still means the old round nib, not this */
  ck('the old "pencil" name still resolves to the pen, not the sketch pencil',
     P.brushName('pencil') === 'pen', 'pencil -> ' + P.brushName('pencil'));

  P.TOOL.brush = 'pen'; P.TOOL.sizeMM = 14; P.TOOL.pressureOn = true;
  reset();

  /* ---- how a nib sits ON a guide, which is what the section is for ----
     A wall: a profile drawn from above extrudes downwards into a vertical
     curtain, so the surface normal is horizontal and nothing about the view
     coincides with it. */
  function paintOnWall(brush, mm, tiltX, tiltY){
    reset();
    P.VIEW.theta = 0; P.VIEW.phi = 0.02; P.applyCamera();
    P.TOOL.autoGuide = true; P.TOOL.stableOn = false; P.TOOL.pressureOn = false;
    var prof9 = [];
    for(var q=0;q<=16;q++) prof9.push({x:CX-220+440*(q/16), y:CY});
    pen(prof9);
    P.VIEW.theta = 0; P.VIEW.phi = Math.PI/2; P.applyCamera();
    P.TOOL.autoGuide = false;
    P.TOOL.brush = brush; P.TOOL.sizeMM = mm;
    var col9 = [];
    for(q=0;q<=12;q++) col9.push({x:CX, y:CY-120+q*20});
    penTilt(col9, tiltX || 0, tiltY || 0);
    var st9 = P.Strokes.list[0];
    if(!st9) return null;
    var mid9 = Math.floor(st9.pts.length/2), pt9 = st9.pts[mid9];
    var u9 = wideAxisAt(st9, mid9), n9 = pt9.nrm.clone();
    var seg9 = P.Strokes.segOf(st9), pos9 = st9.mesh.geometry.attributes.position;
    var uLo = 1e9, uHi = -1e9, nLo = 1e9, nHi = -1e9, d9 = new THREE.Vector3();
    for(var k9=0;k9<seg9;k9++){
      var o9 = 2 + mid9*seg9 + k9;
      d9.set(pos9.getX(o9), pos9.getY(o9), pos9.getZ(o9)).sub(pt9.p);
      uLo = Math.min(uLo, d9.dot(u9)); uHi = Math.max(uHi, d9.dot(u9));
      nLo = Math.min(nLo, d9.dot(n9)); nHi = Math.max(nHi, d9.dot(n9));
    }
    return { acrossMM:(uHi-uLo)/P.MM, outMM:(nHi-nLo)/P.MM,
             sinksMM:-nLo/P.MM, standsMM:nHi/P.MM };
  }

  var wallWide = paintOnWall('wide', 100, 0, 0);
  ck('the wide brush lies flat on the guide it is painted on',
     wallWide.acrossMM / wallWide.outMM > 8,
     wallWide.acrossMM.toFixed(0) + 'mm across the surface, ' +
     wallWide.outMM.toFixed(0) + 'mm out of it');

  /* the bug this replaced: the pen's tilt azimuth was rotating the section
     about the tangent, so a ribbon painted with a naturally-held pen stood on
     edge — measured 213mm out of the surface instead of 34mm. */
  var wallTilted = paintOnWall('wide', 100, -34, 22);
  ck('...and a tilted pen does not stand it on edge',
     Math.abs(wallTilted.outMM - wallWide.outMM) < 2,
     wallTilted.outMM.toFixed(0) + 'mm out of the surface with the pen tilted, ' +
     wallWide.outMM.toFixed(0) + 'mm flat');

  /* the cube is an EXTRUSION FROM the surface, its length the size slider */
  var cube100 = paintOnWall('cube', 100), cube40 = paintOnWall('cube', 40);
  ck('the cube stands on the surface rather than sinking into it',
     cube100.sinksMM < 1, cube100.sinksMM.toFixed(1) + 'mm below the stroke');
  ck('...extruding out of it by the size on the slider',
     Math.abs(cube100.standsMM - 100) < 6 && Math.abs(cube40.standsMM - 40) < 4,
     '100mm -> ' + cube100.standsMM.toFixed(0) + 'mm out, 40mm -> ' +
     cube40.standsMM.toFixed(0) + 'mm out');
  var wallSquare = paintOnWall('rectangle', 100);
  ck('...while the square tip still straddles the surface as a nib should',
     wallSquare.sinksMM > wallSquare.standsMM * 0.8,
     wallSquare.sinksMM.toFixed(0) + 'mm in, ' + wallSquare.standsMM.toFixed(0) + 'mm out');
  P.TOOL.brush = 'pen'; P.TOOL.sizeMM = 14; P.TOOL.pressureOn = true;
  reset();

  /* a sketch drawn with a retired brush must reopen as the nearest nib, not
     silently as the default */
  var aliasBad = [];
  ['round','pencil','ink','flat','marker','chisel','ribbon'].forEach(function(oldName){
    var got = P.brushName(oldName);
    if(!P.BRUSH[got]) aliasBad.push(oldName + '->' + got);
  });
  ck('retired brush names still resolve', aliasBad.length === 0,
     aliasBad.join(', ') || 'round/pencil/ink/flat/marker/chisel/ribbon all map to a real nib');
  ck('...and a curve saved as one loads as its replacement', (function(){
    P.Strokes.clear();
    P.TOOL.brush = 'pen';
    pen([{x:CX-60,y:CY},{x:CX+60,y:CY}]);
    var doc2 = P.Doc.serialize();
    doc2.strokes[0].brush = 'chisel';                 // as an older build wrote it
    P.Doc.restore(doc2);
    return P.Strokes.list.length === 1 &&
           P.Strokes.list[0].brush === P.BRUSH_ALIAS.chisel && !!P.Strokes.list[0].mesh;
  })(), P.Strokes.list[0] && P.Strokes.list[0].brush);
  reset();
  var uiBrushes = [];
  var btns = DD.querySelectorAll('#brushGrid button');
  for(i=0;i<btns.length;i++) uiBrushes.push(btns[i].dataset.brush);
  var missing = names.filter(function(n){ return uiBrushes.indexOf(n) < 0; });
  ck('every brush has a button', missing.length === 0, missing.join(',') || 'all present');

  var broken = [];
  names.forEach(function(bn){
    P.Strokes.clear();
    P.TOOL.brush = bn;
    pen([{x:CX-90,y:CY-30},{x:CX-30,y:CY},{x:CX+30,y:CY+18},{x:CX+90,y:CY-14}]);
    var st = P.Strokes.list[0];
    if(!st || !st.mesh){ broken.push(bn+':no mesh'); return; }
    var pos = st.mesh.geometry.attributes.position;
    var nor = st.mesh.geometry.attributes.normal;
    if(pos.count < 8) broken.push(bn+':too few verts');
    for(var q=0;q<pos.count*3;q++){
      if(!isFinite(pos.array[q])){ broken.push(bn+':NaN pos'); break; }
    }
    for(q=0;q<nor.count*3;q++){
      if(!isFinite(nor.array[q])){ broken.push(bn+':NaN normal'); break; }
    }
  });
  ck('every brush builds finite geometry', broken.length === 0, broken.join(', ') || '10/10');

  P.Strokes.clear(); P.TOOL.brush = 'glow';
  pen([{x:CX-60,y:CY},{x:CX,y:CY},{x:CX+60,y:CY}]);
  ck('glow is additive and unshaded (C.5)',
     P.Strokes.list[0].mesh.material.blending === THREE.AdditiveBlending &&
     P.Strokes.list[0].mesh.material.uniforms.uGlow.value === 1);
  P.Strokes.clear(); P.TOOL.brush = 'pen';
  pen([{x:CX-60,y:CY},{x:CX,y:CY},{x:CX+60,y:CY}]);
  ck('other brushes stay on normal blending',
     P.Strokes.list[0].mesh.material.blending === THREE.NormalBlending);

  function ringAspect(bn){
    P.Strokes.clear(); P.TOOL.brush = bn;
    pen([{x:CX-60,y:CY},{x:CX,y:CY},{x:CX+60,y:CY}]);
    var pos = P.Strokes.list[0].mesh.geometry.attributes.position;
    var lo1=1e9,hi1=-1e9,lo2=1e9,hi2=-1e9;
    for(var q=2;q<12;q++){
      lo1=Math.min(lo1,pos.getY(q)); hi1=Math.max(hi1,pos.getY(q));
      lo2=Math.min(lo2,pos.getZ(q)); hi2=Math.max(hi2,pos.getZ(q));
    }
    return (hi1-lo1)/((hi2-lo2)||1e-9);
  }
  ck('a square nib really changes the cross-section',
     Math.abs(ringAspect('wide') - ringAspect('pen')) > 0.05);
  P.TOOL.brush = 'pen';

  /* ================= lasso ================= */
  group('Lasso select');
  reset();
  pen([{x:CX-140,y:CY-60},{x:CX-90,y:CY-60},{x:CX-40,y:CY-60}]);
  pen([{x:CX+40,y:CY+70},{x:CX+90,y:CY+70},{x:CX+140,y:CY+70}]);
  ck('two curves to choose between', P.Strokes.list.length === 2);
  P.setTool('lasso');
  pen([{x:CX-200,y:CY-120},{x:CX+10,y:CY-120},{x:CX+10,y:CY-10},
       {x:CX-200,y:CY-10},{x:CX-200,y:CY-120}]);
  ck('the loop takes only what is inside it', P.Strokes.selection.length === 1,
     'selected ' + P.Strokes.selection.length);
  P.History.undo();
  ck('lasso selection is undoable', P.Strokes.selection.length === 0);
  P.setTool('draw');

  /* ================= smooth ================= */
  group('Smooth');
  reset();
  var zig = [];
  for(i=0;i<=24;i++) zig.push({x:CX-160+i*13, y:CY+(i%2?16:-16)});
  pen(zig);
  var zs = P.Strokes.list[0];
  function rough(st){
    var t = 0;
    for(var q=1;q<st.pts.length-1;q++){
      t += st.pts[q].p.clone().multiplyScalar(2)
             .sub(st.pts[q-1].p).sub(st.pts[q+1].p).length();
    }
    return t;
  }
  var r0 = rough(zs), hist0 = P.History.idx;
  P.setTool('smooth'); P.TOOL.sizeMM = 90;
  for(i=0;i<6;i++) pen(zig);
  var passes = P.History.idx - hist0;
  ck('smoothing relaxes the curve', rough(zs) < r0*0.5,
     r0.toFixed(3) + ' -> ' + rough(zs).toFixed(3));
  ck('each drag is its own undo step', passes === 6, passes + ' recorded');
  for(i=0;i<passes;i++) P.History.undo();
  ck('undoing them all restores the original exactly', Math.abs(rough(zs) - r0) < 1e-9);
  P.setTool('draw'); P.TOOL.sizeMM = 14;

  /* ================= duplicate / groups ================= */
  group('Duplicate and groups');
  reset();
  pen([{x:CX-60,y:CY-40},{x:CX,y:CY-40},{x:CX+60,y:CY-40}]);
  pen([{x:CX-60,y:CY+40},{x:CX,y:CY+40},{x:CX+60,y:CY+40}]);
  P.Strokes.list.forEach(function(st){ P.Strokes.setSelected(st, true); });
  P.Tools.duplicateSelection();
  ck('duplicate copies the selection', P.Strokes.list.length === 4);
  ck('the copies become the new selection', P.Strokes.selection.length === 2);
  ck('the copy is offset, not coincident',
     P.Strokes.list[2].pts[0].p.distanceTo(P.Strokes.list[0].pts[0].p) > 1e-6);
  P.History.undo();
  ck('duplicate is undoable', P.Strokes.list.length === 2);

  /* ---- the grouping panel ----
     Rebuilt to match Feather's: every curve is in a named group, drawing goes
     into the active one, and the panel is where you move things between them.
     FACT (C.8): undo covers add/delete group. */
  reset();
  ck('a sketch always has a group to draw into',
     P.Strokes.groups.length === 1 && !!P.Strokes.findGroup(P.Strokes.activeGroup));
  pen([{x:CX-60,y:CY-40},{x:CX,y:CY-40},{x:CX+60,y:CY-40}]);
  pen([{x:CX-60,y:CY+40},{x:CX,y:CY+40},{x:CX+60,y:CY+40}]);
  ck('a new curve joins the active group',
     P.Strokes.list[0].group === P.Strokes.activeGroup &&
     P.Strokes.list[1].group === P.Strokes.activeGroup);

  var gA = P.Strokes.groups[0];
  var gB = P.Tools.newGroup('Interior backface');
  ck('a new group is added and becomes active',
     P.Strokes.groups.length === 2 && P.Strokes.activeGroup === gB.id);
  ck('...and it is undoable', (function(){
    P.History.undo();
    var gone = P.Strokes.groups.length === 1 && P.Strokes.activeGroup === gA.id;
    P.History.redo();
    return gone && P.Strokes.groups.length === 2;
  })());

  /* THE ARROW: selected curves move into the group whose arrow you tap */
  P.Strokes.setSelected(P.Strokes.list[0], true);
  var moved = P.Tools.assignSelection(gB.id);
  ck('the arrow moves the selection into that group', moved === 1 &&
     P.Strokes.list[0].group === gB.id && P.Strokes.list[1].group === gA.id);
  ck('...and nothing else follows it', P.Strokes.membersOf(gB.id).length === 1);
  P.History.undo();
  ck('...and that is undoable too', P.Strokes.list[0].group === gA.id);
  P.History.redo();

  /* LONG PRESS: select everything in a group */
  P.Strokes.clearSelection();
  P.Strokes.setSelected(P.Strokes.list[1], true);
  var picked = P.Tools.selectGroup(gA.id);
  ck('selecting a group takes exactly its members', picked === 1 &&
     P.Strokes.selection.length === 1 && P.Strokes.selection[0] === P.Strokes.list[1]);

  /* THE EYE */
  P.Tools.setGroupVisible(gB.id, false);
  ck('hiding a group hides its curves',
     P.Strokes.list[0].mesh.visible === false && P.Strokes.list[1].mesh.visible === true);
  ck('...and a hidden curve cannot be selected by tapping it', (function(){
    var mid = ts(P.Strokes.list[0].pts[1].p);
    return P.Strokes.hitTest(mid.x, mid.y) === null;
  })());
  ck('...nor erased', (function(){
    var mid = ts(P.Strokes.list[0].pts[1].p);
    var before = P.Strokes.list.length;
    P.setTool('erase'); P.TOOL.eraserMM = 120;
    pen([{x:mid.x,y:mid.y},{x:mid.x+1,y:mid.y}]);
    P.setTool('draw'); P.TOOL.eraserMM = 20;
    return P.Strokes.list.length === before;
  })());
  P.Tools.setGroupVisible(gB.id, true);
  ck('showing it again brings the curves back',
     P.Strokes.list[0].mesh.visible === true);

  /* renaming */
  P.Tools.renameGroup(gB.id, 'Rough sketch');
  ck('a group can be renamed', P.Strokes.findGroup(gB.id).name === 'Rough sketch');
  P.History.undo();
  ck('...and the old name comes back', P.Strokes.findGroup(gB.id).name === 'Interior backface');
  P.History.redo();

  /* duplicate and delete */
  var dup = P.Tools.duplicateGroup(gB.id);
  ck('duplicating a group copies its curves too',
     P.Strokes.groups.length === 3 && P.Strokes.membersOf(dup.id).length === 1 &&
     P.Strokes.list.length === 3);
  P.History.undo();
  ck('...undoably', P.Strokes.groups.length === 2 && P.Strokes.list.length === 2);

  var beforeDel = P.Strokes.list.length;
  P.Tools.deleteGroup(gB.id);
  ck('deleting a group takes its curves with it',
     P.Strokes.groups.length === 1 && P.Strokes.list.length === beforeDel - 1);
  P.History.undo();
  ck('...and undo brings both back',
     P.Strokes.groups.length === 2 && P.Strokes.list.length === beforeDel);
  ck('the last group cannot be deleted out from under you', (function(){
    P.Tools.deleteGroup(gB.id);
    return P.Tools.deleteGroup(P.Strokes.groups[0].id) === false &&
           P.Strokes.groups.length === 1;
  })());

  ck('a hidden group is left out of select all', (function(){
    reset();
    pen([{x:CX-120,y:CY-40},{x:CX+120,y:CY-40}]);
    var g5 = P.Tools.newGroup('Hidden');
    pen([{x:CX-120,y:CY+40},{x:CX+120,y:CY+40}]);
    P.Tools.setGroupVisible(g5.id, false);
    W.document.getElementById('btnSelAll').click();
    var n5 = P.Strokes.selection.length;
    P.Strokes.clearSelection();
    return n5 === 1;
  })());
  ck('...and out of an export, because it is not on screen', (function(){
    var parts5 = P.Export.collect();
    var all5 = P.Export.collect({strokes: P.Strokes.list});
    return parts5.length === 1 && all5.length === 2;
  })());
  reset();

  /* round trip, and reading a v1 file that has no group list at all */
  P.Tools.newGroup('Sub drawing');
  P.Tools.setGroupVisible(P.Strokes.groups[0].id, false);
  var gjson = JSON.stringify(P.Doc.serialize());
  P.Doc.clear();
  P.Doc.restore(JSON.parse(gjson));
  ck('groups survive a save/load round trip',
     P.Strokes.groups.length === 2 &&
     P.Strokes.groups.map(function(g){ return g.name; }).indexOf('Sub drawing') >= 0);
  ck('...including which of them are hidden',
     P.Strokes.groups[0].visible === false);
  ck('...and which one is active', !!P.Strokes.findGroup(P.Strokes.activeGroup));

  ck('a v1 file with no group list still opens', (function(){
    var v1 = JSON.parse(gjson);
    v1.version = 1;
    delete v1.groups;
    v1.strokes.forEach(function(st, i){ st.group = i === 0 ? 7 : null; });
    if(!P.Doc.restore(v1)) return false;
    /* one invented group per id that was used, plus a home for the ungrouped */
    return P.Strokes.groups.length >= 1 &&
           P.Strokes.list.every(function(st){ return !!P.Strokes.findGroup(st.group); });
  })(), P.Strokes.groups.map(function(g){ return g.name; }).join(', '));
  reset();

  /* ================= render correctness ==================
     These render and read the framebuffer, because the bug they guard against
     was invisible to every structural check: a translucent stroke blended its
     own far wall through its near one, so it came out ~1.4x too dense and the
     error compounded as strokes were layered.                              */
  group('Render — layering and transparency');

  function shoot(){
    P.renderer.render(P.scene, P.cam());
    var s = P.renderer.domElement;
    var c = W.document.createElement('canvas');
    c.width = s.width; c.height = s.height;
    c.getContext('2d').drawImage(s, 0, 0);
    return {d:c.getContext('2d').getImageData(0,0,c.width,c.height).data, w:c.width, h:c.height};
  }
  /* brightest sample in a small box around a world point, so we read the tube
     body and not an antialiased edge */
  function probe(img, worldPt){
    var sp = P.worldToScreen(worldPt, {});
    var vpo = P.viewport();
    var sx = Math.round((sp.x-vpo.left)/vpo.w*img.w);
    var sy = Math.round((sp.y-vpo.top)/vpo.h*img.h);
    var bv = -1;
    for(var dy=-3;dy<=3;dy++) for(var dx=-3;dx<=3;dx++){
      var q = ((sy+dy)*img.w + (sx+dx))*4;
      if(q < 0 || q >= img.d.length) continue;
      var v = img.d[q]+img.d[q+1]+img.d[q+2];
      if(v > bv) bv = v;
    }
    return Math.round(bv/3);
  }
  function midOf(st){ return st.pts[Math.floor(st.pts.length/2)].p.clone(); }

  /* One "brightest pixel in a box" sample is noisy — which facet of the tube
     it catches depends on the angle. Average several points along the stroke
     for a stable brightness estimate. */
  function meanLevel(st){
    var img = shoot(), n = 0, sum = 0;
    var N = st.pts.length;
    var samples = Math.min(9, N);          // works for a 2-point stroke too
    for(var s=0; s<samples; s++){
      var q = Math.round((s + 0.5)/samples * (N-1));
      var lv = probe(img, st.pts[P.clamp(q, 0, N-1)].p.clone());
      if(lv > 0){ sum += lv; n++; }
    }
    return n ? sum/n : 0;
  }

  var savedBg = P.ENV.bg.clone();
  function inkSetup(op, brush){
    reset();
    P.VIEW.theta = 0.4; P.VIEW.phi = 1.2; P.applyCamera();
    P.TOOL.pressureOn = false; P.TOOL.pressureTarget = 'none'; P.TOOL.stableOn = false;
    P.TOOL.brush = brush || 'pen'; P.TOOL.sizeMM = 36;
    P.TOOL.color.set('#ffffff'); P.TOOL.opacity = op;
    P.ENV.bg.set('#000000'); P.applyEnv();
  }
  var inkPath = [{x:CX-160,y:CY-30},{x:CX-60,y:CY},{x:CX+60,y:CY+18},{x:CX+160,y:CY-10}];

  inkSetup(1.0); pen(inkPath);
  var opaqueLevel = meanLevel(P.Strokes.list[0]);
  ck('an opaque stroke renders solid', opaqueLevel > 120,
     'level ' + opaqueLevel.toFixed(0));

  inkSetup(0.5); pen(inkPath);
  var halfLevel = meanLevel(P.Strokes.list[0]);
  var ratio = halfLevel / opaqueLevel;
  /* 0.50 is correct; 0.69 was the double-sided self-blend. The gate sits well
     below that signature but loose enough to survive sampling noise. */
  ck('a 50% stroke renders at ~50%, not blended with its own back wall',
     ratio > 0.40 && ratio < 0.62,
     'ratio ' + ratio.toFixed(3) + ' (0.69 when double-sided)');

  ck('strokes cull back faces', P.Strokes.list[0].mesh.material.side === THREE.FrontSide);

  /* every brush must survive culling — a wrongly wound tube would vanish */
  inkSetup(1.0);
  var invisible = [];
  Object.keys(P.BRUSH).forEach(function(bn){
    P.Strokes.clear();
    P.TOOL.brush = bn;
    pen(inkPath);
    var lvl = probe(shoot(), midOf(P.Strokes.list[0]));
    if(lvl < 60) invisible.push(bn + ':' + lvl);
  });
  ck('no brush is culled inside-out', invisible.length === 0,
     invisible.join(', ') || 'all 10 visible');
  ck('every brush is a closed tube', Object.keys(P.BRUSH).every(function(bn){
    return P.BRUSH[bn].caps === true;
  }));

  /* a reflection reverses handedness, which is exactly what breaks culling */
  inkSetup(1.0);
  P.TOOL.brush = 'pen'; P.TOOL.mirror = 'x';
  pen([{x:CX+70,y:CY-40},{x:CX+130,y:CY},{x:CX+190,y:CY+40}]);
  var shotM = shoot();
  ck('mirror produced both halves', P.Strokes.list.length === 2);
  var origLvl = probe(shotM, midOf(P.Strokes.list[0]));
  var reflLvl = probe(shotM, midOf(P.Strokes.list[1]));
  ck('the mirrored half survives back-face culling', reflLvl > origLvl*0.7,
     'original ' + origLvl + ' vs mirrored ' + reflLvl);
  P.TOOL.mirror = null;

  /* the in-progress stroke must not change appearance when the pen lifts */
  inkSetup(1.0);
  penDown(inkPath[0].x, inkPath[0].y);
  for(i=1;i<inkPath.length;i++) penMoveTo(inkPath[i].x, inkPath[i].y);
  var liveMesh = P.Strokes.group.children[P.Strokes.group.children.length-1];
  var liveSt = liveMesh && liveMesh.userData.stroke;
  var duringDrag = liveSt ? probe(shoot(), midOf(liveSt)) : -1;
  var liveSide = liveMesh.material.side, liveTr = liveMesh.material.transparent;
  penUpAt(inkPath[inkPath.length-1].x, inkPath[inkPath.length-1].y);
  var committed = probe(shoot(), midOf(P.Strokes.list[0]));
  ck('live and committed materials match',
     liveSide === P.Strokes.list[0].mesh.material.side &&
     liveTr === P.Strokes.list[0].mesh.material.transparent);
  ck('the stroke does not jump in appearance on pen-up',
     Math.abs(duringDrag - committed) < 12, duringDrag + ' -> ' + committed);

  /* coincident tubes: retracing the same line must not shimmer */
  function speckleBox(img){
    var vpo = P.viewport();
    var ax = Math.round((CX-170-vpo.left)/vpo.w*img.w), bx = Math.round((CX+170-vpo.left)/vpo.w*img.w);
    var ay = Math.round((CY-60-vpo.top)/vpo.h*img.h),  by = Math.round((CY+60-vpo.top)/vpo.h*img.h);
    var sp=0, lit=0;
    for(var y=Math.max(1,ay); y<Math.min(img.h-1,by); y++){
      for(var x=Math.max(1,ax); x<Math.min(img.w-1,bx); x++){
        var q=(y*img.w+x)*4, l=(y*img.w+x-1)*4, rr=(y*img.w+x+1)*4;
        var v=img.d[q]+img.d[q+1]+img.d[q+2];
        if(v>90) lit++;
        var vl=img.d[l]+img.d[l+1]+img.d[l+2], vr=img.d[rr]+img.d[rr+1]+img.d[rr+2];
        if(Math.abs(v-vl)>60 && Math.abs(v-vr)>60 && Math.sign(v-vl)===Math.sign(v-vr)) sp++;
      }
    }
    return lit ? sp/lit : 0;
  }
  inkSetup(1.0); pen(inkPath);
  var sp1 = speckleBox(shoot());
  pen(inkPath); pen(inkPath); pen(inkPath);
  var sp4 = speckleBox(shoot());
  ck('retracing the same line four times adds no z-fighting speckle',
     sp4 <= sp1 + 0.005,
     (sp1*100).toFixed(2) + '% -> ' + (sp4*100).toFixed(2) + '%');

  P.ENV.bg.copy(savedBg); P.applyEnv();
  P.TOOL.opacity = 1; P.TOOL.stableOn = true; P.TOOL.pressureOn = true;
  P.TOOL.pressureTarget = 'size';

  /* ================= bend direction ================= */
  group('A.6  Bend follows the direction drawn');
  function bendTrial(dx, dy, label){
    reset();
    P.TOOL.autoGuide = true; P.TOOL.stableOn = false;
    var fv2 = P.ORTHO_VIEWS[0];
    P.VIEW.theta = fv2.theta; P.VIEW.phi = fv2.phi; P.applyCamera();
    pen([{x:CX-40,y:CY-70},{x:CX,y:CY-70},{x:CX+40,y:CY-70}]);
    var gg2 = P.Guides.active;
    var tv3 = P.ORTHO_VIEWS[4];
    P.VIEW.theta = tv3.theta; P.VIEW.phi = tv3.phi; P.applyCamera();
    P.setTool('bend');
    pen([{x:CX,y:CY},{x:CX+dx/2,y:CY+dy/2},{x:CX+dx,y:CY+dy}]);
    var pth = gg2.sweep.path;
    var a2 = P.worldToScreen(pth[0],{}), b2 = P.worldToScreen(pth[pth.length-1],{});
    var drawn = Math.atan2(dy,dx), got = Math.atan2(b2.y-a2.y, b2.x-a2.x);
    var err = Math.abs(((got-drawn+Math.PI*3)%(Math.PI*2))-Math.PI)*57.3;
    ck('bend sweeps the way it was drawn — ' + label, err < 20,
       err.toFixed(0) + ' deg off');
    P.TOOL.stableOn = true;
  }
  bendTrial( 160,   0, 'right');
  bendTrial(-160,   0, 'left');
  bendTrial(   0, 160, 'down');
  bendTrial(   0,-160, 'up');

  /* the doughnut must not depend on where the circle starts */
  function doughnutBox(startAngle){
    reset();
    P.TOOL.autoGuide = true; P.TOOL.stableOn = false;
    var fv3 = P.ORTHO_VIEWS[0];
    P.VIEW.theta = fv3.theta; P.VIEW.phi = fv3.phi; P.applyCamera();
    pen(circle(CX, CY, 70));
    var gd = P.Guides.active;
    var tv4 = P.ORTHO_VIEWS[4];
    P.VIEW.theta = tv4.theta; P.VIEW.phi = tv4.phi; P.applyCamera();
    P.setTool('bend');
    var ring = [];
    for(var q=0;q<=64;q++){
      var ang = startAngle + q/64*Math.PI*2;
      ring.push({x:CX+Math.cos(ang)*180, y:CY+Math.sin(ang)*180});
    }
    pen(ring);
    P.TOOL.stableOn = true;
    return new THREE.Box3().setFromObject(gd.mesh).getSize(new THREE.Vector3());
  }
  var d0 = doughnutBox(0), d90 = doughnutBox(Math.PI/2);
  ck('the doughnut is the same wherever the circle starts',
     Math.abs(d0.x-d90.x) < 0.1 && Math.abs(d0.y-d90.y) < 0.1,
     '[' + d0.toArray().map(function(v){return v.toFixed(2);}) + '] vs [' +
           d90.toArray().map(function(v){return v.toFixed(2);}) + ']');

  /* ================= brush smoothness ================= */
  group('Brush geometry is smooth along its length');
  reset();
  P.TOOL.stableOn = false; P.TOOL.pressureOn = false; P.TOOL.pressureTarget = 'none';
  P.TOOL.sizeMM = 36;
  var longPath = [];
  for(i=0;i<=60;i++) longPath.push({x:CX-300+i*10, y:CY});
  var worstJag = 0, worstName = '';
  Object.keys(P.BRUSH).forEach(function(bn){
    P.Strokes.clear();
    P.TOOL.brush = bn;
    pen(longPath);
    var st2 = P.Strokes.list[0], seg2 = P.BRUSH[bn].seg;
    var pos2 = st2.mesh.geometry.attributes.position, radii = [];
    for(var k=0;k<st2.pts.length;k++){
      var ctr2 = st2.pts[k].p, sum = 0;
      for(var s2=0;s2<seg2;s2++){
        var o2 = 2 + k*seg2 + s2;
        sum += Math.sqrt(Math.pow(pos2.getX(o2)-ctr2.x,2) +
                         Math.pow(pos2.getY(o2)-ctr2.y,2) +
                         Math.pow(pos2.getZ(o2)-ctr2.z,2));
      }
      radii.push(sum/seg2);
    }
    var mean2 = radii.reduce(function(a,b){return a+b;},0)/radii.length, jag = 0;
    for(k=1;k<radii.length-1;k++) jag += Math.abs(2*radii[k]-radii[k-1]-radii[k+1]);
    jag = (jag/Math.max(1,radii.length-2))/mean2*100;
    if(jag > worstJag){ worstJag = jag; worstName = bn; }
  });
  ck('no brush has a jagged silhouette', worstJag < 2,
     'worst ' + worstName + ' at ' + worstJag.toFixed(2) + '% (pencil grain was 9.90%)');
  P.TOOL.brush = 'pen'; P.TOOL.stableOn = true;
  P.TOOL.pressureOn = true; P.TOOL.pressureTarget = 'size';

  /* ================= imported references (C.1) ================= */
  group('C.1  Imported images and models as guides');

  var objSrc = ['v 0 0 0','v 1 0 0','v 0 1 0','v 0 0 1','vn 0 0 1','vn 0 1 0',
                'f 1 2 3','f 1//1 2//1 4//2','f 2 3 4','f 1 3 4'].join('\n');
  var og = P.Import.parseOBJ(objSrc);
  ck('OBJ parses', !!og && og.attributes.position.count === 12);
  ck('OBJ fans an n-gon', (function(){
    var q2 = P.Import.parseOBJ(['v 0 0 0','v 1 0 0','v 1 1 0','v 0 1 0','f 1 2 3 4'].join('\n'));
    return q2 && q2.attributes.position.count === 6;
  })());
  ck('OBJ handles negative indices', (function(){
    var q3 = P.Import.parseOBJ(['v 0 0 0','v 1 0 0','v 0 1 0','f -3 -2 -1'].join('\n'));
    return q3 && q3.attributes.position.count === 3;
  })());
  ck('OBJ rejects an empty file', P.Import.parseOBJ('# nothing') === null);

  var asciiStl = ['solid t','facet normal 0 0 1','outer loop','vertex 0 0 0',
    'vertex 1 0 0','vertex 0 1 0','endloop','endfacet','endsolid t'].join('\n');
  var ab = new Uint8Array(asciiStl.length);
  for(i=0;i<asciiStl.length;i++) ab[i] = asciiStl.charCodeAt(i);
  var sA = P.Import.parseSTL(ab.buffer);
  ck('ASCII STL parses with its facet normals',
     sA && sA.attributes.position.count === 3 &&
     Math.abs(sA.attributes.normal.getZ(0)-1) < 1e-6);

  var nT = 2, bbuf = new ArrayBuffer(84+nT*50), bdv = new DataView(bbuf);
  bdv.setUint32(80, nT, true);
  var bo = 84;
  for(var bt=0;bt<nT;bt++){
    bdv.setFloat32(bo,0,true); bdv.setFloat32(bo+4,1,true); bdv.setFloat32(bo+8,0,true);
    bo += 12;
    for(var bc=0;bc<3;bc++){
      bdv.setFloat32(bo, bc===1?1:0, true);
      bdv.setFloat32(bo+4, bt, true);
      bdv.setFloat32(bo+8, bc===2?1:0, true);
      bo += 12;
    }
    bo += 2;
  }
  var sB = P.Import.parseSTL(bbuf);
  ck('binary STL parses, and is told apart from ASCII',
     sB && sB.attributes.position.count === 6);

  var bigG = P.Import.parseOBJ(['v 0 0 0','v 1000 0 0','v 0 500 0','f 1 2 3'].join('\n'));
  P.Import.fitGeometry(bigG, 2);
  bigG.computeBoundingBox();
  var bsz = bigG.boundingBox.getSize(new THREE.Vector3());
  ck('an imported model is normalised in size',
     Math.abs(Math.max(bsz.x,bsz.y,bsz.z)-2) < 1e-4);
  ck('and rests on the ground plane', Math.abs(bigG.boundingBox.min.y) < 1e-4);

  reset();
  var plate = P.Import.parseOBJ(['v -1 -1 0','v 1 -1 0','v 1 1 0','v -1 1 0',
                                 'f 1 2 3','f 1 3 4'].join('\n'));
  P.Import.fitGeometry(plate, 2.2);
  var mGuide = P.Guides.fromModel(plate, 'plate');
  P.Guides.setActive(mGuide);
  ck('a model becomes an active guide', P.Guides.active.kind === 'model');
  ck('a model guide has no sweep, so bend stays off', !P.Guides.active.sweep);
  P.VIEW.pivot.set(0, 1.1, 0); P.applyCamera();
  pen([{x:CX-40,y:CY},{x:CX,y:CY},{x:CX+40,y:CY}]);
  ck('strokes project onto an imported model', P.Strokes.list.length === 1);
  ck('an imported model masks like any other guide',
     P.Guides.isMasked(new THREE.Vector3(0,1.1,-0.5)) === true);

  /* image guides: the documented no-drawing-past-the-edge rule */
  reset();
  var icv = W.document.createElement('canvas');
  icv.width = 64; icv.height = 32;
  var ictx = icv.getContext('2d');
  ictx.fillStyle = '#c0392b'; ictx.fillRect(0,0,64,32);
  var iurl = icv.toDataURL('image/png');

  P.VIEW.theta = 0; P.VIEW.phi = Math.PI/2; P.VIEW.radius = 14; P.applyCamera();
  P.TOOL.stableOn = false;
  var ig = P.Guides.fromImage(iurl, 64, 32, 'swatch');
  P.Guides.setActive(ig);
  ck('an image becomes an active guide', P.Guides.active.kind === 'image');
  ck('its aspect ratio is preserved', Math.abs(ig.imageAspect - 2) < 1e-9);
  ck('an image may be fully opaque, unlike a scaffold guide',
     (P.Guides.setOpacity(ig, 1), ig.opacity === 1));

  var ibox = new THREE.Box3().setFromObject(ig.mesh);
  var ic = ibox.getCenter(new THREE.Vector3()), isz = ibox.getSize(new THREE.Vector3());
  var iscr = P.worldToScreen(ic, {});
  var icorner = P.worldToScreen(new THREE.Vector3(ic.x+isz.x/2, ic.y+isz.y/2, ic.z), {});
  var ihw = Math.abs(icorner.x - iscr.x), ihh = Math.abs(icorner.y - iscr.y);
  ck('the test can see the whole image', ihw < vpo().w/2 && ihh < vpo().h/2);

  ck('projection inside the image works', P.Guides.project(iscr.x, iscr.y) !== null);
  var ioff = iscr.x + ihw + 40;
  ck('projection past the edge is refused, not clamped',
     P.Guides.project(ioff, iscr.y) === null);

  P.Strokes.clear();
  pen([{x:ioff,y:iscr.y},{x:ioff+20,y:iscr.y+10},{x:ioff+40,y:iscr.y+20}]);
  ck('a stroke drawn off the image creates nothing', P.Strokes.list.length === 0,
     'n=' + P.Strokes.list.length);
  pen([{x:iscr.x-ihw*0.5,y:iscr.y},{x:iscr.x,y:iscr.y},{x:iscr.x+ihw*0.5,y:iscr.y}]);
  ck('a stroke inside the image draws normally', P.Strokes.list.length === 1);

  P.Strokes.clear();

  for(i=0;i<cpos.count;i++){
    var cs = P.worldToScreen(new THREE.Vector3(cpos.getX(i),cpos.getY(i),cpos.getZ(i)), {});
    cminX = Math.min(cminX, cs.x); cmaxX = Math.max(cmaxX, cs.x);
    cmaxY = Math.max(cmaxY, cs.y);

  var cprobes = [], cdupes = 0, clast = null;
  for(i=0;i<=40;i++){

    if(!chit) continue;
    if(clast && chit.point.distanceTo(clast) < 1e-9) cdupes++;
    clast = chit.point.clone(); cprobes.push(clast);
  }
  ck('clamping tracks the cursor instead of repeating',
     cprobes.length > 20 && cdupes < cprobes.length*0.15,
     cprobes.length + ' probes, ' + cdupes + ' identical');
  var onVert = 0;
  for(i=0;i<cprobes.length;i++){
    var nearest = Infinity;
    for(var vq=0; vq<cpos.count; vq++){
      nearest = Math.min(nearest, cprobes[i].distanceToSquared(
        new THREE.Vector3(cpos.getX(vq),cpos.getY(vq),cpos.getZ(vq))));

  /* THE DEFORM MUST RUN THE WAY THE STROKE RUNS. It used to pick the mesh's
     longest bbox axis and always run it low-to-high, which is meaningless for
     a cube or a sphere: the deform went along local +X whatever was drawn, and
     the guide swept away from the pen. Measured by projecting every deformed
     vertex onto the drawn chord — the mesh should span it, 0 to 1, not sit
     behind the start at a negative t. */
  function deformSpan(kind, dx, dy){
    reset();
    P.Guides.setActive(P.Guides.primitive(kind, 24, 1));
    var g4 = P.Guides.active;
    var cs = P.worldToScreen(P.Guides.centreOf(g4), {});
    P.setTool('bend'); P.TOOL.stableOn = false;
    pen([{x:cs.x-dx/2, y:cs.y-dy/2},
         {x:cs.x,      y:cs.y},
         {x:cs.x+dx/2, y:cs.y+dy/2}]);
    P.TOOL.stableOn = true;
    var bp = g4.bendPath;
    if(!bp) return null;
    var A4 = bp[0].clone(), B4 = bp[bp.length-1].clone();
    var dir4 = B4.clone().sub(A4), L4 = dir4.length();
    if(L4 < 1e-6) return null;
    dir4.divideScalar(L4);
    var attr4 = g4.mesh.geometry.attributes.position, v4 = new THREE.Vector3();
    g4.mesh.updateMatrixWorld(true);
    var lo4 = Infinity, hi4 = -Infinity, sum4 = 0;
    for(var q4=0;q4<attr4.count;q4++){
      v4.set(attr4.getX(q4), attr4.getY(q4), attr4.getZ(q4))
        .applyMatrix4(g4.mesh.matrixWorld).sub(A4);
      var t4 = v4.dot(dir4)/L4;
      lo4 = Math.min(lo4, t4); hi4 = Math.max(hi4, t4); sum4 += t4;
    }
    return { lo:lo4, hi:hi4, mean:sum4/attr4.count };
  }
  var deformBad = [];
  [['cube',240,0], ['sphere',240,0], ['tube',240,0], ['pyramid',240,0],
   ['cube',-240,0], ['tube',0,240], ['sphere',-170,-170]].forEach(function(c){
    var sp = deformSpan(c[0], c[1], c[2]);
    if(!sp) { deformBad.push(c[0]+' not deformed'); return; }
    if(sp.mean < 0.3 || sp.mean > 0.7)
      deformBad.push(c[0]+'('+c[1]+','+c[2]+') mean t=' + sp.mean.toFixed(2));
  });
  ck('a deform bend follows the stroke, whatever the shape or direction',
     deformBad.length === 0, deformBad.join('; ') || '7 cases, all centred on the stroke');
  var sp1 = deformSpan('cube', 240, 0);
  ck('...spanning it end to end rather than hanging off one end',

  /* Where an axis HANDLE sits (fixed, a third of the ring apart) and which way
     that axis runs ON SCREEN (which does follow the camera). The two used to be
     the same angle; separating them is the whole change. */
  var FIXED_ANG = { x: Math.PI/6, y: -Math.PI/2, z: Math.PI*5/6 };
  function arcSpot(key, axisVec){
    var c = P.Tools.transformCentre();
    var a = P.worldToScreen(c, {});
    var b = P.worldToScreen(c.clone().add(axisVec), {});
    var at = FIXED_ANG[key];
    return { x: 54 + Math.cos(at)*35, y: 54 + Math.sin(at)*35,
             ang: Math.atan2(b.y-a.y, b.x-a.x) };
  }
  function padDrag(spot, dx, dy){
    var pad = rid('joyPad'), r = pad.getBoundingClientRect();
    var sx = r.left + spot.x*(r.width/108), sy = r.top + spot.y*(r.height/108);
    function pe(t,x,y,b){ pad.dispatchEvent(new W.PointerEvent(t,{pointerId:5,
      pointerType:'mouse',clientX:x,clientY:y,buttons:b,bubbles:true,cancelable:true})); }
    pe('pointerdown',sx,sy,1);
    pe('pointermove',sx+dx/2,sy+dy/2,1);
    pe('pointermove',sx+dx,sy+dy,1);
    pe('pointerup',sx+dx,sy+dy,0);
  }

  var pStart = jst.pts[0].p.clone();
  var sx1 = arcSpot('x', new THREE.Vector3(1,0,0));
  padDrag(sx1, Math.cos(sx1.ang)*60, Math.sin(sx1.ang)*60);
  var dv = jst.pts[0].p.clone().sub(pStart);

  pStart = jst.pts[0].p.clone();
  var sy1 = arcSpot('y', new THREE.Vector3(0,1,0));
  padDrag(sy1, Math.cos(sy1.ang)*60, Math.sin(sy1.ang)*60);
  dv = jst.pts[0].p.clone().sub(pStart);
  ck('grabbing the Y arc moves along world Y only',
     Math.abs(dv.y) > 1e-4 && Math.abs(dv.x) < 1e-9 && Math.abs(dv.z) < 1e-9,
     dv.x.toFixed(3)+', '+dv.y.toFixed(3)+', '+dv.z.toFixed(3));
  P.History.undo();

  pStart = jst.pts[0].p.clone();
  padDrag({x:54,y:54,ang:0}, 40, 0);
  dv = jst.pts[0].p.clone().sub(pStart);
  var touched = [Math.abs(dv.x)>1e-6, Math.abs(dv.y)>1e-6, Math.abs(dv.z)>1e-6]
                  .filter(Boolean).length;
  ck('the centre of the pad still drags freely', touched >= 2, touched + ' axes moved');
  P.History.undo();

  rid('joyMode').querySelector('[data-joy="rotate"]').click();
  var rBefore = jst.pts.map(function(q){ return q.p.clone(); });
  var sz1 = arcSpot('z', new THREE.Vector3(0,0,1));
  padDrag(sz1, -Math.sin(sz1.ang)*50, Math.cos(sz1.ang)*50);
  ck('sweeping round an arc rotates about that axis',
     jst.pts.some(function(q,k){ return q.p.distanceTo(rBefore[k]) > 1e-4; }));
  P.History.undo();
  rid('joyMode').querySelector('[data-joy="move"]').click();

  /* the panel can be repositioned */
  var jpanel = rid('joy'), jgrip = rid('joyGrip');
  function gripDrag(dx, dy){
    var g = jgrip.getBoundingClientRect();
    var gx = g.left + g.width/2, gy = g.top + g.height/2;
    function ge(t,x,y,b){ jgrip.dispatchEvent(new W.PointerEvent(t,{pointerId:7,
      pointerType:'mouse',clientX:x,clientY:y,buttons:b,bubbles:true,cancelable:true})); }
    ge('pointerdown',gx,gy,1); ge('pointermove',gx+dx,gy+dy,1); ge('pointerup',gx+dx,gy+dy,0);
  }
  var jr0 = jpanel.getBoundingClientRect();
  gripDrag(-140,-70);
  var jr1 = jpanel.getBoundingClientRect();
  ck('the grip drags the whole panel',
     Math.abs(jr1.left-(jr0.left-140)) < 3 && Math.abs(jr1.top-(jr0.top-70)) < 3,
     (jr1.left-jr0.left).toFixed(0)+','+(jr1.top-jr0.top).toFixed(0));
  gripDrag(-900,-900);
  var jr2 = jpanel.getBoundingClientRect();
  ck('a second drag right after the first is not read as a double-tap',
     jr2.left !== jr1.left || jr2.top !== jr1.top);
  ck('and the panel stays on screen', jr2.left >= 3 && jr2.top >= 3,
     jr2.left.toFixed(0)+','+jr2.top.toFixed(0));

  var gg = jgrip.getBoundingClientRect();
  function gtap(){
    function ge(t,x,y,b){ jgrip.dispatchEvent(new W.PointerEvent(t,{pointerId:7,
      pointerType:'mouse',clientX:x,clientY:y,buttons:b,bubbles:true,cancelable:true})); }
    ge('pointerdown',gg.left+gg.width/2,gg.top+gg.height/2,1);
    ge('pointerup',  gg.left+gg.width/2,gg.top+gg.height/2,0);
  }
  gtap(); gtap();
  ck('a true double-tap parks it back', !jpanel.classList.contains('placed'));

  var jp0 = jst.pts[0].p.clone();
  padDrag({x:54,y:54,ang:0}, 40, 0);
  ck('the pad still works after the panel has been moved',
     jst.pts[0].p.distanceTo(jp0) > 1e-5);
  P.History.undo();
  P.Strokes.clearSelection();

  reset(); P.killSpin();
  flush();

  /* ==================================================================
     Async tail. Draw Shape's hold-to-adjust is driven by a real timer,
     so these cannot run inside the synchronous sweep above.
     ================================================================== */
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function penRaw(type, x, y, buttons){
    P.elStage.dispatchEvent(new W.PointerEvent(type, {pointerId:99, pointerType:'pen',
      clientX:x, clientY:y, buttons:buttons, pressure:buttons?0.7:0,
      bubbles:true, cancelable:true}));
  }
  function endLen(st){ return st.pts[0].p.distanceTo(st.pts[st.pts.length-1].p); }
  function liveStroke(){
    var kids = P.Strokes.group.children;
    return kids.length ? kids[kids.length-1].userData.stroke : null;
  }

  group('C.9  Draw Shape — hold to adjust');
  reset();
  P.TOOL.stableOn = false;
  P.setTool('shape');
  penRaw('pointerdown', CX-150, CY, 1);
  penRaw('pointermove', CX-80,  CY, 1);
  penRaw('pointermove', CX,     CY, 1);

  wait(620).then(function(){
    ck('holding still freezes the stroke into its fitted shape',
       P.Tools.isAdjustingShape() === true);
    var st3 = liveStroke();
    var len0 = st3 ? endLen(st3) : 0;
    penRaw('pointermove', CX+180, CY, 1);
    var len1 = endLen(st3);
    ck('dragging then steers the end point', len1 > len0*1.4,
       len0.toFixed(3) + ' -> ' + len1.toFixed(3));
    penRaw('pointerup', CX+180, CY, 0);
    ck('the adjusted line commits once', P.Strokes.list.length === 1);
    ck('and keeps the length it was dragged to',
       Math.abs(endLen(P.Strokes.list[0]) - len1) < 1e-6);
    var sA = P.Strokes.list[0], A3 = sA.pts[0].p, B3 = sA.pts[sA.pts.length-1].p;
    var ab3 = B3.clone().sub(A3), L3 = ab3.length(), dev3 = 0;
    for(var z=0; z<sA.pts.length; z++){
      dev3 = Math.max(dev3, sA.pts[z].p.clone().sub(A3).cross(ab3).length()/L3);
    }
    ck('the adjusted line is still straight', dev3 < L3*0.005);
    P.History.undo();
    ck('the whole hold-and-adjust is one undo step', P.Strokes.list.length === 0);

    reset(); P.TOOL.stableOn = false; P.setTool('shape');
    var nn = 28;
    penRaw('pointerdown', CX+70, CY, 1);
    for(var q3=1; q3<=nn; q3++){
      var a3 = q3/nn*Math.PI*2;
      penRaw('pointermove', CX+Math.cos(a3)*70, CY+Math.sin(a3)*70, 1);
    }
    return wait(620);
  }).then(function(){
    function radiusOf(s){
      var u = s.pts.slice();
      if(u.length>1 && u[0].p.distanceTo(u[u.length-1].p) < 1e-9) u.pop();
      var ctr3 = new THREE.Vector3();
      u.forEach(function(q){ ctr3.add(q.p); });
      ctr3.multiplyScalar(1/u.length);
      var r3 = 0;
      u.forEach(function(q){ r3 += q.p.distanceTo(ctr3); });
      return r3/u.length;
    }
    ck('a circle also enters adjust mode', P.Tools.isAdjustingShape() === true);
    var stc = liveStroke();
    var r0 = radiusOf(stc);
    penRaw('pointermove', CX+160, CY, 1);
    var r1 = radiusOf(stc);
    ck('dragging resizes the circle', r1 > r0*1.6,
       r0.toFixed(3) + ' -> ' + r1.toFixed(3));
    penRaw('pointerup', CX+160, CY, 0);
    ck('the resized circle commits', P.Strokes.list.length === 1);
    ck('and is still round', (function(){
      var u = P.Strokes.list[0].pts.slice();
      if(u.length>1 && u[0].p.distanceTo(u[u.length-1].p) < 1e-9) u.pop();
      var ctr4 = new THREE.Vector3();
      u.forEach(function(q){ ctr4.add(q.p); });
      ctr4.multiplyScalar(1/u.length);
      var lo4 = Infinity, hi4 = -Infinity;
      u.forEach(function(q){
        var d4 = q.p.distanceTo(ctr4); lo4 = Math.min(lo4,d4); hi4 = Math.max(hi4,d4);
      });
      return (hi4-lo4) < hi4*0.02;
    })());

    /* a stroke drawn without pausing must behave exactly as before */
    reset(); P.TOOL.stableOn = false; P.setTool('shape');
    penRaw('pointerdown', CX-150, CY, 1);
    penRaw('pointermove', CX-50, CY+2, 1);
    penRaw('pointermove', CX+50, CY-2, 1);
    penRaw('pointerup',   CX+150, CY, 0);
    ck('a stroke drawn without pausing still just auto-fits',
       P.Strokes.list.length === 1 && P.Tools.isAdjustingShape() === false);

    /* ---- a bare press, with no travel at all ----
       FACT (C.9): "press-hold-drag to size a circle". There is no input to
       auto-correct, so the press seeds a circle where it landed and the drag
       out of it becomes the radius. */
    reset(); P.TOOL.stableOn = false; P.TOOL.shapeHold = true;
    P.setTool('shape');
    penRaw('pointerdown', CX, CY, 1);
    return wait(620);
  }).then(function(){
    function meanR(s){
      var u = s.pts.slice();
      if(u.length>1 && u[0].p.distanceTo(u[u.length-1].p) < 1e-9) u.pop();
      var c = new THREE.Vector3();
      u.forEach(function(q){ c.add(q.p); });
      c.multiplyScalar(1/u.length);
      var r = 0;
      u.forEach(function(q){ r += q.p.distanceTo(c); });
      return r/u.length;
    }
    ck('a press that never moves snaps to a circle on its own',
       P.Tools.isAdjustingShape() === true);
    var stp = liveStroke();
    penRaw('pointermove', CX+60, CY, 1);
    var r60 = meanR(stp);
    penRaw('pointermove', CX+180, CY, 1);
    var r180 = meanR(stp);
    ck('dragging out of that press sizes it', r180 > r60*2.5,
       r60.toFixed(3) + ' -> ' + r180.toFixed(3));
    /* the radius IS the drag distance, so tripling the drag triples it */
    ck('and the radius tracks the drag one-for-one',
       Math.abs((r180/r60)/3 - 1) < 0.02,
       'x' + ((r180/r60)/3).toFixed(4));
    penRaw('pointerup', CX+180, CY, 0);
    ck('the pressed circle commits once', P.Strokes.list.length === 1);
    P.History.undo();
    ck('and the whole press-drag is one undo step', P.Strokes.list.length === 0);

    /* A pen resting on glass wanders a pixel or two and MIN_PX lets anything
       past 2px through as travel. Those samples must not keep resetting the
       hold clock, or "hold still" never fires for an unsteady hand. */
    reset(); P.TOOL.stableOn = false; P.TOOL.shapeHold = true;
    P.setTool('shape');
    penRaw('pointerdown', CX, CY, 1);
    var jitter = 0;
    function tremor(){
      if(jitter >= 6) return wait(140);
      penRaw('pointermove', CX + (jitter%2 ? 3 : -3), CY + (jitter%3 ? 2 : -2), 1);
      jitter++;
      return wait(90).then(tremor);
    }
    return tremor();
  }).then(function(){
    ck('a few pixels of hand tremor still counts as holding still',
       P.Tools.isAdjustingShape() === true);
    penRaw('pointerup', CX, CY, 0);

    /* Pausing to steady your hand before a normal stroke is ordinary, and
       turning that into a circle would wreck it. The bare press is the Shape
       tool's gesture only. */
    reset(); P.TOOL.stableOn = false; P.TOOL.shapeHold = true;
    P.TOOL.autoGuide = false; P.setTool('draw');
    penRaw('pointerdown', CX-100, CY-60, 1);
    return wait(620);
  }).then(function(){
    ck('a steadying pause in the DRAW tool is not turned into a circle',
       P.Tools.isAdjustingShape() === false);
    penRaw('pointermove', CX-40, CY-40, 1);
    penRaw('pointermove', CX+20, CY-20, 1);
    penRaw('pointerup',   CX+20, CY-20, 0);
    ck('and that stroke draws normally', P.Strokes.list.length === 1);

    /* ---- hold-to-shape while drawing normally, and on guides (C.9) ---- */
    group('C.9  Hold to shape — brushes, guides and bends');

    function wobbly(cx, cy, rad, n){
      var o = [];
      for(var q=0;q<=n;q++){
        var a = q/n*Math.PI*2, rr = rad + (q%3 ? 6 : -6);
        o.push({x:cx+Math.cos(a)*rr, y:cy+Math.sin(a)*rr});
      }
      return o;
    }
    function drawHeld(pts){
      penRaw('pointerdown', pts[0].x, pts[0].y, 1);
      for(var q=1;q<pts.length;q++) penRaw('pointermove', pts[q].x, pts[q].y, 1);
    }
    function roundness(points){
      var u = points.slice();
      if(u.length>1 && u[0].distanceTo(u[u.length-1]) < 1e-9) u.pop();
      var c = new THREE.Vector3();
      u.forEach(function(q){ c.add(q); });
      c.multiplyScalar(1/u.length);
      var lo = Infinity, hi = -Infinity;
      u.forEach(function(q){ var d = q.distanceTo(c); lo = Math.min(lo,d); hi = Math.max(hi,d); });
      return (hi-lo)/Math.max(hi,1e-9);
    }

    reset(); P.TOOL.stableOn = false; P.TOOL.shapeHold = true;
    P.TOOL.autoGuide = false; P.setTool('draw');           // the plain brush
    var loop1 = wobbly(CX, CY, 80, 32);
    drawHeld(loop1);
    return wait(620).then(function(){
      ck('holding while drawing a CURVE snaps it', P.Tools.isAdjustingShape() === true);
      ck('a wobbly loop is read as a circle',
         P.Tools.liveShape() && P.Tools.liveShape().kind === 'circle');
      penRaw('pointerup', loop1[0].x, loop1[0].y, 0);
      ck('it commits as one curve', P.Strokes.list.length === 1);
      ck('and the committed curve is truly round',
         roundness(P.Strokes.list[0].pts.map(function(q){ return q.p; })) < 0.02);

      reset(); P.TOOL.stableOn = false; P.setTool('guide');
      drawHeld(wobbly(CX, CY, 70, 32));
      return wait(620);
    }).then(function(){
      ck('holding while drawing a GUIDE snaps its profile',
         P.Tools.isAdjustingShape() === true &&
         P.Tools.liveShape().kind === 'circle');
      penRaw('pointerup', CX+70, CY, 0);
      ck('the guide is created', !!P.Guides.active && !!P.Guides.active.sweep);
      var prof = P.Guides.active.sweep.local.map(function(l){
        return new THREE.Vector3(l.x, l.y, 0);
      });
      ck('so the extrusion is a clean cylinder', roundness(prof) < 0.03,
         'profile roundness ' + roundness(prof).toFixed(4));

      var tv5 = P.ORTHO_VIEWS[4];
      P.VIEW.theta = tv5.theta; P.VIEW.phi = tv5.phi; P.applyCamera();
      P.setTool('bend');
      drawHeld(wobbly(CX, CY, 180, 40));
      return wait(620);
    }).then(function(){
      ck('holding while drawing a BEND snaps the sweep path',
         P.Tools.isAdjustingShape() === true &&
         P.Tools.liveShape().kind === 'circle');
      penRaw('pointerup', CX+180, CY, 0);
      var gh = P.Guides.active;
      ck('the bend applied', gh.sweep.anchorIndex === 0);
      var hpos = gh.mesh.geometry.attributes.position, hpath = gh.sweep.path;
      var hp = new THREE.Vector3(), hlo = Infinity, hhi = -Infinity;
      for(var q=0;q<hpos.count;q+=7){
        hp.set(hpos.getX(q), hpos.getY(q), hpos.getZ(q));
        var bst = Infinity;
        for(var j5=0;j5<hpath.length;j5++) bst = Math.min(bst, hp.distanceTo(hpath[j5]));
        hlo = Math.min(hlo,bst); hhi = Math.max(hhi,bst);
      }
      ck('a circle profile swept on a circle path gives an even torus',
         (hhi-hlo) < hhi*0.2, 'tube ' + hlo.toFixed(3) + '–' + hhi.toFixed(3));

      /* the toggle must really switch it off */
      reset(); P.TOOL.stableOn = false; P.TOOL.autoGuide = false;
      P.setTool('draw'); P.TOOL.shapeHold = false;
      var loop2 = wobbly(CX, CY, 80, 32);
      drawHeld(loop2);
      return wait(620);
    }).then(function(){
      ck('with hold-to-shape off nothing snaps', P.Tools.isAdjustingShape() === false);
      penRaw('pointerup', CX+80, CY, 0);
      ck('the freehand stroke is kept as drawn', P.Strokes.list.length === 1);
      ck('and it is NOT round', roundness(P.Strokes.list[0].pts.map(function(q){
        return q.p; })) > 0.02);

      P.TOOL.shapeHold = true;
      P.TOOL.stableOn = true;
      P.setTool('draw');
      reset(); P.killSpin();

      /* ---- holding a group row selects its curves ---- */
      group('Grouping panel — hold to select');
      var GD = W.document;
      P.TOOL.autoGuide = false; P.TOOL.stableOn = false;
      pen([{x:CX-140,y:CY-50},{x:CX,y:CY-30},{x:CX+140,y:CY-60}]);
      pen([{x:CX-140,y:CY+50},{x:CX,y:CY+70},{x:CX+140,y:CY+40}]);
      var hg = P.Tools.newGroup('Plate window');
      pen([{x:CX-100,y:CY},{x:CX+100,y:CY}]);        // one curve in the new group
      if(GD.getElementById('stagePanel').classList.contains('hidden')){
        GD.getElementById('btnStage').click();
      }
      P.UI.refresh();
      var gRows = GD.querySelectorAll('#groupList .grpRow');
      ck('the panel lists one row per group', gRows.length === 2,
         gRows.length + ' rows for ' + P.Strokes.groups.length + ' groups');
      ck('the active group is the highlighted one',
         gRows[0].classList.contains('on') &&
         String(gRows[0].dataset.id) === String(P.Strokes.activeGroup));
      ck('each row shows how many curves it holds',
         gRows[0].querySelector('.grpCount').textContent === '1' &&
         gRows[1].querySelector('.grpCount').textContent === '2');

      P.Strokes.clearSelection(); P.onSceneChange();
      function rowPress(row, type){
        row.dispatchEvent(new W.PointerEvent(type, {pointerId:42, pointerType:'touch',
          clientX:0, clientY:0, bubbles:true, cancelable:true}));
      }
      var secondRow = GD.querySelectorAll('#groupList .grpRow')[1];
      rowPress(secondRow, 'pointerdown');
      return wait(620).then(function(){
        ck('holding a row selects everything in that group',
           P.Strokes.selection.length === 2,
           P.Strokes.selection.length + ' selected');
        rowPress(secondRow, 'pointerup');

        /* and a plain tap just makes it the group you draw into */
        var rows2 = GD.querySelectorAll('#groupList .grpRow');
        var target = P.Strokes.groups[1].id;
        rowPress(rows2[1], 'pointerdown');
        rowPress(rows2[1], 'pointerup');
        ck('a tap on a row makes it active instead',
           P.Strokes.activeGroup === target);
        P.Strokes.clearSelection();
        GD.getElementById('btnStage').click();
        reset(); P.killSpin();
        flush();
      });
    });
  });
}
</script>
</body>
</html>
