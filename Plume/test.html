  flat = flatGuide(ellipse20(180, 120));
  P.TOOL.brush = 'wide'; P.TOOL.sizeMM = 60; P.TOOL.opacity = 1;
  var fillMade = P.Tools.fillGuide();
  var gBox20 = new THREE.Box3().setFromObject(flat.mesh), pBox20 = new THREE.Box3();
  for(var f20=0; f20<P.Strokes.list.length; f20++){
    pBox20.union(new THREE.Box3().setFromObject(P.Strokes.list[f20].mesh));
  }
  var over20 = Math.max(pBox20.max.x - gBox20.max.x, gBox20.min.x - pBox20.min.x,
                        pBox20.max.y - gBox20.max.y, gBox20.min.y - pBox20.min.y);
  ck('a flat guide fills, and the paint stays inside the outline',
     !!fillMade && fillMade.length > 0 && over20 < 6*P.MM,
     fillMade.length + ' strokes, worst overflow ' + (over20/P.MM).toFixed(0) + 'mm');

  /* ROWS ARE CUT BY THE SHAPE. Across an ellipse the middle row is the widest;
     across a horseshoe a row crossing the gap must come out as TWO strokes
     rather than one drawn straight over the hole. */
  var lengths20 = fillMade.map(function(x){
    var L = 0;
    for(var q20=1;q20<x.pts.length;q20++) L += x.pts[q20].p.distanceTo(x.pts[q20-1].p);
    return L;
  });
  ck('...and rows are cut to the shape, not run to its bounding box',
     Math.max.apply(null, lengths20) > Math.min.apply(null, lengths20) * 1.15,
     lengths20.map(function(x){ return (x/P.MM).toFixed(0); }).join(' / ') + 'mm rows');

  var horse = [];
  for(var h20=0; h20<=20; h20++){                    // outer arc, left to right
    var ta = Math.PI * (h20/20);
    horse.push({x:CX-Math.cos(ta)*200, y:CY-Math.sin(ta)*200});
  }
  for(h20=20; h20>=0; h20--){                        // inner arc, back again
    var tb = Math.PI * (h20/20);
    horse.push({x:CX-Math.cos(tb)*100, y:CY-Math.sin(tb)*100});
  }
  var uShape = flatGuide(horse);
  P.TOOL.brush = 'wide'; P.TOOL.sizeMM = 40; P.TOOL.opacity = 1;
  var horseFill = P.Tools.fillGuide();
  /* a row that crosses the opening of the horseshoe must not bridge it: with
     more strokes than rows, some row was broken in two */
  var rowsAcross = Math.ceil(Math.min(uShape.plane.Lu, uShape.plane.Lv) /
                             (P.Strokes.nibHalfWidth(horseFill[0], horseFill[0].baseRadius *
                               P.BRUSH[horseFill[0].brush].wide) * 2 * 0.9));
  ck('a row crossing a gap in the shape comes out as two strokes',
     horseFill.length > rowsAcross,
     horseFill.length + ' strokes for about ' + rowsAcross + ' rows');

  /* SAVE AND RELOAD */
  var flatJson = JSON.stringify(P.Doc.serialize());
  P.Doc.clear();
  P.Doc.restore(JSON.parse(flatJson));
  var back20 = P.Guides.active;
  ck('a flat guide survives a save and reload',
     !!back20 && back20.kind === 'flat' && !!back20.plane &&
     Math.abs(back20.plane.Lu - uShape.plane.Lu) < 1e-4 &&
     back20.plane.outline.length === uShape.plane.outline.length,
     back20 ? back20.kind + ', outline of ' + back20.plane.outline.length + ' points'
            : 'nothing came back');
  reset();

  /* ================= Liquify ================= */
  group('Liquify — push, pinch and comb');
  /* FACT: "select the curves or sketches you want to modify and tap Liquify.
     Press and drag with your pen to liquify your curves or drawings." The
     panel carries size, range and strength, each adjusted by sliding up or
     down, a mode you tap to change, and an Apply button. */
  var LD = W.document;
  function straightCurve(){
    reset();
    P.TOOL.stableOn = false; P.TOOL.pressureOn = false; P.TOOL.brush = 'pen';
    P.VIEW.theta = 0; P.VIEW.phi = Math.PI/2; P.applyCamera();
    pen([{x:CX-220,y:CY},{x:CX-110,y:CY},{x:CX,y:CY},{x:CX+110,y:CY},{x:CX+220,y:CY}]);
    return P.Strokes.list[0];
  }
  function dragReadout(id, dy){
    var el10 = LD.getElementById(id), r10 = el10.getBoundingClientRect();
    var x10 = r10.left + r10.width/2, y10 = r10.top + r10.height/2;
    function pe(t, yy, btn){
      el10.dispatchEvent(new W.PointerEvent(t, {pointerId:76, pointerType:'touch',
        clientX:x10, clientY:yy, buttons:btn, bubbles:true, cancelable:true}));
    }
    pe('pointerdown', y10, 1);
    pe('pointermove', y10 - dy/2, 1);
    pe('pointermove', y10 - dy, 1);
    pe('pointerup',   y10 - dy, 0);
  }
  function drag(from, to, steps){
    steps = steps || 8;
    penEvent('pointerdown', from.x, from.y, 1);
    for(var q=1;q<=steps;q++){
      penEvent('pointermove', from.x + (to.x-from.x)*q/steps,
                              from.y + (to.y-from.y)*q/steps, 1);
    }
    penEvent('pointerup', to.x, to.y, 0);
  }

  var lqSt = straightCurve();
  var lqBefore = lqSt.pts.map(function(q){ return q.p.clone(); });
  P.Strokes.setSelected(lqSt, true); P.onSceneChange();
  LD.getElementById('btnSelLiquify').click();
  ck('Liquify opens from the selection and keeps the selection',
     P.TOOL.mode === 'liquify' && P.Strokes.selection.length === 1);
  ck('...and brings up its panel', !LD.getElementById('liquifyPanel').classList.contains('hidden'));

  /* PUSH — "distorts naturally, as if pushing or pulling with a finger" */
  P.TOOL.liquify.mode = 'push'; P.TOOL.liquify.size = 160;
  P.TOOL.liquify.strength = 100; P.TOOL.liquify.range = 60;
  drag({x:CX,y:CY}, {x:CX,y:CY+80});
  var lqMid = Math.floor(lqSt.pts.length/2);
  var movedMid = lqSt.pts[lqMid].p.distanceTo(lqBefore[lqMid]) / P.MM;
  var movedEnd = lqSt.pts[0].p.distanceTo(lqBefore[0]) / P.MM;
  ck('push moves the curve under the pen', movedMid > 20,
     movedMid.toFixed(0) + 'mm at the centre of the brush');
  ck('...and falls off to nothing outside it', movedEnd < movedMid*0.1,
     movedEnd.toFixed(1) + 'mm at a point ' + P.TOOL.liquify.size + 'px away');
  ck('the whole session is one undo step', P.History.canUndo() && (function(){
    P.History.undo();
    var back = lqSt.pts[lqMid].p.distanceTo(lqBefore[lqMid]) < 1e-9;
    P.History.redo();
    return back;
  })());

  /* the size setting really is the reach */
  var lqSt2 = straightCurve();
  var before2 = lqSt2.pts.map(function(q){ return q.p.clone(); });
  P.Strokes.setSelected(lqSt2, true); P.setTool('liquify');
  P.TOOL.liquify.size = 40;
  drag({x:CX,y:CY}, {x:CX,y:CY+80});
  var reached = 0;
  for(var li=0; li<lqSt2.pts.length; li++){
    if(lqSt2.pts[li].p.distanceTo(before2[li]) > 1e-6){
      reached = Math.max(reached, Math.abs(ts(before2[li]).x - CX));
    }
  }
  ck('a smaller size reaches less far', reached < 60,
     'furthest point moved was ' + reached.toFixed(0) + 'px from the pen');

  /* COMB — "gently smooths and aligns as if combing", for wavy curves */
  reset();
  P.TOOL.stableOn = false; P.TOOL.pressureOn = false;
  P.VIEW.theta = 0; P.VIEW.phi = Math.PI/2; P.applyCamera();
  var wobbly10 = [];
  for(var wq=0; wq<=40; wq++){
    var wt = wq/40;
    wobbly10.push({x:CX-220+440*wt, y:CY+Math.sin(wt*22)*16});
  }
  pen(wobbly10);
  var combSt = P.Strokes.list[0];
  function waviness(st10){
    var A10 = st10.pts[0].p, B10 = st10.pts[st10.pts.length-1].p;
    var ab10 = B10.clone().sub(A10), L10 = ab10.length(), dev = 0;
    for(var q10=0;q10<st10.pts.length;q10++){
      dev += st10.pts[q10].p.clone().sub(A10).cross(ab10).length()/L10;
    }
    return dev/st10.pts.length/P.MM;
  }
  var wavy0 = waviness(combSt);
  P.Strokes.setSelected(combSt, true); P.setTool('liquify');
  P.TOOL.liquify.mode = 'comb'; P.TOOL.liquify.size = 300; P.TOOL.liquify.strength = 100;
  for(var rub=0; rub<12; rub++) drag({x:CX-220,y:CY}, {x:CX+220,y:CY}, 20);
  var wavy1 = waviness(combSt);
  ck('comb straightens a wavy curve', wavy1 < wavy0*0.5,
     wavy0.toFixed(1) + 'mm of wobble -> ' + wavy1.toFixed(1) + 'mm');

  /* PINCH — "distorts sharply and precisely, as if pinching" */
  var pinchSt = straightCurve();
  P.Strokes.setSelected(pinchSt, true); P.setTool('liquify');
  P.TOOL.liquify.mode = 'pinch'; P.TOOL.liquify.size = 400; P.TOOL.liquify.strength = 100;
  var span0 = pinchSt.pts[pinchSt.pts.length-1].p.distanceTo(pinchSt.pts[0].p)/P.MM;
  for(var pq=0; pq<6; pq++) drag({x:CX,y:CY}, {x:CX+40,y:CY}, 10);
  var span1 = pinchSt.pts[pinchSt.pts.length-1].p.distanceTo(pinchSt.pts[0].p)/P.MM;
  ck('pinch gathers the curve toward the pen', span1 < span0 - 20,
     span0.toFixed(0) + 'mm across -> ' + span1.toFixed(0) + 'mm');

  /* it is aimed: liquify only touches what is selected */
  reset();
  P.TOOL.stableOn = false;
  P.VIEW.theta = 0; P.VIEW.phi = Math.PI/2; P.applyCamera();
  pen([{x:CX-200,y:CY-8},{x:CX,y:CY-8},{x:CX+200,y:CY-8}]);
  pen([{x:CX-200,y:CY+8},{x:CX,y:CY+8},{x:CX+200,y:CY+8}]);
  var keepSt = P.Strokes.list[1];
  var keepBefore = keepSt.pts.map(function(q){ return q.p.clone(); });
  P.Strokes.setSelected(P.Strokes.list[0], true);
  P.setTool('liquify');
  P.TOOL.liquify.mode = 'push'; P.TOOL.liquify.size = 300; P.TOOL.liquify.strength = 100;
  drag({x:CX,y:CY}, {x:CX,y:CY+70});
  var untouched = true;
  for(var kq=0;kq<keepSt.pts.length;kq++){
    if(keepSt.pts[kq].p.distanceTo(keepBefore[kq]) > 1e-9) untouched = false;
  }
  ck('a curve that is not selected is not liquified', untouched);

  /* the panel: modes, and the three numbers that drag */
  LD.getElementById('lqModes').querySelector('[data-lq="pinch"]').click();
  ck('tapping a mode selects it', P.TOOL.liquify.mode === 'pinch');
  P.UI.refresh();
  ck('...and the panel shows which one', LD.getElementById('lqModes')
       .querySelector('[data-lq="pinch"]').classList.contains('on'));
  var lqSizeWas = P.TOOL.liquify.size;
  dragReadout('lqSizeVal', 60);
  ck('size drags up and down like the brush numbers do',
     P.TOOL.liquify.size > lqSizeWas, lqSizeWas + ' -> ' + P.TOOL.liquify.size);
  var lqStrWas = P.TOOL.liquify.strength;
  dragReadout('lqStrengthVal', -40);
  ck('...so does strength', P.TOOL.liquify.strength < lqStrWas,
     lqStrWas + '% -> ' + P.TOOL.liquify.strength + '%');
  ck('strength cannot be dragged below 1%', (function(){
    dragReadout('lqStrengthVal', -900);
    return P.TOOL.liquify.strength >= 1;
  })(), P.TOOL.liquify.strength + '%');

  LD.getElementById('btnLqApply').click();
  ck('Apply leaves the curves where the pen put them', P.Strokes.list.length === 2);
  LD.getElementById('btnLqClose').click();
  ck('closing the panel leaves the tool', P.TOOL.mode !== 'liquify' &&
     LD.getElementById('liquifyPanel').classList.contains('hidden'));
  P.TOOL.liquify.mode = 'push'; P.TOOL.liquify.size = 120;
  P.TOOL.liquify.strength = 55; P.TOOL.liquify.range = 60;
  P.setTool('draw'); reset();

  /* ================= geometry export ================= */
  group('Geometry export — OBJ and STL');
  /* Verified against the CURVE, not against the writers: a round brush swept
     along a straight line is a 12-sided prism, so its exported solid has a
     volume that can be predicted from the polyline and the nib alone — and a
     signed volume is positive only if every facet faces outward, which is the
     one thing a slicer cannot recover for you. */
  var EXP = P.Export;
  var _l3 = new THREE.Line3(), _cp = new THREE.Vector3(), _pv = new THREE.Vector3();

  function mmPolyline(st){
    return st.pts.map(function(q){ return q.p.clone().multiplyScalar(1000); });
  }
  function distToPolyline(x, y, z, poly){
    _pv.set(x, y, z);
    var best = Infinity;
    for(var i=0;i+1<poly.length;i++){
      _l3.set(poly[i], poly[i+1]);
      _l3.closestPointToPoint(_pv, true, _cp);
      best = Math.min(best, _cp.distanceTo(_pv));
    }
    if(poly.length === 1) best = poly[0].distanceTo(_pv);
    return best;
  }
  /* signed volume of a triangle soup: positive iff the solid is closed and
     wound outward (divergence theorem on x -> x/3) */
  function soupVolume(attr){
    var v = 0;
    for(var i=0;i<attr.count;i+=3){
      var ax=attr.getX(i),   ay=attr.getY(i),   az=attr.getZ(i);
      var bx=attr.getX(i+1), by=attr.getY(i+1), bz=attr.getZ(i+1);
      var cx=attr.getX(i+2), cy=attr.getY(i+2), cz=attr.getZ(i+2);
      v += (ax*(by*cz - bz*cy) + ay*(bz*cx - bx*cz) + az*(bx*cy - by*cx)) / 6;
    }
    return v;
  }

  reset();
  P.TOOL.autoGuide = false; P.TOOL.pressureOn = false; P.TOOL.stableOn = false;
  P.TOOL.brush = 'pen'; P.TOOL.sizeMM = 20; P.TOOL.opacity = 1;
  P.TOOL.color.set('#c8323c');
  pen([{x:CX-160,y:CY},{x:CX-80,y:CY},{x:CX,y:CY},{x:CX+80,y:CY},{x:CX+160,y:CY}]);
  ck('a straight curve to export', P.Strokes.list.length === 1,
     P.Strokes.list[0].pts.length + ' points');

  var eParts = EXP.collect();
  var eStat  = EXP.stats(eParts);
  ck('one exported object per curve', eParts.length === P.Strokes.list.length,
     eParts.length + ' object(s), ' + eStat.triangles + ' triangles');
  ck('the tube is actually tessellated', eStat.triangles > 100);

  var eStroke = P.Strokes.list[0];
  var ePoly = mmPolyline(eStroke);
  var eRad = eStroke.baseRadius * 1000 * P.BRUSH[eStroke.brush].wide;
  var eLen = 0;
  for(var ei=1;ei<ePoly.length;ei++) eLen += ePoly[ei].distanceTo(ePoly[ei-1]);

  var offLo = Infinity, offHi = 0;
  for(ei=0;ei<eParts[0].pos.length;ei+=3){
    var dOff = distToPolyline(eParts[0].pos[ei], eParts[0].pos[ei+1], eParts[0].pos[ei+2], ePoly);
    offLo = Math.min(offLo, dOff); offHi = Math.max(offHi, dOff);
  }
  /* off by 1000x and this fails by three orders of magnitude, so it doubles as
     the units check: a 20mm nib exports as a 10mm-radius tube, not 0.01 */
  ck('every exported vertex sits on the nib radius, in millimetres',
     offHi <= eRad*1.02 && offHi >= eRad*0.9,
     'r ' + offLo.toFixed(2) + '–' + offHi.toFixed(2) + 'mm, nib ' + eRad.toFixed(2) + 'mm');

  var eStl = EXP.stlBuffer(eParts);
  ck('binary STL is exactly 84 + 50 bytes per triangle',
     eStl.byteLength === 84 + eStat.triangles*50, eStl.byteLength + ' bytes');
  ck('its header does not begin with "solid", or readers take it for ASCII',
     String.fromCharCode.apply(null, new Uint8Array(eStl, 0, 5)).toLowerCase() !== 'solid');

  var eBack = P.Import.parseSTL(eStl);
  ck('the app reads its own binary STL back',
     !!eBack && eBack.attributes.position.count === eStat.triangles*3);

  var eVol = soupVolume(eBack.attributes.position);
  /* a regular 12-gon of circumradius r has area 3r^2, and the caps are flat */
  var eWant = 3 * eRad*eRad * eLen;
  ck('the solid is wound outward, not inside out', eVol > 0,
     (eVol/1000).toFixed(1) + ' cm^3');
  ck('and its volume is the tube the curve describes',
     Math.abs(eVol/eWant - 1) < 0.05,
     'got ' + eVol.toFixed(0) + 'mm^3, predicted ' + eWant.toFixed(0));

  var eAscii = EXP.stlSource(eParts, {name:'plume-test'});
  ck('ASCII STL writes one facet per triangle',
     (eAscii.match(/facet normal/g) || []).length === eStat.triangles);
  var eAsciiGeom = P.Import.parseSTL(new W.TextEncoder().encode(eAscii).buffer);
  ck('the app reads its own ASCII STL back',
     !!eAsciiGeom && eAsciiGeom.attributes.position.count === eStat.triangles*3);

  var eObjSrc = EXP.objSource(eParts, {name:'plume-test'});
  ck('OBJ points at its material library', /^mtllib plume-test\.mtl$/m.test(eObjSrc.obj));
  ck('one object block per curve',
     (eObjSrc.obj.match(/^o /gm) || []).length === eParts.length);
  var eObjGeom = P.Import.parseOBJ(eObjSrc.obj);
  ck('the app reads its own OBJ back',
     !!eObjGeom && eObjGeom.attributes.position.count === eStat.triangles*3);
  /* two writers, written independently, describing one solid */
  var eObjVol = soupVolume(eObjGeom.attributes.position);
  ck('OBJ and STL describe the same solid',
     Math.abs(eObjVol - eVol) / Math.abs(eVol) < 1e-3,
     'delta ' + (100*Math.abs(eObjVol-eVol)/Math.abs(eVol)).toFixed(4) + '%');

  ck('vertex colours are off by default', !/^v (-?[\d.]+ ){3}[\d.]/m.test(eObjSrc.obj));
  var eVC = EXP.objSource(eParts, {name:'plume-test', vertexColors:true});
  ck('...and add rgb to the v lines when asked', /^v (-?[\d.]+ ){5}[\d.]+$/m.test(eVC.obj));
  ck('...without breaking the app\'s own reader',
     P.Import.parseOBJ(eVC.obj).attributes.position.count === eStat.triangles*3);

  /* colour and opacity travel in the .mtl */
  P.TOOL.color.set('#3264c8'); P.TOOL.opacity = 0.5; P.TOOL.brush = 'rectangle';
  pen([{x:CX-140,y:CY+90},{x:CX,y:CY+120},{x:CX+140,y:CY+80}]);
  var eParts2 = EXP.collect();
  var eSrc2 = EXP.objSource(eParts2, {name:'plume-test'});
  ck('a second curve exports as a second object', eParts2.length === 2);
  ck('one material per distinct colour',
     (eSrc2.mtl.match(/^newmtl /gm) || []).length === 2,
     (eSrc2.mtl.match(/^newmtl /gm) || []).join(' ').trim());
  var eKd = /^newmtl plume_c8323c$[\s\S]*?^Kd ([\d.]+) ([\d.]+) ([\d.]+)$/m.exec(eSrc2.mtl);
  ck('the material carries the curve colour', !!eKd &&
     Math.abs(parseFloat(eKd[1]) - 200/255) < 1e-3 &&
     Math.abs(parseFloat(eKd[2]) - 50/255) < 1e-3 &&
     Math.abs(parseFloat(eKd[3]) - 60/255) < 1e-3,
     eKd ? eKd.slice(1).join(', ') : 'no Kd');
  ck('opacity travels as the material dissolve', /^newmtl plume_3264c8_a50$/m.test(eSrc2.mtl) &&
     /^d 0\.5$/m.test(eSrc2.mtl));
  ck('each object references its own material',
     (eSrc2.obj.match(/^usemtl /gm) || []).length === 2);

  /* selection, guides, and the empty case */
  P.Strokes.setSelected(P.Strokes.list[1], true);
  ck('a selection exports on its own',
     EXP.collect({selectionOnly:true}).length === 1);
  P.Strokes.clearSelection();

  var eZ = EXP.collect({zUp:true})[0];
  ck('zUp rolls Y-up over to Z-up for printing',
     Math.abs(eZ.pos[1] + eParts[0].pos[2]) < 1e-3 &&
     Math.abs(eZ.pos[2] - eParts[0].pos[1]) < 1e-3);

  reset();
  P.TOOL.autoGuide = true;
  pen(circle(CX, CY, 60));
  ck('a guide is not geometry, so it is left out', EXP.collect().length === 0);
  ck('...but can be asked for', EXP.collect({guides:true}).length === 1);

  /* Duplicate points are a hole in an exported solid: two rings land on top of
     one another, every triangle between them has zero area, and the writer
     drops degenerate faces — so the tube opens up where nothing looked wrong
     on screen. A guide that clamps off-edge samples is the way they get made. */
  reset();
  P.TOOL.stableOn = false;
  P.Guides.setActive(P.Guides.primitive('sphere', 32, 1));
  P.TOOL.brush = 'cube'; P.TOOL.sizeMM = 30; P.TOOL.pressureOn = true;
  pen([{x:CX-300,y:CY-40},{x:CX-100,y:CY},{x:CX+100,y:CY+30},{x:CX+300,y:CY-20}]);
  var dupWorst = Infinity, dupCount = 0;
  for(var dq=0; dq<P.Strokes.list.length; dq++){
    var dst = P.Strokes.list[dq];
    for(var dp=1; dp<dst.pts.length; dp++){
      var gap = dst.pts[dp].p.distanceTo(dst.pts[dp-1].p);
      if(gap < 1e-5) dupCount++;
      dupWorst = Math.min(dupWorst, gap);
    }
  }
  ck('a committed curve never holds the same point twice', dupCount === 0,
     'closest pair ' + (dupWorst*1e6).toFixed(1) + ' micrometres apart');
  ck('...so nothing degenerate reaches the exporter', (function(){
    var parts11 = P.Export.collect();
    for(var q11=0; q11<parts11.length; q11++){
      var raw = parts11[q11].stroke.mesh.geometry.index.count/3;
      if(parts11[q11].tris.length/3 !== raw) return false;
    }
    return parts11.length > 0;
  })());
  P.TOOL.brush = 'pen'; P.TOOL.sizeMM = 14;
  reset();

  /* Every brush, not just the round one: a solid is only printable if each
     directed edge appears exactly once — i.e. the surface is closed AND every
     face agrees with its neighbours. This is the check that caught the tube
     walls being wound inside out, which nothing on screen made obvious. */
  function partVolume(part){
    var v = 0, pos = part.pos, tris = part.tris;
    for(var i=0;i<tris.length;i+=3){
      var a=tris[i]*3, b=tris[i+1]*3, c=tris[i+2]*3;
      v += (pos[a]  *(pos[b+1]*pos[c+2] - pos[b+2]*pos[c+1]) +
            pos[a+1]*(pos[b+2]*pos[c]   - pos[b]  *pos[c+2]) +
            pos[a+2]*(pos[b]  *pos[c+1] - pos[b+1]*pos[c])) / 6;
    }
    return v;
  }
  function openEdges(part){
    var seen = {}, tris = part.tris, i, k;
    for(i=0;i<tris.length;i+=3){
      var t = [tris[i], tris[i+1], tris[i+2]];
      for(k=0;k<3;k++){
        var key = t[k] + '>' + t[(k+1)%3];
        seen[key] = (seen[key] || 0) + 1;
      }
    }
    var bad = 0;
    for(k in seen){
      if(seen[k] !== 1) bad++;                       // two faces the same way round
      var back = k.split('>');
      if(!seen[back[1] + '>' + back[0]]) bad++;      // nothing on the other side
    }
    return bad;
  }

  reset();
  P.TOOL.autoGuide = false; P.TOOL.stableOn = false; P.TOOL.pressureOn = true;
  var eBrushes = Object.keys(P.BRUSH), eNotClosed = [], eInsideOut = [], eTri = 0;
  for(var ebi=0;ebi<eBrushes.length;ebi++){
    P.Strokes.clear(); P.History.clear();
    P.TOOL.brush = eBrushes[ebi]; P.TOOL.sizeMM = 6 + ebi*5;
    pen([{x:CX-170,y:CY-40},{x:CX-40,y:CY+30},{x:CX+70,y:CY-30},{x:CX+180,y:CY+40}]);
    var ePart = EXP.collect()[0];
    if(!ePart){ eNotClosed.push(eBrushes[ebi] + '(nothing)'); continue; }
    eTri += ePart.tris.length/3;
    if(openEdges(ePart)) eNotClosed.push(eBrushes[ebi] + '(' + openEdges(ePart) + ')');
    if(partVolume(ePart) <= 0) eInsideOut.push(eBrushes[ebi]);
  }
  ck('every brush exports a closed surface, with no edge left open',
     eNotClosed.length === 0, eNotClosed.join(' ') || eBrushes.length + ' brushes, ' + eTri + ' triangles');
  ck('...and every one of them is wound outward, not inside out',
     eInsideOut.length === 0, eInsideOut.join(' ') || 'all positive volume');

  reset();
  ck('an empty sketch exports nothing rather than a broken file',
     EXP.collect().length === 0 && EXP.download('obj') === null);

  /* the buttons, without actually writing files to the machine */
  var eSaved = [], eRealSave = EXP.saveBlob;
  EXP.saveBlob = function(blob, filename){ eSaved.push({name:filename, size:blob.size}); };
  try {
    P.TOOL.autoGuide = false;
    pen([{x:CX-120,y:CY},{x:CX,y:CY+40},{x:CX+120,y:CY}]);
    W.document.getElementById('btnOBJ').click();
    ck('the OBJ button writes an .obj and its .mtl',
       eSaved.length === 2 && /^plume-\d+\.obj$/.test(eSaved[0].name) &&
       /^plume-\d+\.mtl$/.test(eSaved[1].name),
       eSaved.map(function(f){ return f.name; }).join(' + '));
    eSaved.length = 0;
    W.document.getElementById('btnSTL').click();
    var eTri = EXP.stats(EXP.collect()).triangles;
    ck('the STL button writes one binary .stl',
       eSaved.length === 1 && /^plume-\d+\.stl$/.test(eSaved[0].name) &&
       eSaved[0].size === 84 + eTri*50,
       eSaved.length ? eSaved[0].name + ', ' + eSaved[0].size + ' bytes' : 'nothing written');
  } finally {
    EXP.saveBlob = eRealSave;
  }
  P.TOOL.pressureOn = true; P.TOOL.opacity = 1; P.TOOL.brush = 'pen';

  /* ================= compact / responsive ================= */
  group('Responsive layout');
  /* NB: the panels live in the iframe, so query W.document, not ours */
  var D = W.document;
  ck('the sheet panels exist', !!D.getElementById('brush') && !!D.getElementById('tools'));
  P.UI.openSheet('brush');
  ck('opening a sheet marks it open', D.getElementById('brush').classList.contains('open'));
  P.UI.openSheet('tools');
  ck('opening another closes the first',
     !D.getElementById('brush').classList.contains('open') &&
     D.getElementById('tools').classList.contains('open'));
  ck('back closes the open sheet', P.UI.closeTopSheet() === true);
  ck('and reports nothing left to close', P.UI.closeTopSheet() === false);
  ck('the dock exists for the compact layout', !!D.getElementById('dock'));
  ck('back also unwinds selection and history', typeof P.onBack === 'function');

  /* Force the compact layout and measure it for real. Transitions are pinned
     off first: these are layout assertions, and racing a 200ms slide makes
     them flaky (and never resolves at all in a tab that is not compositing). */
  (function compactLayout(){
    var kill = D.createElement('style');
    kill.textContent = '*{transition:none !important;animation:none !important}';
    D.head.appendChild(kill);

    /* the compact rules are gated on the body class, not a media query, so
       they can be exercised at any viewport width */
    var wasCompact = P.UI.compact;
    D.body.classList.add('compact');
    P.UI.compact = true;
    var sheetIds = ['tools','brush','joy','stagePanel'];
    for(var s=0;s<sheetIds.length;s++){
      D.getElementById(sheetIds[s]).classList.remove('open','hidden');
    }

    function rect(id){ return D.getElementById(id).getBoundingClientRect(); }
    var vh = W.document.documentElement.clientHeight;
    var vw = W.document.documentElement.clientWidth;

    var parked = [], ids = sheetIds;
    for(var i=0;i<ids.length;i++) if(rect(ids[i]).top < vh-1) parked.push(ids[i]);
    ck('closed sheets park off-screen', parked.length === 0, parked.join(',') || 'all clear');

    P.UI.openSheet('brush');
    var b = rect('brush');
    ck('an open sheet is on-screen and clears the dock',
       b.top < vh-80 && b.bottom <= vh-30, 'top=' + b.top.toFixed(0));
    ck('an open sheet is height-capped', b.height <= vh*0.58, 'h=' + b.height.toFixed(0));

    P.UI.openSheet('tools');
    ck('opening one sheet parks the other', rect('brush').top >= vh-1);
    /* only the VISIBLE buttons have a touch target — each toggle pair keeps
       its partner in the DOM but hidden behind a repeat tap */
    var tb = Array.from(D.getElementById('tools').querySelectorAll('button[data-tool]'))
               .filter(function(b){ return b.getBoundingClientRect().width > 0; });
    var small = 0;
    for(i=0;i<tb.length;i++){
      var rr = tb[i].getBoundingClientRect();
      if(rr.height < 44 || rr.width < 44) small++;
    }
    ck('compact tool buttons meet a 44px target', small === 0 && tb.length > 0,
       tb.length + ' visible buttons');
    /* The rule, rather than a count: a toggle pair shows ONE of its two
       buttons and keeps the other in the DOM behind a repeat tap. Stated as a
       magic number this needed editing every time a tool was added, which is
       how it came to assert a stale 4. */
    var hidden17 = Array.from(D.getElementById('tools')
                     .querySelectorAll('button[data-tool].alt'))
                     .filter(function(b){ return b.getBoundingClientRect().width > 0; });
    var expect17 = D.getElementById('tools')
                     .querySelectorAll('button[data-tool]:not(.alt)').length;
    ck('toggle pairs stay merged when compact',
       tb.length === expect17 && hidden17.length === 0,
       tb.map(function(b){ return b.dataset.tool; }).join(',') +
       ' visible, ' + hidden17.length + ' partners showing');

    var dk = rect('dock');
    ck('dock is pinned to the bottom', Math.abs(dk.bottom - vh) < 2);
    ck('context bar clears the dock', rect('ctx').bottom <= dk.top + 1);
    ck('no horizontal overflow when compact',
       W.document.documentElement.scrollWidth <= vw + 1);

    P.UI.closeTopSheet();
    kill.remove();
    D.body.classList.toggle('compact', wasCompact);
    P.UI.compact = wasCompact;
    P.UI.applyMode();
  })();

  /* ================= finger-first gestures ================= */
  group('Finger-first input');
  var savedFinger = P.Input.fingerPen;

  navReset();
  P.Input.fingerPen = true;
  P.TOOL.autoGuide = false;
  P.setTool('draw');
  P.Strokes.clear(); P.History.clear();
  /* one finger draws when finger-pen is on */
  touch('pointerdown', 61, CX-60, CY);
  touch('pointermove', 61, CX,    CY);
  touch('pointermove', 61, CX+60, CY);
  touch('pointerup',   61, CX+60, CY, 0);
  ck('one finger draws a curve in finger mode', P.Strokes.list.length === 1,
     'n=' + P.Strokes.list.length);

  /* two fingers orbit rather than pan */
  navReset(); P.Input.fingerPen = true; P.VIEW.pinned = true;
  var th2 = P.VIEW.theta, piv2 = P.VIEW.pivot.clone();
  touch('pointerdown', 71, CX-50, CY); touch('pointerdown', 72, CX+50, CY);
  touch('pointermove', 71, CX-50+70, CY); touch('pointermove', 72, CX+50+70, CY);
  touch('pointerup', 71, CX+20, CY, 0); touch('pointerup', 72, CX+120, CY, 0);
  ck('two fingers orbit in finger mode', Math.abs(P.VIEW.theta - th2) > 1e-6);
  ck('and do not pan', P.VIEW.pivot.distanceTo(piv2) < 1e-9);
  P.killSpin();

  /* three fingers pan */
  navReset(); P.Input.fingerPen = true;
  var piv3 = P.VIEW.pivot.clone();
  touch('pointerdown', 81, CX-60, CY); touch('pointerdown', 82, CX, CY);
  touch('pointerdown', 83, CX+60, CY);
  touch('pointermove', 81, CX-60, CY-70); touch('pointermove', 82, CX, CY-70);
  touch('pointermove', 83, CX+60, CY-70);
  touch('pointerup', 81, CX-60, CY-70, 0); touch('pointerup', 82, CX, CY-70, 0);
  touch('pointerup', 83, CX+60, CY-70, 0);
  ck('three fingers pan in finger mode', P.VIEW.pivot.distanceTo(piv3) > 1e-6);

  /* a second finger mid-stroke abandons the stroke and starts navigating */
  navReset(); P.Input.fingerPen = true; P.VIEW.pinned = true;
  P.Strokes.clear(); P.History.clear();
  P.setTool('draw'); P.TOOL.autoGuide = false;
  touch('pointerdown', 91, CX-40, CY);
  touch('pointermove', 91, CX,    CY);
  var th4 = P.VIEW.theta;
  touch('pointerdown', 92, CX+80, CY);          // second finger lands
  ck('a second finger cancels the stroke in progress', P.Strokes.list.length === 0);
  touch('pointermove', 91, CX+40, CY);
  touch('pointermove', 92, CX+160, CY);
  ck('and both fingers then drive navigation', Math.abs(P.VIEW.theta - th4) > 1e-6);
  touch('pointerup', 91, CX+40, CY, 0); touch('pointerup', 92, CX+160, CY, 0);
  P.killSpin();

  P.Input.fingerPen = savedFinger;

  /* ================= panel layout / the menu collision ================= */
  group('Layout — panels must not sit on top of each other');
  var DD = W.document;
  function rct(id){ return DD.getElementById(id).getBoundingClientRect(); }
  function shown(id){ return !DD.getElementById(id).classList.contains('hidden'); }
  function zi(id){ return parseInt(W.getComputedStyle(DD.getElementById(id)).zIndex,10) || 0; }
  function boxesOverlap(a,b){
    return !(a.right<=b.left || b.right<=a.left || a.bottom<=b.top || b.bottom<=a.top);
  }
  function scan(ids){
    var clash = [];
    for(var i=0;i<ids.length;i++) for(var j=i+1;j<ids.length;j++){
      if(!shown(ids[i]) || !shown(ids[j])) continue;
      if(boxesOverlap(rct(ids[i]), rct(ids[j]))) clash.push(ids[i]+'/'+ids[j]);
    }
    return clash;
  }

  reset();
  P.UI.applyMode();
  var base = ['topleft','viewInfo','tools','brush','ctx'];
  ck('no panels overlap at rest', scan(base).length === 0, scan(base).join(', ') || 'clean');

  /* the reported bug: the settings menu used to sit exactly on the brush rail */
  P.UI.setMenu(true);
  var mm = rct('sysMenu'), bb = rct('brush');
  ck('settings menu opens', shown('sysMenu'));
  ck('menu no longer shares the brush rail origin',
     !(Math.abs(mm.left-bb.left) < 2 && Math.abs(mm.top-bb.top) < 2),
     'menu@'+mm.left.toFixed(0)+','+mm.top.toFixed(0)+' brush@'+bb.left.toFixed(0)+','+bb.top.toFixed(0));
  ck('menu stacks above the rails', zi('sysMenu') > zi('brush'),
     'z '+zi('sysMenu')+' vs '+zi('brush'));
  ck('a scrim sits between them', shown('scrim') &&
     zi('scrim') < zi('sysMenu') && zi('scrim') > zi('brush'));
  ck('menu controls are laid out, not collapsed',
     rct('optFinger').width > 10 && rct('focal').width > 10);
  P.UI.setMenu(false);
  ck('menu closes again', !shown('sysMenu') && !shown('scrim'));

  DD.getElementById('btnStage').click();
  ck('stage panel clears the tool rail', scan(base.concat(['stagePanel'])).length === 0,
     scan(base.concat(['stagePanel'])).join(', ') || 'clean');

  /* The Scene tab grew from two rows to a dozen. Every control in it has to
     stay reachable, and the background swatch in particular has to keep an
     edge you can see even when it holds the panel's own colour — with no ring
     it reads as an empty label and the setting looks like it was removed. */
  (function sceneTab(){
    /* the compact-layout block above unhides every sheet, so btnStage's toggle
       parity cannot be relied on — put the panel in a known state first */
    DD.getElementById('stagePanel').classList.remove('hidden');
    P.UI.refresh();
    var tab = DD.querySelector('#stageTabs [data-tab="env"]');
    tab.click();
    var sp = DD.getElementById('stagePanel');
    ck('Scene tab shows the background colour picker',
       !DD.getElementById('bodyEnv').classList.contains('hidden') &&
       DD.getElementById('bgPick').getBoundingClientRect().width > 10);

    var spb = sp.getBoundingClientRect(), spill = [];
    var kids = DD.querySelectorAll('#bodyEnv button, #bodyEnv input, #bodyEnv .val');
    for(var q=0;q<kids.length;q++){
      var kb = kids[q].getBoundingClientRect();
      if(kb.width > 0 && (kb.right > spb.right + 0.5 || kb.left < spb.left - 0.5))
        spill.push(kids[q].id || kids[q].textContent.trim());
    }
    ck('no Scene control spills past the panel edge', spill.length === 0,
       spill.join(', ') || 'clean');
    ck('the Scene panel needs no sideways scroll', sp.scrollWidth <= sp.clientWidth,
       sp.scrollWidth + ' <= ' + sp.clientWidth);

    /* the ring is on the input, not on ::-webkit-color-swatch: the input's own
       overflow:hidden would clip a shadow drawn inside it */
    var ring = W.getComputedStyle(DD.getElementById('bgPick')).boxShadow;
    ck('the background swatch carries its own ring', /\d/.test(ring) && ring !== 'none',
       ring.slice(0, 46));

    /* and it is wired to the scene, not just present */
    var was = P.ENV.bg.getHexString();
    var pick = DD.getElementById('bgPick');
    pick.value = '#3366cc';
    pick.dispatchEvent(new W.Event('input', { bubbles: true }));
    ck('editing it repaints the background', P.ENV.bg.getHexString() === '3366cc',
       '#' + P.ENV.bg.getHexString());
    pick.value = '#' + was;
    pick.dispatchEvent(new W.Event('input', { bubbles: true }));

    DD.querySelector('#stageTabs [data-tab="group"]').click();
  })();

  DD.getElementById('btnStage').click();

  ck('joystick is hidden while nothing is selected', !shown('joy'));
  reset();
  pen([{x:CX-60,y:CY},{x:CX,y:CY},{x:CX+60,y:CY}]);
  P.Strokes.setSelected(P.Strokes.list[0], true);
  P.onSceneChange();
  ck('joystick appears when there is something to move', shown('joy'));
  ck('and still does not overlap anything', scan(base.concat(['joy'])).length === 0,
     scan(base.concat(['joy'])).join(', ') || 'clean');
  /* liquify always runs with a selection, so it shares the screen with the
     joystick and the selection bar every single time it is open */
  P.setTool('liquify'); P.UI.refresh();
  var lqScan = base.concat(['joy','selBar','liquifyPanel']);
  ck('the liquify strip clears everything else on screen',
     scan(lqScan).length === 0, scan(lqScan).join(', ') || 'clean');
  ck('...taking the selection bar\u2019s place rather than fighting it for it',
     !shown('selBar') && shown('liquifyPanel'));
  P.setTool('select'); P.UI.refresh();
  P.Strokes.clearSelection(); P.onSceneChange();
  ck('joystick hides again', !shown('joy'));

  /* ---- the axis handles stay where you left them ----
     They used to be drawn wherever each world axis happened to project to, so
     the handle you were reaching for slid out from under your thumb every time
     you orbited, and two axes could crowd into one place while the third had a
     third of the ring to itself. */
  reset();
  P.TOOL.stableOn = false; P.TOOL.pressureOn = false;
  pen([{x:CX-80,y:CY},{x:CX,y:CY},{x:CX+80,y:CY}]);
  var joySt = P.Strokes.list[0];
  P.Strokes.setSelected(joySt, true);
  P.setTool('select'); P.UI.refresh();

  function labAt(k21){
    var el21 = D.getElementById('lab' + k21);
    return { x:+el21.getAttribute('x'), y:+el21.getAttribute('y') };
  }
  function allLabs(){ return { X:labAt('X'), Y:labAt('Y'), Z:labAt('Z') }; }
  function lookFrom(th21, ph21){
    P.VIEW.theta = th21; P.VIEW.phi = ph21; P.applyCamera(); P.UI.layoutJoystick();
    return allLabs();
  }
  var view1 = lookFrom(0, 1.1), view2 = lookFrom(1.9, 0.5), view3 = lookFrom(-2.6, 2.2);
  function sameSpot(a21, b21){
    return ['X','Y','Z'].every(function(k21){
      return Math.abs(a21[k21].x - b21[k21].x) < 0.01 &&
             Math.abs(a21[k21].y - b21[k21].y) < 0.01;
    });
  }
  ck('the joystick axis handles do not move when the camera orbits',
     sameSpot(view1, view2) && sameSpot(view1, view3),
     'X at ' + view1.X.x + ',' + view1.X.y + ' from every angle');

  var C21 = 54;
  var angs21 = ['X','Y','Z'].map(function(k21){
    return Math.atan2(view1[k21].y - C21, view1[k21].x - C21) * 180/Math.PI;
  }).sort(function(m21, n21){ return m21 - n21; });
  var gaps21 = [angs21[1]-angs21[0], angs21[2]-angs21[1],
                360 - (angs21[2]-angs21[0])];
  ck('...and sit a third of the ring apart',
     gaps21.every(function(g21){ return Math.abs(g21 - 120) < 0.5; }),
     gaps21.map(function(g21){ return g21.toFixed(0); }).join(' / ') + ' degrees');

  /* ONLY THE PLACEMENT IS FIXED. Dragging an axis still has to move along that
     world axis, using its real screen direction — which is exactly what fixing
     the arcs could have broken. */
  (function(){
    P.VIEW.theta = 0.8; P.VIEW.phi = 1.0; P.applyCamera(); P.UI.layoutJoystick();
    var before21 = joySt.pts[0].p.clone();
    var pad = D.getElementById('joyPad'), r21 = pad.getBoundingClientRect();
    /* press on the X arc: a third of the ring right and down from centre */
    var px = r21.left + r21.width  * (54 + Math.cos(Math.PI/6)*43) / 108;
    var py = r21.top  + r21.height * (54 + Math.sin(Math.PI/6)*43) / 108;
    function padEv(t21, x21, y21, b21){
      pad.dispatchEvent(new W.PointerEvent(t21, {pointerId:77, pointerType:'touch',
        clientX:x21, clientY:y21, buttons:b21, bubbles:true, cancelable:true}));
    }
    padEv('pointerdown', px, py, 1);
    padEv('pointermove', px + 40, py + 24, 1);
    padEv('pointerup',   px + 40, py + 24, 0);
    var moved = joySt.pts[0].p.clone().sub(before21);
    ck('...while dragging one still moves along that world axis',
       moved.length() > 1e-6 &&
       Math.abs(moved.x) > 20 * Math.max(Math.abs(moved.y), Math.abs(moved.z)),
       'moved (' + moved.x.toFixed(3) + ', ' + moved.y.toFixed(3) + ', ' +
       moved.z.toFixed(3) + ')');
  })();
  reset();

  /* ---- the rail shows the brush you are holding ---- */
  var railBtn = D.getElementById('brushType');
  var brushMarks = {}, allMatch = true;
  Object.keys(P.BRUSH).forEach(function(bn21){
    P.TOOL.brush = bn21; P.UI.refresh();
    var gridBtn = D.querySelector('#brushGrid button[data-brush="' + bn21 + '"]');
    if(!gridBtn || railBtn.innerHTML !== gridBtn.innerHTML) allMatch = false;
    brushMarks[railBtn.innerHTML] = 1;
  });
  ck('the brush button wears the icon of the brush in hand',
     allMatch, allMatch ? 'all ' + Object.keys(P.BRUSH).length + ' match their grid icon'
                        : 'a brush showed the wrong mark');
  ck('...and every brush has its own mark, not a shared one',
     Object.keys(brushMarks).length === Object.keys(P.BRUSH).length,
     Object.keys(brushMarks).length + ' distinct icons for ' +
     Object.keys(P.BRUSH).length + ' brushes');
  P.TOOL.brush = 'pen'; P.UI.refresh();

  /* ================= lighting ================= */
  group('Lighting — one key light you can aim, colour and dim');

  function litStroke(){
    reset();
    P.TOOL.stableOn = false; P.TOOL.pressureOn = false;
    P.VIEW.pinned = true; P.VIEW.theta = 0.4; P.VIEW.phi = 1.1; P.applyCamera();
    P.TOOL.autoGuide = false; P.TOOL.brush = 'pen'; P.TOOL.sizeMM = 90;
    P.TOOL.color.set('#c8c8c8'); P.TOOL.opacity = 1;
    P.refreshDrawPlane();
    pen([{x:CX-160,y:CY},{x:CX,y:CY},{x:CX+160,y:CY}]);
    return P.Strokes.list[0];
  }
  /* ACROSS the tube: a horizontal stroke's normals barely change along its
     length, so a lengthwise scan cannot see the shading fall off at all */
  function acrossTube(){
    P.renderer.render(P.scene, P.cam());
    var gl = P.renderer.getContext(), dpr = P.renderer.getPixelRatio();
    var vpL = P.viewport(), buf26 = new W.Uint8Array(4*200);
    gl.readPixels(Math.round(CX*dpr), Math.round((vpL.h - CY - 100)*dpr), 1, 200,
                  gl.RGBA, gl.UNSIGNED_BYTE, buf26);
    var seen26 = {}, n26 = 0, sum26 = 0;
    for(var q26=0;q26<200;q26++){
      var r26 = buf26[q26*4], g26 = buf26[q26*4+1], b26 = buf26[q26*4+2];
      if(Math.abs(r26-g26) < 12 && Math.abs(g26-b26) < 12 && r26 < 215){
        seen26[r26] = 1; n26++; sum26 += r26;
      }
    }
    return { px:n26, levels:Object.keys(seen26).length, mean:sum26/(n26||1) };
  }

  var litSt = litStroke();
  ck('every stroke shares the one light rather than carrying a copy',
     litSt.mesh.material.uniforms.uLightDir === P.LIGHT_UNIFORMS.uLightDir &&
     litSt.mesh.material.uniforms.uAmbient === P.LIGHT_UNIFORMS.uAmbient,
     'uniform objects are shared, so aiming the light is one assignment');

  /* the defaults have to reproduce the light that used to be hardcoded, or
     every sketch already drawn would shift the day this landed */
  var dir26 = P.LIGHT_UNIFORMS.uLightDir.value;
  ck('the default light is the one the shader used to hold hardcoded',
     Math.abs(dir26.x - 0.319) < 0.002 && Math.abs(dir26.y - 0.618) < 0.002 &&
     Math.abs(dir26.z - 0.718) < 0.002 && Math.abs(P.LIGHT.ambient - 0.66) < 1e-9,
     '(' + dir26.x.toFixed(3) + ', ' + dir26.y.toFixed(3) + ', ' +
     dir26.z.toFixed(3) + ') at ambient ' + P.LIGHT.ambient);

  var base26 = acrossTube();
  ck('a stroke is shaded across its width, not flat',
     base26.px > 10 && base26.levels > 8,
     base26.levels + ' shades over ' + base26.px + ' pixels');

  P.LIGHT.az = -2.0; P.applyLight();
  var moved26 = acrossTube();
  ck('aiming the light somewhere else changes the shading',
     Math.abs(moved26.mean - base26.mean) > 8,
     'mean ' + base26.mean.toFixed(1) + ' -> ' + moved26.mean.toFixed(1));
  P.LIGHT.az = 0.4185; P.applyLight();

  P.LIGHT.ambient = 0.05; P.applyLight();
  var dark26 = acrossTube();
  ck('dropping the ambient darkens the unlit side',
     dark26.mean < base26.mean - 8,
     'mean ' + base26.mean.toFixed(1) + ' -> ' + dark26.mean.toFixed(1));
  P.LIGHT.ambient = 0.66; P.applyLight();

  P.LIGHT.color.set('#ff4020'); P.applyLight();
  var warm26 = (function(){
    P.renderer.render(P.scene, P.cam());
    var gl = P.renderer.getContext(), dpr = P.renderer.getPixelRatio();
    var vpW = P.viewport(), bw = new W.Uint8Array(4*400), warm = 0;
    gl.readPixels(Math.round((CX-200)*dpr), Math.round((vpW.h - CY)*dpr), 400, 1,
                  gl.RGBA, gl.UNSIGNED_BYTE, bw);
    for(var q=0;q<400;q++) if(bw[q*4] > bw[q*4+2] + 25) warm++;
    return warm;
  })();
  ck('a coloured light tints what it falls on', warm26 > 100,
     warm26 + ' pixels went warm under a red light');
  P.LIGHT.color.set('#ffffff'); P.applyLight();

  /* TOON bands the same term rather than replacing it */
  var smooth26 = acrossTube().levels;
  P.LIGHT.toon = true; P.LIGHT.toonSteps = 4; P.applyLight();
  var toon26 = acrossTube().levels;
  ck('toon shading bands the gradient into steps',
     toon26 < smooth26 / 3 && toon26 >= 2,
     smooth26 + ' shades became ' + toon26);
  P.LIGHT.toon = false; P.applyLight();

  /* the pad aims it, and the light belongs to the sketch */
  var padEl = D.getElementById('lightPad');
  ck('the environment panel carries a light pad and its readouts',
     !!padEl && !!D.getElementById('lightIntVal') &&
     !!D.getElementById('lightAmbVal') && !!D.getElementById('lightPick'));

  P.LIGHT.az = -1.1; P.LIGHT.alt = 0.3; P.LIGHT.intensity = 1.7;
  P.LIGHT.color.set('#88ccff'); P.LIGHT.toon = true; P.applyLight();
  var lightJson = JSON.stringify(P.Doc.serialize());
  P.LIGHT.az = 0; P.LIGHT.alt = 1; P.LIGHT.intensity = 1;
  P.LIGHT.color.set('#ffffff'); P.LIGHT.toon = false; P.applyLight();
  P.Doc.clear();
  P.Doc.restore(JSON.parse(lightJson));
  ck('the light is saved with the sketch and comes back with it',
     Math.abs(P.LIGHT.az + 1.1) < 1e-3 && Math.abs(P.LIGHT.alt - 0.3) < 1e-3 &&
     Math.abs(P.LIGHT.intensity - 1.7) < 1e-3 &&
     P.LIGHT.color.getHexString() === '88ccff' && P.LIGHT.toon === true,
     'az ' + P.LIGHT.az.toFixed(2) + ', #' + P.LIGHT.color.getHexString() +
     ', toon ' + P.LIGHT.toon);
  P.LIGHT.toon = false; P.LIGHT.az = 0.4185; P.LIGHT.alt = 0.6664;
  P.LIGHT.intensity = 1; P.LIGHT.ambient = 0.66;
  P.LIGHT.color.set('#ffffff'); P.applyLight();
  reset();

  /* ================= post-processing ================= */
  group('Post — depth of field, grain, pixelation');

  /* Tools.begin resets the draw plane to the pivot when no guide is active,
     so you cannot ask to draw AT a depth. Draw them together, then push them
     apart along the view, which is the only way this scene has real depth in
     it - and the reason a first pass at this check found DOF doing nothing. */
  function threeDepths(){
    reset();
    P.TOOL.stableOn = false; P.TOOL.pressureOn = false; P.TOOL.autoGuide = false;
    P.VIEW.pinned = true; P.VIEW.pivot.set(0,0,0);
    P.VIEW.theta = 0.35; P.VIEW.phi = 1.2; P.VIEW.radius = 3.0; P.applyCamera();
    P.TOOL.brush = 'pen'; P.TOOL.sizeMM = 55; P.TOOL.opacity = 1;
    var cols28 = ['#d9534f','#4a90d9','#e8c34a'], k28, i28;
    for(k28=0;k28<3;k28++){
      P.TOOL.color.set(cols28[k28]);
      var c28 = [];
      for(i28=0;i28<=14;i28++){
        var t28 = i28/14*Math.PI*2;
        c28.push({x:CX-150+k28*150+Math.cos(t28)*48, y:CY-40+Math.sin(t28)*48});
      }
      pen(c28);
    }
    var fwd28 = P.cam().getWorldDirection(new THREE.Vector3());
    [-1.1, 0, 1.1].forEach(function(dz28, j28){
      var st28 = P.Strokes.list[j28];
      if(!st28 || !dz28) return;
      for(var q28=0;q28<st28.pts.length;q28++) st28.pts[q28].p.addScaledVector(fwd28, dz28);
      P.Strokes.freezeFrames(st28); P.Strokes.rebuild(st28);
    });
    P.Guides.setActive(null);
    P.ENV.render = true;
    P.FX.dofOn = false; P.FX.grainOn = false; P.FX.pixelOn = false;
  }
  /* how much a block of the image differs between two renders */
  function frameDiff(setup28){
    function grab(){
      if(!P.renderWithFX(P.scene, P.cam())) P.renderer.render(P.scene, P.cam());
      var gl = P.renderer.getContext(), dpr = P.renderer.getPixelRatio();
      var vpF = P.viewport();
      var w28 = Math.round(300*dpr), h28 = Math.round(200*dpr);
      var b28 = new W.Uint8Array(4*w28*h28);
      gl.readPixels(Math.round((CX-260)*dpr), Math.round((vpF.h - CY - 60)*dpr),
                    w28, h28, gl.RGBA, gl.UNSIGNED_BYTE, b28);
      return b28;
    }
    var before28 = grab();
    setup28();
    var after28 = grab();
    var diff = 0;
    for(var q=0;q<before28.length;q+=4){
      if(Math.abs(before28[q] - after28[q]) > 6) diff++;
    }
    return diff / (before28.length/4);
  }

  threeDepths();
  ck('depth of field blurs what is not at the orbit point',
     frameDiff(function(){ P.FX.dofOn = true; P.FX.fstop = 1.8; }) > 0.04,
     'rings sit at 1.9, 3.0 and 4.1 from a camera focused at 3.0');

  /* THE SHARP ONE MUST STAY SHARP - a blur that ate the whole image would pass
     the check above just as well. Sharpness measured as LOCAL CONTRAST: a
     crisp edge steps between ink and ground in a pixel or two, a defocused one
     ramps across a dozen. Trying to classify each pixel as ink or ground
     instead put 9 soft pixels on the sharp ring and 7 on the blurred one -
     three ink colours, their shadows and a lilac ground do not sort into two
     buckets. */
  (function(){
    var gl = P.renderer.getContext(), dpr = P.renderer.getPixelRatio();
    var vpS = P.viewport();
    if(!P.renderWithFX(P.scene, P.cam())) P.renderer.render(P.scene, P.cam());
    function contrast(x0, wide){
      var w29 = Math.round(wide*dpr), h29 = Math.round(190*dpr);
      var b = new W.Uint8Array(4*w29*h29);
      gl.readPixels(Math.round(x0*dpr), Math.round((vpS.h - CY - 60)*dpr), w29, h29,
                    gl.RGBA, gl.UNSIGNED_BYTE, b);
      var sum = 0, n = 0;
      for(var y=0;y<h29;y++){
        for(var x=1;x<w29;x++){
          var i = (y*w29 + x)*4, j = i - 4;
          sum += Math.abs(b[i] - b[j]); n++;
        }
      }
      return sum / Math.max(n,1);
    }
    var nearBlur = contrast(CX-350, 220);      // the ring pushed towards us
    var atFocus  = contrast(CX-80,  200);      // the one on the orbit point
    ck('...while what is at the orbit point stays sharp',
       atFocus > nearBlur * 1.6,
       'edge contrast ' + atFocus.toFixed(2) + ' at the focused ring against ' +
       nearBlur.toFixed(2) + ' at the near one');
  })();
  P.FX.dofOn = false;

  threeDepths();
  ck('grain lays noise over the image',
     frameDiff(function(){ P.FX.grainOn = true; P.FX.grain = 80; }) > 0.25,
     'at 80% level');
  P.FX.grainOn = false;

  threeDepths();
  ck('pixelation quantises it to blocks',
     frameDiff(function(){ P.FX.pixelOn = true; P.FX.pixel = 10; }) > 0.03,
     'at a 10px block');
  P.FX.pixelOn = false;

  /* NONE OF IT OUTSIDE RENDER MODE. The pass is a cost you ask for. */
  threeDepths();
  P.FX.dofOn = true; P.FX.grainOn = true; P.FX.pixelOn = true;
  P.ENV.render = false;
  ck('no effect runs outside render mode',
     P.fxActive() === false &&
     P.renderWithFX(P.scene, P.cam()) === false,
     'render mode off, so the pass declines and the frame goes straight out');
  P.ENV.render = true;
  ck('...and they all come back with it', P.fxActive() === true);
  P.FX.dofOn = false; P.FX.grainOn = false; P.FX.pixelOn = false;
  P.ENV.render = false;
  reset();

  /* ================= ground shadow ================= */
  group('Ground shadow — the sketch thrown down the light');

  function ringScene(){
    reset();
    P.TOOL.stableOn = false; P.TOOL.pressureOn = false; P.TOOL.autoGuide = false;
    P.VIEW.pinned = true; P.VIEW.pivot.set(0,0,0);
    P.VIEW.theta = 0.55; P.VIEW.phi = 1.15; P.VIEW.radius = 3.4; P.applyCamera();
    P.refreshDrawPlane();
    P.TOOL.brush = 'pen'; P.TOOL.sizeMM = 60; P.TOOL.opacity = 1;
    P.TOOL.color.set('#d9534f');
    var c27 = [];
    for(var q27=0;q27<=14;q27++){
      var t27 = q27/14*Math.PI*2;
      c27.push({x:CX+Math.cos(t27)*52, y:CY-70+Math.sin(t27)*52});
    }
    pen(c27);
    P.Guides.setActive(null);
    P.LIGHT.az = 0.6; P.LIGHT.alt = 0.62; P.LIGHT.intensity = 1.3;
    P.LIGHT.ambient = 0.5; P.applyLight();
    P.ENV.groundShadow = true;
  }
  /* A BLOCK around the ring, not a guessed line. Where the shadow lands on
     screen depends on the light, the camera and the ground all at once - the
     first version of this sampled a row twenty pixels below centre and found
     only background, because from this angle the ground the shadow falls on
     projects ABOVE centre. Averaging a block that certainly contains it is
     insensitive to all of that and still moves when the shadow appears. */
  function groundMean(){
    P.invalidateGroundShadow();
    P.updateGroundShadow();

  (function(){

    P.TOOL.stableOn = false; P.TOOL.pressureOn = false;
    P.VIEW.ortho = false; P.VIEW.focal = 50; P.VIEW.radius = 3.2;

  /* ================= restyling a selection ================= */
  group('Restyle — the brush panel edits selected curves');

  function threeStrokes(){

     doubled[0] === 40 && doubled[1] === 80 && doubled[2] === 160,
     doubled.join(' / ') + 'mm');

     doubled[2] / doubled[0] === 4, 'ratio ' + (doubled[2]/doubled[0]).toFixed(1) + ':1');

  P.UI.styleOnce('restyle brush', { brush: 'sketch' });
  var allYellow = P.Strokes.list.every(function(x){ return x.color.getHexString() === 'ffcc00'; }),
      allFaint  = P.Strokes.list.every(function(x){ return Math.abs(x.opacity - 0.4) < 1e-6; }),
      allSketch = P.Strokes.list.every(function(x){ return x.brush === 'sketch'; });

     allYellow && allFaint && allSketch,

     lone.color.getHexString() === 'cc3232' && lone.baseRadius === loneWas,
     'stroke is still #' + lone.color.getHexString() + ' at ' +

  group('Brushes');
  reset();
  var names = Object.keys(P.BRUSH);
  ck('eight brush profiles are defined', names.length === 8, names.join(', '));

  /* No two brushes may be the same brush wearing another name — that is what
     the old ten-entry set was: `pencil` was round at 0.7x and `chisel`,
     `ribbon` and `wide` were three hard blades apart only in width. Compare
     the profiles that actually shape the tube. */
  var samey = [];
  for(i=0;i<names.length;i++){
    for(var j2=i+1;j2<names.length;j2++){
      var A2 = P.BRUSH[names[i]], B2 = P.BRUSH[names[j2]];

      if(A2.taper !== B2.taper) diff++;
      if(Math.max(A2.wide,B2.wide) / Math.min(A2.wide,B2.wide) > 1.3) diff++;
      if(!!A2.glow !== !!B2.glow) diff++;

         ratio does: `flat` and `wide` are the same section, and what makes
         them two brushes is that one of them stays 2mm thick at any size */
      if(!!A2.thickMM !== !!B2.thickMM || A2.thickMM !== B2.thickMM) diff++;
      if(!!A2.halfWidthMM !== !!B2.halfWidthMM ||
         A2.halfWidthMM !== B2.halfWidthMM) diff++;
      if(!!A2.rise !== !!B2.rise) diff++;
      if(!!A2.grit !== !!B2.grit) diff++;
      if(!diff) samey.push(names[i] + '=' + names[j2]);
