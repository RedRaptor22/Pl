# Publishes the app to GitHub Pages so it can be opened on any device without
# cloning the repo. Whichever branch was pushed last is what the site serves;
# build.txt at the site root says which commit that is.
name: Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ONE-TIME SETUP: Settings -> Pages -> Build and deployment ->
      # Source: GitHub Actions. The token this workflow runs with is not
      # allowed to create the Pages site itself, so the attempt below is
      # allowed to fail; everything after it works once the switch is set.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Assemble the site
        run: python3 .github/pages/build.py site
        env:
          PLUME_SHA: ${{ github.sha }}
          PLUME_REF: ${{ github.ref_name }}

      # This is what actions/upload-pages-artifact@v3 does internally, spelled
      # out so the upload can set overwrite. Artifacts belong to the RUN, not
      # the attempt, so re-running a job that had already uploaded leaves two
      # named github-pages and deploy-pages refuses to choose between them.
      - name: Archive the site
        run: |
          tar --dereference --hard-dereference \
            --directory site \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - id: deploy
        uses: actions/deploy-pages@v4
